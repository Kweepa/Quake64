  const skinHeight = r.i32();
  const numVerts = r.i32();
  const numTris = r.i32();
  const numFrames = r.i32();
  r.i32();
  r.i32();
  r.f32();

  if (numVerts <= 0 || numVerts > 10000 || numTris <= 0 || numTris > 20000 || numFrames <= 0) {
    throw new Error("MDL has no geometry");
  }

  skipSkins(r, numSkins, skinWidth, skinHeight);

  r.check(numVerts * 12, "stverts");
  r.skip(numVerts * 12);

  const tris = [];
  r.check(numTris * 16, "tris");
  for (let i = 0; i < numTris; i++) {
    r.i32();
    tris.push([r.i32(), r.i32(), r.i32()]);
  }

  const frames = [];
  for (let i = 0; i < numFrames; i++) {
    r.check(4, "frame type");
    const typ = r.i32();
    if (typ === ALIAS_SINGLE) {
      frames.push(readSimpleFrame(r, numVerts));
    } else {
      r.check(4, "group count");
      const n = r.i32();
      if (n < 0 || n > 256) throw new Error("MDL frame group too large");
      r.check(8 + n * 4, "group header");
      r.skip(8);
      r.skip(n * 4);
      for (let j = 0; j < n; j++) frames.push(readSimpleFrame(r, numVerts));
    }
  }

  const clips = [];
  const byKey = new Map();
  for (let i = 0; i < frames.length; i++) {
    const key = clipKey(frames[i].name);
    let clip = byKey.get(key);
    if (!clip) {
      clip = { name: key, frames: [] };
      byKey.set(key, clip);
      clips.push(clip);
    }
    clip.frames.push({ name: frames[i].name, index: i });
  }

  return {
    numVerts,
    scale,
    origin,
    tris,
    edges: uniqueEdges(tris),
    frames,
    clips,
  };
}

/** Quake hull mins.z / modelgen $origin z — origin sits this far above the floor. */
const HULL_FLOOR = 24;

/** Quake +X forward / +Z up → editor +Z forward / +Y up. */
function quakeToEditor(qx, qy, qz) {
  return { x: -qy, y: qz, z: qx };
}

function decodeConverted(mdl, frameIndex) {
  const fr = mdl.frames[frameIndex];
  const [sx, sy, sz] = mdl.scale;
  const [ox, oy, oz] = mdl.origin;
  const packed = fr.verts;
  const out = new Array(mdl.numVerts);
  for (let i = 0; i < mdl.numVerts; i++) {
    const qx = packed[i * 3] * sx + ox;
    const qy = packed[i * 3 + 1] * sy + oy;
    const qz = packed[i * 3 + 2] * sz + oz;
    out[i] = quakeToEditor(qx, qy, qz);
  }
  return out;
}

function mdlEditorVerts(mdl, frameIndex, scale) {
  const raw = decodeConverted(mdl, frameIndex);
  const n = Number(scale);
  const s = Number.isFinite(n) ? Math.max(0.1, Math.min(2, n)) : 0.7;
  return raw.map((v) => ({ x: v.x * s, y: (v.y + HULL_FLOOR) * s, z: v.z * s }));
}

/** Build stick poses + clip table from bound MDL clips (selected names, or default kept set). */
function buildStickFramesFromMdl(mdl, rig, scale, restFrame, clampVert, clipNames) {
  const kept = selectMdlClips(mdl, clipNames);
  const frames = [];
  const clips = [];
  let start = 0;
  for (const clip of kept) {
    clips.push({ name: clip.name, start, len: clip.frames.length });
    for (const fr of clip.frames) {
      const verts = mdlEditorVerts(mdl, fr.index, scale);
      const avg = averageJointPositions(verts, rig.jointVerts);
      const pose = restFrame.map((v, i) => {
        if (avg[i]) {
          return {
            x: clampVert(Math.round(avg[i].x)),
            y: clampVert(Math.round(avg[i].y)),
            z: clampVert(Math.round(avg[i].z)),
          };
        }
        return { x: v.x, y: v.y, z: v.z };
      });
      frames.push(pose);
    }
    start += clip.frames.length;
  }
  return { frames, clips };
}

function averageJointPositions(verts, jointVerts) {
  return jointVerts.map((indices) => {
    if (!indices || !indices.length) return null;
    let x = 0;
    let y = 0;
    let z = 0;
    let n = 0;
    for (const i of indices) {
      const v = verts[i];
      if (!v) continue;
      x += v.x;
      y += v.y;
      z += v.z;
      n++;
    }
    if (!n) return null;
    return { x: x / n, y: y / n, z: z / n };
  });
}

function loadEnemyMdls(lumps) {
  const models = {};
  const missing = [];
  for (const [enemy, path] of Object.entries(ENEMY_MDL_PATHS)) {
    const buf = lumps.get(path.toLowerCase());
    if (!buf) {
      missing.push(enemy);
      continue;
    }
    try {
      models[enemy] = parseMdl(buf);
    } catch (err) {
      missing.push(enemy);
      console.warn(`Failed to parse ${path}:`, err);
    }
  }
  return { models, missing };
}

const WEAPON_MDL_PATHS = {
  axe: "progs/v_axe.mdl",
  shot2: "progs/v_shot2.mdl",
  nail: "progs/v_nail.mdl",
  rock: "progs/v_rock.mdl",
};

const WEAPON_SPRITE_W = 48;
const WEAPON_SPRITE_H = 42;
const WEAPON_FOV_X = 90;
const WEAPON_VIEW_W = 320;
const WEAPON_VIEW_H = 200;
const WEAPON_NEAR = 0.05;

function calcFovY(fovXDeg, width, height) {
  const x = width / Math.tan((fovXDeg / 360) * Math.PI);
  return (Math.atan(height / x) * 360) / Math.PI;
}

const WEAPON_FOV_Y = calcFovY(WEAPON_FOV_X, WEAPON_VIEW_W, WEAPON_VIEW_H);
const WEAPON_XSCALE = WEAPON_VIEW_W * 0.5 / Math.tan((WEAPON_FOV_X * Math.PI) / 360);
const WEAPON_YSCALE = WEAPON_VIEW_H * 0.5 / Math.tan((WEAPON_FOV_Y * Math.PI) / 360);

const QUAD_COPLANAR_DOT = 0.9;
const QUAD_PLANE_REL = 0.15;

function edgeKey(a, b) {
  return a < b ? `${a}:${b}` : `${b}:${a}`;
}

function sub3(a, b) {
  return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
}

function dot3(a, b) {
  return a.x * b.x + a.y * b.y + a.z * b.z;
}

function cross3(a, b) {
  return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
}

function len3v(v) {
  return Math.hypot(v.x, v.y, v.z);
}

function triEdges(t) {
  return [
    [t[0], t[1]],
    [t[1], t[2]],
    [t[2], t[0]],
  ];
}

function triFace(t) {
  return {
    tri: t,
    tris: [t],
    edges: triEdges(t),
  };
}

function quadFace(t0, t1, sharedKey) {
  const edges = [];
  for (const [a, b] of [...triEdges(t0), ...triEdges(t1)]) {
    if (edgeKey(a, b) === sharedKey) continue;
    edges.push([a, b]);
  }
  return { tri: t0, tris: [t0, t1], edges };
}

function apexOf(t, sa, sb) {
  for (const i of t) {
    if (i !== sa && i !== sb) return i;
  }
  return -1;
}

function triNormal(verts, t) {
  const a = verts[t[0]];
  const b = verts[t[1]];
  const c = verts[t[2]];
  if (!a || !b || !c) return null;
  const n = cross3(sub3(b, a), sub3(c, a));
  const l = len3v(n);
  if (l < 1e-12) return null;
  return { x: n.x / l, y: n.y / l, z: n.z / l, origin: a };
}

function triMeanEdge(verts, t) {
  const a = verts[t[0]];
  const b = verts[t[1]];
  const c = verts[t[2]];
  return (len3v(sub3(b, a)) + len3v(sub3(c, b)) + len3v(sub3(a, c))) / 3;
}

function unitDir(a, b) {
  const d = sub3(b, a);
  const l = len3v(d);
  if (l < 1e-12) return null;
  return { x: d.x / l, y: d.y / l, z: d.z / l };
}

/** Pair coplanar neighbor tris that share an MDL edge (drop that diagonal). */
function mdlQuadEdges(tris, verts) {
  const n = tris.length;
  const quads = [];
  if (!n) return quads;
  if (!verts?.length) {
    for (const t of tris) quads.push(triFace(t));
    return quads;
  }

  const byEdge = new Map();
  for (let ti = 0; ti < n; ti++) {
    for (const [a, b] of triEdges(tris[ti])) {
      const k = edgeKey(a, b);
      let list = byEdge.get(k);
      if (!list) {
        list = [];
        byEdge.set(k, list);
      }
      list.push({ ti, a, b });
    }
  }

  const cands = [];
  for (const [k, list] of byEdge) {
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const i0 = list[i].ti;
        const i1 = list[j].ti;
        if (i0 === i1) continue;
        const scored = scoreNeighborTris(verts, tris[i0], tris[i1], list[i].a, list[i].b);
        if (!scored?.pass) continue;
        const sa = verts[list[i].a];
        const sb = verts[list[i].b];
        cands.push({
          i0,
          i1,
          k,
          score: scored.coplanarDot + 0.25 * scored.parallelMax,
          len: sa && sb ? len3v(sub3(sb, sa)) : 0,
        });
      }
    }
  }

  cands.sort((a, b) => b.len - a.len || b.score - a.score);
  const used = new Uint8Array(n);
  for (const c of cands) {
    if (used[c.i0] || used[c.i1]) continue;
    used[c.i0] = 1;
    used[c.i1] = 1;
    quads.push(quadFace(tris[c.i0], tris[c.i1], c.k));
  }
  for (let i = 0; i < n; i++) {
    if (!used[i]) quads.push(triFace(tris[i]));
  }
  return quads;
}

function quadConvex(ring, n) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = ring[i];
    const b = ring[(i + 1) % 4];
    const c = ring[(i + 2) % 4];
    const turn = dot3(n, cross3(sub3(b, a), sub3(c, b)));
    if (Math.abs(turn) < 1e-8) continue;
    const s = turn > 0 ? 1 : -1;
    if (sign === 0) sign = s;
    else if (s !== sign) return false;
  }
  return sign !== 0;
}

function sideSign(sa, sb, p, n) {
  return dot3(n, cross3(sub3(sb, sa), sub3(p, sa)));
}

function apexesOpposite(sa, sb, p0, p1, n) {
  return sideSign(sa, sb, p0, n) * sideSign(sa, sb, p1, n) < 0;
}

/** [sa, p0, sb, p1] is a bowtie if both apexes sit on the same side of sa–sb. */
function orderQuadRing(sa, p0, sb, p1, n) {
  const tries = [
    [sa, p0, sb, p1],
    [sa, p1, sb, p0],
    [sa, p0, p1, sb],
    [sa, p1, p0, sb],
  ];
  for (const ring of tries) {
    if (quadConvex(ring, n)) return ring;
  }
  return null;
}

function oppositeParallel(ring) {
  const d0 = unitDir(ring[0], ring[1]);
  const d1 = unitDir(ring[1], ring[2]);
  const d2 = unitDir(ring[2], ring[3]);
  const d3 = unitDir(ring[3], ring[0]);
  if (!d0 || !d1 || !d2 || !d3) return 0;
  return Math.max(Math.abs(dot3(d0, d2)), Math.abs(dot3(d1, d3)));
}

function pointsNormal(a, b, c) {
  return triNormal([a, b, c], [0, 1, 2]);
}

/** One triangle: unit normal used by the coplanar gate. */
function inspectTriNormal(a, b, c) {
  const n = pointsNormal(a, b, c);
  if (!n) return null;
  return { x: n.x, y: n.y, z: n.z };
}

function scoreNeighborTris(verts, t0, t1, sa, sb) {
  const n0 = triNormal(verts, t0);
  let n1 = triNormal(verts, t1);
  if (!n0 || !n1) return null;
  let coplanarDot = dot3(n0, n1);
  if (coplanarDot < 0) {
    n1 = { x: -n1.x, y: -n1.y, z: -n1.z, origin: n1.origin };
    coplanarDot = -coplanarDot;
  }
  const p0 = apexOf(t0, sa, sb);
  const p1 = apexOf(t1, sa, sb);
  if (p0 < 0 || p1 < 0) return null;
  const mean = (triMeanEdge(verts, t0) + triMeanEdge(verts, t1)) * 0.5 || 1;
  const plane0 = Math.abs(dot3(n1, sub3(verts[p0], n1.origin))) / mean;
  const plane1 = Math.abs(dot3(n0, sub3(verts[p1], n0.origin))) / mean;
  const nAvg = { x: n0.x + n1.x, y: n0.y + n1.y, z: n0.z + n1.z };
  const nl = len3v(nAvg);
  if (nl < 1e-12) return null;
  nAvg.x /= nl;
  nAvg.y /= nl;
  nAvg.z /= nl;
  const va = verts[sa];
  const vb = verts[sb];
  const vp0 = verts[p0];
  const vp1 = verts[p1];
  const diagonal = apexesOpposite(va, vb, vp0, vp1, nAvg);
  const ring = orderQuadRing(va, vp0, vb, vp1, nAvg);
  const convex = !!ring;
  const parallelMax = ring ? oppositeParallel(ring) : 0;
  const planeRel = Math.max(plane0, plane1);
  return {
    coplanarDot,
    planeRel,
    convex,
    diagonal,
    parallelMax,
    shared: [sa, sb],
    pass:
      coplanarDot >= QUAD_COPLANAR_DOT &&
      planeRel < QUAD_PLANE_REL &&
      convex &&
      diagonal,
  };
}

function sharedEdgeIndices(t0, t1) {
  const s1 = new Set(t1);
  const shared = [];
  for (const i of t0) {
    if (s1.has(i)) shared.push(i);
  }
  return shared.length === 2 ? shared : null;
}

function triKey(t) {
  return [t[0], t[1], t[2]].sort((a, b) => a - b).join(":");
}

function quadsIncludePair(quads, t0, t1) {
  if (!quads?.length || !t0 || !t1) return false;
  const a = triKey(t0);
  const b = triKey(t1);
  for (const q of quads) {
    const ts = q.tris;
    if (!ts || ts.length !== 2) continue;
    const keys = [triKey(ts[0]), triKey(ts[1])];
    if (keys.includes(a) && keys.includes(b)) return true;
  }
  return false;
}

function mdlEnsureQuads(mdl) {
  if (!mdl) return [];
  if (!mdl.quads) mdl.quads = mdlQuadEdges(mdl.tris, mdlQuakeVerts(mdl, 0));
  return mdl.quads;
}

/** Four selected indices: score the MDL triangle pair that uses them, if any. */
function inspectQuadPair(tris, indices, verts, quads) {
  if (!tris?.length || !indices || indices.length !== 4 || !verts?.length) return null;
  const set = new Set(indices);
  if (set.size !== 4) return null;
  const hits = [];
  for (const t of tris) {
    if (t.every((i) => set.has(i))) hits.push(t);
  }
  for (let i = 0; i < hits.length; i++) {
    for (let j = i + 1; j < hits.length; j++) {
      const se = sharedEdgeIndices(hits[i], hits[j]);
      if (!se) continue;
      const union = new Set([...hits[i], ...hits[j]]);
      if (union.size !== 4) continue;
      const scored = scoreNeighborTris(verts, hits[i], hits[j], se[0], se[1]);
      if (!scored) return { noModelPair: true };
      scored.paired = quadsIncludePair(quads, hits[i], hits[j]);
      return scored;
    }
  }
  return { noModelPair: true };
}

/** Packed MDL verts in Quake model space (+X forward, +Y left, +Z up). */
function mdlQuakeVerts(mdl, frameIndex) {
  const fr = mdl.frames[frameIndex];
  if (!fr) return [];
  const [sx, sy, sz] = mdl.scale;
  const [ox, oy, oz] = mdl.origin;
  const packed = fr.verts;
  const out = new Array(mdl.numVerts);
  for (let i = 0; i < mdl.numVerts; i++) {
    out[i] = {
      x: packed[i * 3] * sx + ox,
      y: packed[i * 3 + 1] * sy + oy,
      z: packed[i * 3 + 2] * sz + oz,
    };
  }
  return out;
}

/** Identity view-model: camera X=-Y, Y=+Z, Z=+X; FOV 90 on 320×200. */
function projectViewVert(v) {
  const cx = -v.y;
  const cy = v.z;
  const cz = v.x;
  if (cz < WEAPON_NEAR) return { cx, cy, cz, ok: false, sx: 0, sy: 0 };
  return {
    cx,
    cy,
    cz,
    ok: true,
    sx: WEAPON_VIEW_W * 0.5 + WEAPON_XSCALE * (cx / cz),
    sy: WEAPON_VIEW_H * 0.5 - WEAPON_YSCALE * (cy / cz),
  };
}

function viewFaceTowardCamera(p0, p1, p2) {
  if (!p0.ok || !p1.ok || !p2.ok) return false;
  const ax = p1.cx - p0.cx;
  const ay = p1.cy - p0.cy;
  const az = p1.cz - p0.cz;
  const bx = p2.cx - p0.cx;
  const by = p2.cy - p0.cy;
  const bz = p2.cz - p0.cz;
  const nx = ay * bz - az * by;
  const ny = az * bx - ax * bz;
  const nz = ax * by - ay * bx;
  return nx * p0.cx + ny * p0.cy + nz * p0.cz < 0;
}

function toSpritePos(sx, sy, scale, pan) {
  return {
    x: scale * (sx - WEAPON_VIEW_W * 0.5) + WEAPON_SPRITE_W * 0.5 + (pan?.x || 0),
    y: scale * (sy - WEAPON_VIEW_H * 0.5) + WEAPON_SPRITE_H * 0.5 + (pan?.y || 0),
  };
}

function defaultWeaponFrames(mdl, key) {
  if (!mdl?.frames?.length) return [0];
  if (key !== "axe") return [0];
  const out = [];
  const seen = new Set();
  const add = (i) => {
    const n = i | 0;
    if (n < 0 || n >= mdl.frames.length || seen.has(n)) return;
    seen.add(n);
    out.push(n);
  };
  add(0);
  for (const clip of mdl.clips || []) {
    if (/^axea/i.test(clip.name)) {
      for (const fr of clip.frames) add(fr.index);
    }
  }
  return out.length ? out : [0];
}

function resolveWeaponFrames(item, mdl, key) {
  if (Array.isArray(item?.frames)) {
    const max = mdl?.frames?.length ?? 4096;
    const seen = new Set();
    const out = [];
    for (const f of item.frames) {
      const n = f | 0;
      if (n < 0 || n >= max || seen.has(n)) continue;
      seen.add(n);
      out.push(n);
    }
    return out;
  }
  return defaultWeaponFrames(mdl, key);
}

function loadWeaponMdls(lumps) {
  const models = {};
  const missing = [];
  for (const [key, path] of Object.entries(WEAPON_MDL_PATHS)) {
    const buf = lumps.get(path.toLowerCase());
    if (!buf) {
      missing.push(key);
      continue;
    }
    try {
      models[key] = parseMdl(buf);
    } catch (err) {
      missing.push(key);
      console.warn(`Failed to parse ${path}:`, err);
    }
  }
  return { models, missing };
}

const ZBUF_MAX = 256;
const VIEW_Z_SCALE = 8;
const VIEW_ZBUF_MAX = 768;
const TRI_ID_EMPTY = 0xffff;
const Z_EDGE_SLACK = 1.02;

function spriteAabb(pts) {
  let minX = 0;
  let minY = 0;
  let maxX = WEAPON_SPRITE_W;
  let maxY = WEAPON_SPRITE_H;
  for (const p of pts) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  return {
    minX: Math.floor(minX) - 1,
    minY: Math.floor(minY) - 1,
    maxX: Math.ceil(maxX) + 1,
    maxY: Math.ceil(maxY) + 1,
  };
}

function scaledVert(p, originX, originY, scale) {
  return {
    x: (p.x - originX) * scale,
    y: (p.y - originY) * scale,
    z: p.z,
    iz: p.iz,
  };
}

function makeZctx(frontTris, aabb, scale, maxDim) {
  const spanX = Math.max(1, aabb.maxX - aabb.minX);
  const spanY = Math.max(1, aabb.maxY - aabb.minY);
  let s = Math.min(scale, maxDim / spanX, maxDim / spanY);
  if (!(s > 0)) s = 1;
  const bw = Math.max(1, Math.ceil(spanX * s));
  const bh = Math.max(1, Math.ceil(spanY * s));
  const zbuf = new Float32Array(bw * bh);
  zbuf.fill(1e12);
  const triId = new Uint16Array(bw * bh);
  triId.fill(TRI_ID_EMPTY);
  for (const ft of frontTris) {
    fillTriZ(
      zbuf,
      triId,
      ft.ti,
      0,
      0,
      bw,
      bh,
      scaledVert(ft.a, aabb.minX, aabb.minY, s),
      scaledVert(ft.b, aabb.minX, aabb.minY, s),
      scaledVert(ft.c, aabb.minX, aabb.minY, s)
    );
  }
  return { zbuf, triId, minX: 0, minY: 0, bw, bh, originX: aabb.minX, originY: aabb.minY, scale: s };
}

function spriteVert(p, scale, pan) {
  const s = toSpritePos(p.sx, p.sy, scale, pan);
  return { x: s.x, y: s.y, z: p.cz, iz: 1 / p.cz };
}

function faceToward(proj, tri) {
  return viewFaceTowardCamera(proj[tri[0]], proj[tri[1]], proj[tri[2]]);
}

function trisSharingEdge(tris, proj, ia, ib) {
  const adj = new Set();
  for (let ti = 0; ti < tris.length; ti++) {
    const t = tris[ti];
    if (t[0] !== ia && t[1] !== ia && t[2] !== ia) continue;
    if (t[0] !== ib && t[1] !== ib && t[2] !== ib) continue;
    if (!faceToward(proj, t)) continue;
    adj.add(ti);
  }
  return adj;
}

function fillTriZ(zbuf, triId, ti, ox, oy, bw, bh, a, b, c) {
  const minX = Math.max(0, Math.floor(Math.min(a.x, b.x, c.x) - ox));
  const maxX = Math.min(bw - 1, Math.ceil(Math.max(a.x, b.x, c.x) - ox));
  const minY = Math.max(0, Math.floor(Math.min(a.y, b.y, c.y) - oy));
  const maxY = Math.min(bh - 1, Math.ceil(Math.max(a.y, b.y, c.y) - oy));
  if (minX > maxX || minY > maxY) return;
  const denom = (b.y - c.y) * (a.x - c.x) + (c.x - b.x) * (a.y - c.y);
  if (Math.abs(denom) < 1e-8) return;
  const inv = 1 / denom;
  for (let y = minY; y <= maxY; y++) {
    const py = y + oy + 0.5;
    for (let x = minX; x <= maxX; x++) {
      const px = x + ox + 0.5;
      const w0 = ((b.y - c.y) * (px - c.x) + (c.x - b.x) * (py - c.y)) * inv;
      const w1 = ((c.y - a.y) * (px - c.x) + (a.x - c.x) * (py - c.y)) * inv;
      const w2 = 1 - w0 - w1;
      if (w0 < -1e-4 || w1 < -1e-4 || w2 < -1e-4) continue;
      const iz = w0 * a.iz + w1 * b.iz + w2 * c.iz;
      if (iz <= 0) continue;
      const z = 1 / iz;
      const i = y * bw + x;
      if (z < zbuf[i]) {
        zbuf[i] = z;
        triId[i] = ti;
      }
    }
  }
}

function segmentT(a, b, px, py) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  if (len2 < 1e-12) return 0;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
  if (t < 0) return 0;
  if (t > 1) return 1;
  return t;
}

function lerpDepth(a, b, t) {
  const iz = a.iz * (1 - t) + b.iz * t;
  return iz > 0 ? 1 / iz : 1e9;
}

function edgePixelVisible(zctx, x, y, a, b, adj) {
  const bx = Math.floor(x - zctx.minX);
  const by = Math.floor(y - zctx.minY);
  if (bx < 0 || by < 0 || bx >= zctx.bw || by >= zctx.bh) return false;
  const i = by * zctx.bw + bx;
  const owner = zctx.triId[i];
  if (owner === TRI_ID_EMPTY) return true;
  if (adj.has(owner)) return true;
  const cx = bx + zctx.minX + 0.5;
  const cy = by + zctx.minY + 0.5;
  const z = lerpDepth(a, b, segmentT(a, b, cx, cy));
  return z <= zctx.zbuf[i] * Z_EDGE_SLACK;
}

function toZspace(p, zctx) {
  return scaledVert(p, zctx.originX, zctx.originY, zctx.scale);
}

function fromZspace(x, y, zctx) {
  return {
    x: x / zctx.scale + zctx.originX,
    y: y / zctx.scale + zctx.originY,
  };
}

/** Visible bits of an edge in projected sprite space (no pixel snapping). */
function edgeRuns(zctx, a, b, adj) {
  const ha = toZspace(a, zctx);
  const hb = toZspace(b, zctx);
  const dist = Math.hypot(hb.x - ha.x, hb.y - ha.y);
  const n = Math.max(2, Math.ceil(dist * 2));
  const runs = [];
  let run = null;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = ha.x + (hb.x - ha.x) * t;
    const y = ha.y + (hb.y - ha.y) * t;
    if (edgePixelVisible(zctx, x, y, ha, hb, adj)) {
      const p = fromZspace(x, y, zctx);
      if (!run) run = { ax: p.x, ay: p.y, bx: p.x, by: p.y };
      else {
        run.bx = p.x;
        run.by = p.y;
      }
    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs;
}

function leftToRight(a, b) {
  if (a.x < b.x || (a.x === b.x && a.y <= b.y)) return [a, b];
  return [b, a];
}

function plotSpritePixel(pixels, x, y, zctx, adj, za, zb) {
  if (x < 0 || y < 0 || x >= WEAPON_SPRITE_W || y >= WEAPON_SPRITE_H) return;
  if (zctx) {
    const p = toZspace({ x: x + 0.5, y: y + 0.5, iz: 0 }, zctx);
    if (!edgePixelVisible(zctx, p.x, p.y, za, zb, adj)) return;
  }
  pixels[y * WEAPON_SPRITE_W + x] = 1;
}

/** Thin 8-connected Bresenham: one pixel per major-axis step, no corner elbows. */
function plotSpriteLine(pixels, a, b, zctx, adj) {
  [a, b] = leftToRight(a, b);
  const za = zctx ? toZspace(a, zctx) : null;
  const zb = zctx ? toZspace(b, zctx) : null;
  let x = Math.round(a.x);
  let y = Math.round(a.y);
  const xEnd = Math.round(b.x);
  const yEnd = Math.round(b.y);
  const dx = Math.abs(xEnd - x);
  const dy = Math.abs(yEnd - y);
  const sx = x < xEnd ? 1 : -1;
  const sy = y < yEnd ? 1 : -1;
  if (dx >= dy) {
    let err = 2 * dy - dx;
    for (;;) {
      plotSpritePixel(pixels, x, y, zctx, adj, za, zb);
      if (x === xEnd) break;
      if (err >= 0) {
        y += sy;
        err -= 2 * dx;
      }
      err += 2 * dy;
      x += sx;
    }
  } else {
    let err = 2 * dx - dy;
    for (;;) {
      plotSpritePixel(pixels, x, y, zctx, adj, za, zb);
      if (y === yEnd) break;
      if (err >= 0) {
        x += sx;
        err -= 2 * dy;
      }
      err += 2 * dx;
      y += sy;
    }
  }
}

function visibleWeaponMesh(mdl, frameIndex, scale, pan) {
  const verts = mdlQuakeVerts(mdl, frameIndex);
  const proj = verts.map(projectViewVert);
  const quads = mdlEnsureQuads(mdl);
  const pts = [];
  const frontTris = [];
  const frontEdges = [];
  const seenEdge = new Set();
  let clipped = false;

  for (let ti = 0; ti < mdl.tris.length; ti++) {
    const t = mdl.tris[ti];
    if (!faceToward(proj, t)) continue;
    const a = proj[t[0]];
    const b = proj[t[1]];
    const c = proj[t[2]];
    if (!a.ok || !b.ok || !c.ok) continue;
    const pa = spriteVert(a, scale, pan);
    const pb = spriteVert(b, scale, pan);
    const pc = spriteVert(c, scale, pan);
    frontTris.push({ a: pa, b: pb, c: pc, ti });
    pts.push(pa, pb, pc);
  }

  for (const q of quads) {
    const tris = q.tris || [q.tri];
    if (!tris.some((t) => faceToward(proj, t))) continue;
    for (const [ia, ib] of q.edges) {
      const a = proj[ia];
      const b = proj[ib];
      if (!a?.ok || !b?.ok) {
        clipped = true;
        continue;
      }
      const k = edgeKey(ia, ib);
      if (seenEdge.has(k)) continue;
      seenEdge.add(k);
      const pa = spriteVert(a, scale, pan);
      const pb = spriteVert(b, scale, pan);
      const adj = trisSharingEdge(mdl.tris, proj, ia, ib);
      const [la, lb] = leftToRight(pa, pb);
      frontEdges.push({ a: la, b: lb, adj });
      pts.push(pa, pb);
      if (
        pa.x < 0 ||
        pa.y < 0 ||
        pa.x >= WEAPON_SPRITE_W ||
        pa.y >= WEAPON_SPRITE_H ||
        pb.x < 0 ||
        pb.y < 0 ||
        pb.x >= WEAPON_SPRITE_W ||
        pb.y >= WEAPON_SPRITE_H
      ) {
        clipped = true;
      }
    }
  }

  const segs = [];
  const pixels = new Uint8Array(WEAPON_SPRITE_W * WEAPON_SPRITE_H);
  const viewAabb = spriteAabb(pts);
  const zView = makeZctx(frontTris, viewAabb, VIEW_Z_SCALE, VIEW_ZBUF_MAX);
  const zBake = makeZctx(frontTris, { minX: 0, minY: 0, maxX: WEAPON_SPRITE_W, maxY: WEAPON_SPRITE_H }, 1, ZBUF_MAX);
  for (const e of frontEdges) {
    for (const run of edgeRuns(zView, e.a, e.b, e.adj)) segs.push(run);
  }
  for (const e of frontEdges) plotSpriteLine(pixels, e.a, e.b, zBake, e.adj);

  return { segs, pixels, clipped };
}

function projectedWeaponEdges(mdl, frameIndex, scale, pan) {
  const { segs, clipped } = visibleWeaponMesh(mdl, frameIndex, scale, pan);
  return { segs, clipped };
}

function rasterWeaponFrame(mdl, frameIndex, scale, pan) {
  return visibleWeaponMesh(mdl, frameIndex, scale, pan);
}


// ---- js/layoutView.js ----
/** Ramp AABB wireframe without the y=max face (open top). */
const SLOPE_TOP = new Set([2, 3, 6, 7]);
const SLOPE_BOX_EDGES = BOX_EDGES.filter(([i, j]) => !(SLOPE_TOP.has(i) && SLOPE_TOP.has(j)));

function edgeKey(i, j) {
  return i < j ? `${i},${j}` : `${j},${i}`;
}

/** Verticals on the low run face — phantom y=max corners, not part of the ramp. */
function rampPhantomVerticals(obj) {
  if (obj.axis === "x") {
    return obj.dir === 1
      ? [
          [3, 0],
          [7, 4],
        ]
      : [
          [1, 2],
          [5, 6],
        ];
  }
  return obj.dir === 1
    ? [
        [1, 2],
        [3, 0],
      ]
    : [
        [5, 6],
        [7, 4],
      ];
}

function rampBoxEdges(obj) {
  const drop = new Set(rampPhantomVerticals(obj).map(([i, j]) => edgeKey(i, j)));
  return SLOPE_BOX_EDGES.filter(([i, j]) => !drop.has(edgeKey(i, j)));
}

function rampCorners(obj) {
  const lowY = obj.y;
  const highY = obj.y + obj.sy;
  if (obj.axis === "x") {
    const x0 = obj.dir === 1 ? obj.x : obj.x + obj.sx;
    const x1 = obj.dir === 1 ? obj.x + obj.sx : obj.x;
    return {
      p0: { x: x0, y: lowY, z: obj.z },
      p1: { x: x0, y: lowY, z: obj.z + obj.sz },
      p2: { x: x1, y: highY, z: obj.z + obj.sz },
      p3: { x: x1, y: highY, z: obj.z },
    };
  }
  const z0 = obj.dir === 1 ? obj.z : obj.z + obj.sz;
  const z1 = obj.dir === 1 ? obj.z + obj.sz : obj.z;
  return {
    p0: { x: obj.x, y: lowY, z: z0 },
    p1: { x: obj.x + obj.sx, y: lowY, z: z0 },
    p2: { x: obj.x + obj.sx, y: highY, z: z1 },
    p3: { x: obj.x, y: highY, z: z1 },
  };
}

/** Open-top AABB plus ramp surface sides and ridge. */
function rampSegments(obj) {
  const segs = [];
  for (const [i, j] of rampBoxEdges(obj)) {
    segs.push({ a: cornerWorld(obj, i), b: cornerWorld(obj, j) });
  }
  const { p0, p1, p2, p3 } = rampCorners(obj);
  segs.push({ a: p0, b: p3 }, { a: p1, b: p2 }, { a: p3, b: p2 });
  return segs;
}

const HANDLE = 7;
const LINE_HIT = 8;
const LAYOUT_BOX_CLICK = 4;
const ZOOM_K = 0.008;

class LayoutView {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {object} opts
   */
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.camera = {
      x: 28,
      y: 10,
      z: -6,
      yaw: 0.35,
      pitch: -0.2,
      speed: 28,
    };
    this.keys = new Set();
    this.look = false;
    this.orbit = null;
    this.pan = null;
    this.zoom = null;
    this.lastT = 0;
    this.hoverId = null;
    this.hoverGizmo = null;
    this.drag = null;
    this.gridY = 0;
    this.placePreview = null;
    this.placePreviewOverCanvas = false;
    this.enabled = true;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    canvas.addEventListener("auxclick", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    window.addEventListener("keydown", (e) => this.#onKey(e, true));
    window.addEventListener("keyup", (e) => this.#onKey(e, false));

    this._raf = (t) => {
      if (this.enabled) this.#tick(t);
      else this.lastT = t;
      requestAnimationFrame(this._raf);
    };
    requestAnimationFrame(this._raf);
  }

  resize() {
    if (!this.enabled) return;
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  setPlacePreview(obj, overCanvas) {
    this.placePreview = obj;
    this.placePreviewOverCanvas = overCanvas;
  }

  clearPlacePreview() {
    this.placePreview = null;
    this.placePreviewOverCanvas = false;
  }

  #focused() {
    return document.activeElement === this.canvas;
  }

  #onKey(e, down) {
    if (!this.enabled) return;
    if (!this.#focused() && down) return;
    const k = e.key.toLowerCase();
    if ("wasdqe".includes(k) || k === "shift") {
      if (down) this.keys.add(k);
      else this.keys.delete(k);
      if (down) e.preventDefault();
    }
  }

  #tick(t) {
    const dt = this.lastT ? Math.min(0.05, (t - this.lastT) / 1000) : 0;
    this.lastT = t;
    let moved = false;
    if (this.#focused()) {
      const { forward, right, up } = lookVectors(this.camera.yaw, this.camera.pitch);
      const boost = this.keys.has("shift") ? 3 : 1;
      const sp = this.camera.speed * boost * dt;
      if (this.keys.has("w")) {
        this.camera.x += forward.x * sp;
        this.camera.y += forward.y * sp;
        this.camera.z += forward.z * sp;
        moved = true;
      }
      if (this.keys.has("s")) {
        this.camera.x -= forward.x * sp;
        this.camera.y -= forward.y * sp;
        this.camera.z -= forward.z * sp;
        moved = true;
      }
      if (this.keys.has("d")) {
        this.camera.x += right.x * sp;
        this.camera.y += right.y * sp;
        this.camera.z += right.z * sp;
        moved = true;
      }
      if (this.keys.has("a")) {
        this.camera.x -= right.x * sp;
        this.camera.y -= right.y * sp;
        this.camera.z -= right.z * sp;
        moved = true;
      }
      if (this.keys.has("e")) {
        this.camera.x += up.x * sp;
        this.camera.y += up.y * sp;
        this.camera.z += up.z * sp;
        moved = true;
      }
      if (this.keys.has("q")) {
        this.camera.x -= up.x * sp;
        this.camera.y -= up.y * sp;
        this.camera.z -= up.z * sp;
        moved = true;
      }
    }
    if (moved) this.opts.onViewChanged?.();
    this.draw();
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #selectedIds() {
    return this.opts.getSelectedIds?.() || [];
  }

  #primaryId() {
    const ids = this.#selectedIds();
    return ids.length ? ids[ids.length - 1] : null;
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.canvas.focus();
    const { forward } = lookVectors(this.camera.yaw, this.camera.pitch);
    const notches = e.deltaY / 100;
    const dist = -notches * this.camera.speed * 0.35;
    this.camera.x += forward.x * dist;
    this.camera.y += forward.y * dist;
    this.camera.z += forward.z * dist;
    this.opts.onViewChanged?.();
    this.draw();
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    if (e.button === 1) {
      if (e.altKey) {
        this.orbit = this.#beginOrbit(p);
      } else {
        this.pan = this.#beginOrbit(p);
      }
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 2) {
      if (e.altKey) {
        this.zoom = this.#beginOrbit(p);
        this.canvas.setPointerCapture(e.pointerId);
        return;
      }
      this.look = true;
      this.lookLast = p;
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;
    if (e.altKey) {
      e.preventDefault();
      this.orbit = this.#beginOrbit(p);
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const doc = this.opts.getDoc();
    const primary = this.#primaryId();
    const hitHandle = primary ? this.#hitHandle(doc, primary, p.x, p.y) : null;
    if (hitHandle) {
      this.opts.beginUndo?.();
      const ids = this.#selectedIds().length ? this.#selectedIds() : [primary];
      this.drag = this.#makeTransformDrag(doc, ids, hitHandle, p);
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #makeTransformDrag(doc, ids, handle, p) {
    const objs = activeMap(doc).objects;
    const origs = ids
      .map((id) => objs.find((o) => o.id === id))
      .filter(Boolean)
      .map((o) => ({
        ...o,
        cuts: (o.cuts || []).map((c) => ({ su: c.su | 0, sv: c.sv | 0 })),
      }));
    const contents = [];
    const claimed = new Set(ids);
    for (const o of origs) {
      if (o.kind !== "room") continue;
      for (const other of objs) {
        if (other.kind === "room" || other.kind === "doorway" || claimed.has(other.id)) continue;
        if (other.roomId !== o.id) continue;
        claimed.add(other.id);
        contents.push({ ...other });
      }
    }
    const primaryObj = objs.find((o) => o.id === ids[ids.length - 1]) || origs[0];
    const gizmo = primaryObj
      ? gizmoMetrics(aabbCenter(primaryObj), this.camera, this.cssW, this.cssH)
      : { axisLen: GIZMO_FALLBACK_LEN, planeLen: GIZMO_FALLBACK_LEN / 3 };
    return {
      kind: handle.kind,
      axis: handle.axis,
      plane: handle.plane,
      key: handle.key,
      side: handle.side,
      scale: handle.scale,
      start: p,
      origs,
      contents,
      grab: handle.world,
      planeN: handle.planeN || lookVectors(this.camera.yaw, this.camera.pitch).forward,
      primaryId: ids[ids.length - 1],
      gizmoAxisLen: handle.gizmoAxisLen ?? gizmo.axisLen,
    };
  }

  #beginOrbit(p) {
    const cam = this.camera;
    const doc = this.opts.getDoc();
    const id = this.#primaryId();
    let obj = id ? activeMap(doc).objects.find((o) => o.id === id) : null;
    if (!obj) {
      const hit = this.#pick(doc, p.x, p.y);
      if (hit) obj = activeMap(doc).objects.find((o) => o.id === hit.id) || null;
    }
    if (!obj) obj = this.#closestRoomToCursor(doc, p.x, p.y);
    let target;
    if (obj) {
      target = aabbCenter(obj);
    } else {
      const ray = screenRay(p.x, p.y, cam, this.cssW, this.cssH);
      const hit = intersectPlane(ray.origin, ray.dir, { x: 0, y: this.gridY, z: 0 }, { x: 0, y: 1, z: 0 });
      if (hit && hit.t >= 1) {
        target = hit.point;
      } else {
        const dist = Math.max(48, cam.speed * 2.5);
        const { forward } = lookVectors(cam.yaw, cam.pitch);
        target = { x: cam.x + forward.x * dist, y: cam.y + forward.y * dist, z: cam.z + forward.z * dist };
      }
    }
    const local = worldToCamera(target, cam);
    if (local.z < 1) local.z = 1;
    return { last: p, target, local };
  }

  #setCamFromTarget(target, local) {
    const cam = this.camera;
    const { forward, right, up } = lookVectors(cam.yaw, cam.pitch);
    cam.x = target.x - right.x * local.x - up.x * local.y - forward.x * local.z;
    cam.y = target.y - right.y * local.x - up.y * local.y - forward.y * local.z;
    cam.z = target.z - right.z * local.x - up.z * local.y - forward.z * local.z;
  }

  #screenDistToAabb(box, mx, my, cam, w, h) {
    let minx = Infinity;
    let miny = Infinity;
    let maxx = -Infinity;
    let maxy = -Infinity;
    let any = false;
    for (let i = 0; i < 8; i++) {
      const pr = projectPoint(cornerWorld(box, i), cam, w, h);
      if (!pr.ok) continue;
      any = true;
      minx = Math.min(minx, pr.sx);
      miny = Math.min(miny, pr.sy);
      maxx = Math.max(maxx, pr.sx);
      maxy = Math.max(maxy, pr.sy);
    }
    if (!any) return Infinity;
    const dx = mx < minx ? minx - mx : mx > maxx ? mx - maxx : 0;
    const dy = my < miny ? miny - my : my > maxy ? my - maxy : 0;
    return Math.hypot(dx, dy);
  }

  #closestRoomToCursor(doc, mx, my) {
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    let best = null;
    let bestD = Infinity;
    let bestDepth = Infinity;
    for (const obj of this.#visibleObjects(doc)) {
      if (obj.kind !== "room") continue;
      let d = Infinity;
      for (const c of roomGeometry(obj).colliders) {
        const cd = this.#screenDistToAabb(c, mx, my, cam, w, h);
        if (cd < d) d = cd;
      }
      if (d === Infinity) continue;
      const c = aabbCenter(obj);
      const depth = (c.x - cam.x) ** 2 + (c.y - cam.y) ** 2 + (c.z - cam.z) ** 2;
      if (d < bestD - 0.01 || (Math.abs(d - bestD) < 0.01 && depth < bestDepth)) {
        bestD = d;
        bestDepth = depth;
        best = obj;
      }
    }
    return best;
  }

  #applyOrbit(p) {
    const o = this.orbit;
    const cam = this.camera;
    const dx = p.x - o.last.x;
    const dy = p.y - o.last.y;
    o.last = p;
    if (!dx && !dy) return;

    cam.yaw += dx * 0.008;
    cam.pitch = Math.max(-1.4, Math.min(1.4, cam.pitch - dy * 0.008));
    this.#setCamFromTarget(o.target, o.local);
  }

  #applyPan(p) {
    const pan = this.pan;
    const cam = this.camera;
    const dx = p.x - pan.last.x;
    const dy = p.y - pan.last.y;
    pan.last = p;
    if (!dx && !dy) return;

    const focal = Math.min(this.cssW, this.cssH) * 0.9;
    const scale = pan.local.z / focal;
    const { right, up } = lookVectors(cam.yaw, cam.pitch);
    cam.x += (-right.x * dx + up.x * dy) * scale;
    cam.y += (-right.y * dx + up.y * dy) * scale;
    cam.z += (-right.z * dx + up.z * dy) * scale;
  }

  #applyZoom(p) {
    const z = this.zoom;
    const dx = p.x - z.last.x;
    const dy = p.y - z.last.y;
    z.last = p;
    const delta = dx + dy;
    if (!delta) return;

    z.local.z = Math.max(1, z.local.z * Math.exp(-delta * ZOOM_K));
    this.#setCamFromTarget(z.target, z.local);
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    if (this.orbit) {
      this.#applyOrbit(p);
      return;
    }
    if (this.pan) {
      this.#applyPan(p);
      return;
    }
    if (this.zoom) {
      this.#applyZoom(p);
      return;
    }
    if (this.look) {
      const dx = p.x - this.lookLast.x;
      const dy = p.y - this.lookLast.y;
      this.lookLast = p;
      this.camera.yaw += dx * 0.008;
      this.camera.pitch = Math.max(-1.4, Math.min(1.4, this.camera.pitch - dy * 0.008));
      return;
    }
    if (this.drag?.kind === "box") {
      this.drag.end = p;
      this.draw();
      return;
    }
    if (this.drag) {
      this.#applyDrag(p);
      this.opts.onChange?.();
      return;
    }
    const doc = this.opts.getDoc();
    const primary = this.#primaryId();
    this.hoverGizmo = primary ? this.#hitHandle(doc, primary, p.x, p.y) : null;
    this.hoverId = this.#pick(doc, p.x, p.y)?.id || null;
  }

  #onUp(e) {
    if (!this.enabled) return;
    const viewEnded = this.look || this.orbit || this.pan || this.zoom;
    if (this.look) this.look = false;
    if (this.orbit) this.orbit = null;
    if (this.pan) this.pan = null;
    if (this.zoom) this.zoom = null;
    if (this.drag?.kind === "box") this.#finishBox();
    else if (this.drag && this.drag.kind !== "select") {
      this.#finishTransform();
      this.opts.endUndo?.();
    }
    this.drag = null;
    if (viewEnded) this.opts.onViewChanged?.();
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    this.draw();
  }

  #finishTransform() {
    const d = this.drag;
    if (!d || (d.kind !== "move" && d.kind !== "axis" && d.kind !== "plane")) return;
    const doc = this.opts.getDoc();
    const objs = activeMap(doc).objects;
    for (const orig of d.origs) {
      const obj = objs.find((o) => o.id === orig.id);
      if (!obj) continue;
      if (obj.kind === "doorway") {
        assignDoorRooms(doc, obj, roomById(doc, obj.roomId), false);
        clampObject(obj);
      } else if (obj.kind === "switch") {
        snapSwitchToRoom(obj, roomById(doc, obj.roomId));
        clampObject(obj);
      }
    }
  }

  #axisDelta(p, grab, axis, start, axisLen) {
    return gizmoAxisDragDelta(p, grab, axis, start, axisLen, this.camera, this.cssW, this.cssH);
  }

  #applyFaceDelta(obj, orig, side, delta) {
    const min = 1;
    obj.x = orig.x;
    obj.y = orig.y;
    obj.z = orig.z;
    obj.sx = orig.sx;
    obj.sy = orig.sy;
    obj.sz = orig.sz;
    if (side === "x1") obj.sx = Math.max(min, orig.sx + delta);
    else if (side === "x0") {
      const x1 = orig.x + orig.sx;
      obj.x = Math.min(x1 - min, orig.x + delta);
      obj.sx = x1 - obj.x;
    } else if (side === "y1") obj.sy = Math.max(min, orig.sy + delta);
    else if (side === "y0") {
      const y1 = orig.y + orig.sy;
      obj.y = Math.min(y1 - min, orig.y + delta);
      obj.sy = y1 - obj.y;
    } else if (side === "z1") obj.sz = Math.max(min, orig.sz + delta);
    else if (side === "z0") {
      const z1 = orig.z + orig.sz;
      obj.z = Math.min(z1 - min, orig.z + delta);
      obj.sz = z1 - obj.z;
    }
  }

  #boxRect() {
    const a = this.drag.start;
    const b = this.drag.end;
    const x0 = Math.min(a.x, b.x);
    const y0 = Math.min(a.y, b.y);
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  #finishBox() {
    const rect = this.#boxRect();
    const additive = this.drag.additive;
    if (rect.w < LAYOUT_BOX_CLICK && rect.h < LAYOUT_BOX_CLICK) {
      const hit = this.#pick(this.opts.getDoc(), this.drag.start.x, this.drag.start.y);
      if (hit) {
        if (additive) this.opts.onToggleSelect?.(hit.id);
        else this.opts.onSelectIds?.([hit.id]);
      } else if (!additive) {
        this.opts.onSelectIds?.([]);
      }
      return;
    }
    const doc = this.opts.getDoc();
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    const hits = [];
    for (const obj of this.#visibleObjects(doc)) {
      let inside = false;
      for (let i = 0; i < 8; i++) {
        const pr = projectPoint(cornerWorld(obj, i), cam, w, h);
        if (!pr.ok) continue;
        if (pr.sx >= rect.x0 && pr.sx <= rect.x1 && pr.sy >= rect.y0 && pr.sy <= rect.y1) {
          inside = true;
          break;
        }
      }
      if (!inside) {
        const c = projectPoint(aabbCenter(obj), cam, w, h);
        if (c.ok && c.sx >= rect.x0 && c.sx <= rect.x1 && c.sy >= rect.y0 && c.sy <= rect.y1) {
          inside = true;
        }
      }
      if (inside) hits.push(obj.id);
    }
    this.opts.onSelectIds?.(hits, additive);
  }

  #applyDrag(p) {
    const doc = this.opts.getDoc();
    const objs = activeMap(doc).objects;
    const ray = screenRay(p.x, p.y, this.camera, this.cssW, this.cssH);
    const d = this.drag;

    if (d.kind === "move") {
      const hit = intersectPlane(ray.origin, ray.dir, d.grab, d.planeN);
      if (!hit) return;
      const dx = Math.round(hit.point.x - d.grab.x);
      const dy = Math.round(hit.point.y - d.grab.y);
      const dz = Math.round(hit.point.z - d.grab.z);
      for (const orig of d.origs) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      for (const orig of d.contents) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      return;
    }

    if (d.kind === "axis") {
      const delta = this.#axisDelta(p, d.grab, d.axis, d.start, d.gizmoAxisLen ?? GIZMO_FALLBACK_LEN);
      if (delta == null) return;
      for (const orig of d.origs) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj[d.axis] = orig[d.axis] + delta;
        clampObject(obj);
      }
      for (const orig of d.contents) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj[d.axis] = orig[d.axis] + delta;
        clampObject(obj);
      }
      return;
    }

    if (d.kind === "plane") {
      const hit = intersectPlane(ray.origin, ray.dir, d.grab, d.planeN);
      if (!hit) return;
      let dx = Math.round(hit.point.x - d.grab.x);
      let dy = Math.round(hit.point.y - d.grab.y);
      let dz = Math.round(hit.point.z - d.grab.z);
      if (d.plane === "xy") dz = 0;
      else if (d.plane === "xz") dy = 0;
      else if (d.plane === "yz") dx = 0;
      for (const orig of d.origs) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      for (const orig of d.contents) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      return;
    }

    if (d.kind === "split") {
      const orig = d.origs.find((o) => o.id === d.primaryId) || d.origs[0];
      const obj = objs.find((o) => o.id === orig.id);
      if (!obj || obj.kind !== "room") return;
      const delta = this.#axisDelta(p, d.grab, d.axis, d.start, d.gizmoAxisLen ?? GIZMO_FALLBACK_LEN);
      if (delta == null) return;
      applyRoomSplitDelta(obj, orig, d.key, delta * (d.scale || 1));
      clampObject(obj);
      return;
    }

    if (d.kind === "face") {
      const orig = d.origs.find((o) => o.id === d.primaryId) || d.origs[0];
      const obj = objs.find((o) => o.id === orig.id);
      if (!obj || KINDS[obj.kind].fixed) return;
      const delta = this.#axisDelta(p, d.grab, d.axis, d.start, d.gizmoAxisLen ?? GIZMO_FALLBACK_LEN);
      if (delta == null) return;
      this.#applyFaceDelta(obj, orig, d.side, delta);
      if (obj.kind === "room") preserveRoomSplits(obj, orig);
      clampObject(obj);
    }
  }

  #visibleObjects(doc) {
    const local = this.opts.getLocalMode?.() || false;
    const focus = this.opts.getFocusRoom?.() || null;
    const neighbours = !!(local && this.opts.getNeighbourMode?.());
    return activeMap(doc).objects.filter((o) => objectVisible(doc, o, local, focus, neighbours));
  }

  #objectSegments(doc, obj) {
    /** @type {{a:{x:number,y:number,z:number},b:{x:number,y:number,z:number}}[]} */
    const segs = [];
    if (obj.kind === "room") {
      const g = roomGeometry(obj);
      for (const e of g.edges) {
        segs.push({ a: g.verts[e.a], b: g.verts[e.b] });
      }
      return segs;
    }
    if (isFigureObject(obj)) {
      const tmpl = findEnemyTemplate(doc, figureTemplateName(obj));
      const verts = enemyPlacementWorldVerts(obj, tmpl);
      if (tmpl && verts.length) {
        for (const [i, j] of tmpl.lines) {
          if (verts[i] && verts[j]) segs.push({ a: verts[i], b: verts[j] });
        }
      }
      for (const [i, j] of BOX_EDGES) {
        segs.push({ a: cornerWorld(obj, i), b: cornerWorld(obj, j) });
      }
      return segs;
    }
    if (obj.kind === "platform") {
      const y = (obj.y | 0) + (obj.sy | 0);
      segs.push(
        { a: { x: obj.x, y, z: obj.z }, b: { x: obj.x + obj.sx, y, z: obj.z } },
        { a: { x: obj.x + obj.sx, y, z: obj.z }, b: { x: obj.x + obj.sx, y, z: obj.z + obj.sz } },
        { a: { x: obj.x + obj.sx, y, z: obj.z + obj.sz }, b: { x: obj.x, y, z: obj.z + obj.sz } },
        { a: { x: obj.x, y, z: obj.z + obj.sz }, b: { x: obj.x, y, z: obj.z } }
      );
      return segs;
    }
    if (obj.kind === "pickup") {
      const mesh = itemMeshFor(doc, obj.pickup);
      for (const s of itemMeshWorldSegs(obj, mesh)) segs.push(s);
      return segs;
    }
    if (obj.kind === "slope") {
      for (const s of rampSegments(obj)) segs.push(s);
      return segs;
    }
    for (const [i, j] of BOX_EDGES) {
      segs.push({ a: cornerWorld(obj, i), b: cornerWorld(obj, j) });
    }
    for (const s of this.#glyphSegments(obj)) segs.push(s);
    return segs;
  }

  #glyphSegments(obj) {
    const segs = [];
    if (obj.kind === "switch") {
      const f = faceCorners(obj.face);
      const a = cornerWorld(obj, f[0]);
      const b = cornerWorld(obj, f[1]);
      const c = cornerWorld(obj, f[2]);
      const d = cornerWorld(obj, f[3]);
      const apex = {
        x: (a.x + b.x + c.x + d.x) / 4,
        y: Math.max(a.y, b.y, c.y, d.y),
        z: (a.z + b.z + c.z + d.z) / 4,
      };
      const left = { x: (a.x + d.x) / 2, y: (a.y + d.y) / 2, z: (a.z + d.z) / 2 };
      const right = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2, z: (b.z + c.z) / 2 };
      segs.push({ a: apex, b: left }, { a: left, b: right }, { a: right, b: apex });
    }
    if (obj.kind === "teleporter_dest") {
      const c = aabbCenter(obj);
      const rot = clampEnemyRot(obj.rot ?? 0);
      const th = (rot * Math.PI) / 4;
      const fx = Math.sin(th);
      const fz = Math.cos(th);
      segs.push(
        { a: c, b: { x: c.x + fx * 4, y: c.y, z: c.z + fz * 4 } },
        {
          a: { x: c.x + fx * 4, y: c.y, z: c.z + fz * 4 },
          b: { x: c.x + fx * 2 - fz * 1.5, y: c.y, z: c.z + fz * 2 + fx * 1.5 },
        },
        {
          a: { x: c.x + fx * 4, y: c.y, z: c.z + fz * 4 },
          b: { x: c.x + fx * 2 + fz * 1.5, y: c.y, z: c.z + fz * 2 - fx * 1.5 },
        }
      );
    }
    return segs;
  }

  #pick(doc, mx, my) {
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    let bestLine = null;
    for (const obj of this.#visibleObjects(doc)) {
      for (const seg of this.#objectSegments(doc, obj)) {
        const pl = projectLine(seg.a, seg.b, cam, w, h);
        if (!pl) continue;
        const d = distPointToSegment2d(mx, my, pl.ax, pl.ay, pl.bx, pl.by);
        if (d > LINE_HIT) continue;
        const mid = {
          x: (seg.a.x + seg.b.x) / 2,
          y: (seg.a.y + seg.b.y) / 2,
          z: (seg.a.z + seg.b.z) / 2,
        };
        const depth =
          (mid.x - cam.x) ** 2 + (mid.y - cam.y) ** 2 + (mid.z - cam.z) ** 2;
        if (!bestLine || d < bestLine.d - 0.01 || (Math.abs(d - bestLine.d) < 0.01 && depth < bestLine.depth)) {
          bestLine = { id: obj.id, d, depth, point: mid };
        }
      }
    }
    if (bestLine) return { id: bestLine.id, t: bestLine.depth, point: bestLine.point };

    const ray = screenRay(mx, my, cam, w, h);
    let best = null;
    for (const obj of this.#visibleObjects(doc)) {
      if (obj.kind === "room") {
        const g = roomGeometry(obj);
        for (const c of g.colliders) {
          const hit = rayAabb(ray.origin, ray.dir, c);
          if (hit && (!best || hit.t < best.t)) best = { id: obj.id, t: hit.t, point: hit.point };
        }
        continue;
      }
      const hit = rayAabb(ray.origin, ray.dir, obj);
      if (!hit) continue;
      if (!best || hit.t < best.t) best = { id: obj.id, t: hit.t, point: hit.point };
    }
    return best;
  }

  #hitHandle(doc, id, mx, my) {
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (!obj) return null;
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    if (obj.kind === "room") {
      const g = roomGeometry(obj);
      for (const handle of g.handles) {
        const pr = projectPoint(handle.world, cam, w, h);
        if (!pr.ok) continue;
        if (Math.hypot(mx - pr.sx, my - pr.sy) < HANDLE + 2) {
          if (handle.kind === "face") {
            return { kind: "face", side: handle.side, axis: handle.axis, world: handle.world };
          }
          return { kind: "split", key: handle.key, axis: handle.axis, scale: handle.scale, world: handle.world };
        }
      }
    } else if (!KINDS[obj.kind].fixed) {
      for (const handle of this.#aabbFaceHandles(obj)) {
        const pr = projectPoint(handle.world, cam, w, h);
        if (!pr.ok) continue;
        if (Math.hypot(mx - pr.sx, my - pr.sy) < HANDLE + 2) {
          return { kind: "face", side: handle.side, axis: handle.axis, world: handle.world };
        }
      }
    }
    const c = aabbCenter(obj);
    const gizmoHit = hitTranslateGizmo(c, cam, w, h, mx, my, HANDLE + 1);
    if (gizmoHit) return gizmoHit;
    return null;
  }

  /** Drop pose from screen: nearest ray-hit room floor (except room/doorway), else grid. */
  placeAtScreen(mx, my, kind) {
    const doc = this.opts.getDoc();
    const ray = screenRay(mx, my, this.camera, this.cssW, this.cssH);
    const def = KINDS[kind] || KINDS.crate;
    const sx = def.defaultSize[0];
    const sz = def.defaultSize[2];
    if (kind !== "room" && kind !== "doorway") {
      let bestRoom = null;
      let bestT = Infinity;
      for (const room of roomsOf(doc)) {
        const g = roomGeometry(room);
        for (const c of g.colliders) {
          const hit = rayAabb(ray.origin, ray.dir, c);
          if (!hit || hit.t < 0 || hit.t >= bestT) continue;
          bestT = hit.t;
          bestRoom = { room, point: hit.point };
        }
      }
      if (bestRoom) {
        const fy = roomFloorY(bestRoom.room, bestRoom.point.x, bestRoom.point.z);
        const floor = intersectPlane(ray.origin, ray.dir, { x: 0, y: fy, z: 0 }, { x: 0, y: 1, z: 0 });
        const pt = floor?.point || bestRoom.point;
        return {
          x: Math.round(pt.x - sx / 2),
          y: fy,
          z: Math.round(pt.z - sz / 2),
          room: bestRoom.room,
        };
      }
    }
    const gy = this.gridY;
    const floor = intersectPlane(ray.origin, ray.dir, { x: 0, y: gy, z: 0 }, { x: 0, y: 1, z: 0 });
    if (floor) {
      return {
        x: Math.round(floor.point.x - sx / 2),
        y: gy,
        z: Math.round(floor.point.z - sz / 2),
      };
    }
    const { forward } = lookVectors(this.camera.yaw, this.camera.pitch);
    return {
      x: Math.round(this.camera.x + forward.x * 12 - sx / 2),
      y: gy,
      z: Math.round(this.camera.z + forward.z * 12 - sz / 2),
    };
  }

  /** Keep look; put selection in view center. Pull back to frame if closer than that. */
  focusSelection() {
    const ids = this.#selectedIds();
    if (!ids.length) return false;
    const doc = this.opts.getDoc();
    const objs = ids
      .map((id) => activeMap(doc).objects.find((o) => o.id === id))
      .filter(Boolean);
    if (!objs.length) return false;

    let minx = Infinity;
    let miny = Infinity;
    let minz = Infinity;
    let maxx = -Infinity;
    let maxy = -Infinity;
    let maxz = -Infinity;
    for (const o of objs) {
      minx = Math.min(minx, o.x);
      miny = Math.min(miny, o.y);
      minz = Math.min(minz, o.z);
      maxx = Math.max(maxx, o.x + o.sx);
      maxy = Math.max(maxy, o.y + o.sy);
      maxz = Math.max(maxz, o.z + o.sz);
    }
    const box = { x: minx, y: miny, z: minz, sx: maxx - minx, sy: maxy - miny, sz: maxz - minz };
    const center = aabbCenter(box);
    const cam = this.camera;
    const { forward, right, up } = lookVectors(cam.yaw, cam.pitch);
    const w = this.cssW;
    const h = this.cssH;
    const focal = Math.min(w, h) * 0.9;
    const pad = 0.82;
    const halfW = Math.max(1, w * 0.5 * pad);
    const halfH = Math.max(1, h * 0.5 * pad);

    let frameDist = 4;
    for (let i = 0; i < 8; i++) {
      const c = cornerWorld(box, i);
      const rx = c.x - center.x;
      const ry = c.y - center.y;
      const rz = c.z - center.z;
      const cx = rx * right.x + ry * right.y + rz * right.z;
      const cy = rx * up.x + ry * up.y + rz * up.z;
      const cz = rx * forward.x + ry * forward.y + rz * forward.z;
      frameDist = Math.max(frameDist, (Math.abs(cx) * focal) / halfW - cz);
      frameDist = Math.max(frameDist, (Math.abs(cy) * focal) / halfH - cz);
      frameDist = Math.max(frameDist, 1 - cz);
    }

    const currentDist = Math.hypot(cam.x - center.x, cam.y - center.y, cam.z - center.z);
    const dist = Math.max(frameDist, currentDist);
    cam.x = center.x - forward.x * dist;
    cam.y = center.y - forward.y * dist;
    cam.z = center.z - forward.z * dist;
    this.opts.onViewChanged?.();
    this.draw();
    return true;
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const doc = this.opts.getDoc();
    const cam = this.camera;
    const selected = new Set(this.#selectedIds());
    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      if (r.w >= LAYOUT_BOX_CLICK || r.h >= LAYOUT_BOX_CLICK) {
        for (const obj of this.#visibleObjects(doc)) {
          for (let i = 0; i < 8; i++) {
            const pr = projectPoint(cornerWorld(obj, i), cam, w, h);
            if (pr.ok && pr.sx >= r.x0 && pr.sx <= r.x1 && pr.sy >= r.y0 && pr.sy <= r.y1) {
              selected.add(obj.id);
              break;
            }
          }
        }
      }
    }
    const local = this.opts.getLocalMode?.() || false;
    const neighbours = !!(local && this.opts.getNeighbourMode?.());
    const tag = local ? (neighbours ? "LOCAL+N" : "LOCAL") : "ALL";
    const primary = this.#primaryId();
    this.#syncGridY(doc);

    this.#drawGrid(ctx, cam, w, h);

    const objs = [...this.#visibleObjects(doc)].sort((a, b) => {
      const ca = aabbCenter(a);
      const cb = aabbCenter(b);
      const da = (ca.x - cam.x) ** 2 + (ca.y - cam.y) ** 2 + (ca.z - cam.z) ** 2;
      const db = (cb.x - cam.x) ** 2 + (cb.y - cam.y) ** 2 + (cb.z - cam.z) ** 2;
      return db - da;
    });

    for (const obj of objs) {
      const sel = selected.has(obj.id);
      const hi = sel || obj.id === this.hoverId;
      this.#drawObject(ctx, doc, obj, cam, w, h, hi, sel, obj.id === primary);
    }

    if (this.placePreview && this.placePreviewOverCanvas) {
      ctx.globalAlpha = 0.85;
      this.#drawObject(ctx, doc, this.placePreview, cam, w, h, true, false, false);
      ctx.globalAlpha = 1;
    }

    const selIds = this.#selectedIds();
    if (selIds.length === 1) {
      const elev = objs.find((o) => o.id === selIds[0] && o.kind === "elevator");
      if (elev) this.#drawElevDestGhosts(ctx, doc, elev, cam, w, h);
    }

    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      ctx.fillStyle = "rgba(212, 160, 23, 0.12)";
      ctx.fillRect(r.x0, r.y0, r.w, r.h);
      ctx.strokeStyle = "#d4a017";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w, r.h);
      ctx.setLineDash([]);
    }

    ctx.fillStyle = "#8b91a0";
    ctx.font = "11px Segoe UI, sans-serif";
    ctx.fillText(
      `xyz ${cam.x | 0},${cam.y | 0},${cam.z | 0}  ${tag}  spd ${cam.speed | 0}`,
      8,
      16
    );
  }

  #syncGridY(doc) {
    const id = this.#primaryId();
    if (!id) return;
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (obj?.kind === "room") this.gridY = obj.y;
  }

  #drawGrid(ctx, cam, w, h) {
    const y = this.gridY;
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#3d4658";
    for (let i = 0; i <= WORLD_SIZE; i += 8) {
      this.#line3(ctx, { x: i, y, z: 0 }, { x: i, y, z: WORLD_SIZE }, cam, w, h);
      this.#line3(ctx, { x: 0, y, z: i }, { x: WORLD_SIZE, y, z: i }, cam, w, h);
    }
    ctx.strokeStyle = "#6a7388";
    for (let i = 0; i <= WORLD_SIZE; i += 32) {
      this.#line3(ctx, { x: i, y, z: 0 }, { x: i, y, z: WORLD_SIZE }, cam, w, h);
      this.#line3(ctx, { x: 0, y, z: i }, { x: WORLD_SIZE, y, z: i }, cam, w, h);
    }
    ctx.strokeStyle = "#9aa3b5";
    this.#line3(ctx, { x: 0, y, z: 0 }, { x: WORLD_SIZE, y, z: 0 }, cam, w, h);
    this.#line3(ctx, { x: 0, y, z: 0 }, { x: 0, y, z: WORLD_SIZE }, cam, w, h);
    this.#line3(ctx, { x: 0, y: 0, z: 0 }, { x: 0, y: WORLD_SIZE, z: 0 }, cam, w, h);
  }

  #line3(ctx, a, b, cam, w, h, color) {
    const seg = projectLine(a, b, cam, w, h);
    if (!seg) return;
    if (color) ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  #drawObject(ctx, doc, obj, cam, w, h, highlight, selected, primary) {
    const color = highlight
      ? "#f2d36b"
      : obj.kind === "room"
        ? colorHex(obj.lineColor ?? ROOM_LINE_DEFAULT)
        : obj.kind === "spawn" && !obj.enabled
          ? "#1a7a3c"
          : KINDS[obj.kind].color;
    ctx.lineWidth = selected ? 2 : 1;
    ctx.strokeStyle = color;

    if (isFigureObject(obj)) {
      ctx.globalAlpha = selected ? 0.35 : 0.2;
      for (const [i, j] of BOX_EDGES) {
        this.#line3(ctx, cornerWorld(obj, i), cornerWorld(obj, j), cam, w, h);
      }
      ctx.globalAlpha = 1;
      const tmpl = findEnemyTemplate(doc, figureTemplateName(obj));
      const verts = enemyPlacementWorldVerts(obj, tmpl);
      if (tmpl && verts.length) {
        ctx.lineWidth = selected ? 2 : 1.5;
        for (const [i, j] of tmpl.lines) {
          if (verts[i] && verts[j]) this.#line3(ctx, verts[i], verts[j], cam, w, h);
        }
      }
    } else if (obj.kind === "pickup") {
      const mesh = itemMeshFor(doc, obj.pickup);
      for (const seg of itemMeshWorldSegs(obj, mesh)) {
        this.#line3(ctx, seg.a, seg.b, cam, w, h);
      }
    } else if (obj.kind === "room") {
      const g = roomGeometry(obj);
      for (const e of g.edges) {
        this.#line3(ctx, g.verts[e.a], g.verts[e.b], cam, w, h);
      }
    } else if (obj.kind === "slope") {
      for (const seg of rampSegments(obj)) {
        this.#line3(ctx, seg.a, seg.b, cam, w, h);
      }
    } else {
      if (isGhostKind(obj.kind)) ctx.setLineDash([5, 4]);
      for (const [i, j] of BOX_EDGES) {
        this.#line3(ctx, cornerWorld(obj, i), cornerWorld(obj, j), cam, w, h);
      }
      ctx.setLineDash([]);
      this.#drawGlyphs(ctx, obj, cam, w, h, color);
    }
    if (primary) this.#drawGizmo(ctx, obj, cam, w, h);
  }

  #drawElevDestGhosts(ctx, doc, elev, cam, w, h) {
    const stops = elevStopBottoms(doc, elev);
    const liveTop = (elev.y | 0) + (elev.sy | 0);
    const x0 = elev.x | 0;
    const z0 = elev.z | 0;
    const sx = elev.sx | 0;
    const sz = elev.sz | 0;
    const sy = elev.sy | 0;
    ctx.strokeStyle = KINDS.elevator.color;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    for (const bottom of [stops.dest, stops.home]) {
      const top = bottom + sy;
      if (top === liveTop) continue;
      const corners = [
        { x: x0, y: top, z: z0 },
        { x: x0 + sx, y: top, z: z0 },
        { x: x0 + sx, y: top, z: z0 + sz },
        { x: x0, y: top, z: z0 + sz },
      ];
      for (let i = 0; i < 4; i++) {
        this.#line3(ctx, corners[i], corners[(i + 1) % 4], cam, w, h);
      }
    }
    ctx.setLineDash([]);
  }

  #drawGlyphs(ctx, obj, cam, w, h, color) {
    ctx.strokeStyle = color;
    for (const seg of this.#glyphSegments(obj)) {
      this.#line3(ctx, seg.a, seg.b, cam, w, h);
    }
  }

  #drawGizmo(ctx, obj, cam, w, h) {
    const c = aabbCenter(obj);
    drawTranslateGizmo(ctx, c, cam, w, h, { hoverGizmo: this.hoverGizmo, drag: this.drag });
    if (KINDS[obj.kind].fixed) return;
    ctx.fillStyle = "#7ec8e8";
    const handles = obj.kind === "room" ? roomGeometry(obj).handles : this.#aabbFaceHandles(obj);
    for (const handle of handles) {
      const pr = projectPoint(handle.world, cam, w, h);
      if (!pr.ok) continue;
      ctx.fillRect(pr.sx - 4, pr.sy - 4, 8, 8);
    }
  }

  #aabbFaceHandles(obj) {
    const x0 = obj.x | 0;
    const y0 = obj.y | 0;
    const z0 = obj.z | 0;
    const sx = obj.sx | 0;
    const sy = obj.sy | 0;
    const sz = obj.sz | 0;
    const cx = x0 + sx / 2;
    const cy = y0 + sy / 2;
    const cz = z0 + sz / 2;
    const handles = [
      { kind: "face", side: "x0", axis: "x", world: { x: x0, y: cy, z: cz } },
      { kind: "face", side: "x1", axis: "x", world: { x: x0 + sx, y: cy, z: cz } },
      { kind: "face", side: "z0", axis: "z", world: { x: cx, y: cy, z: z0 } },
      { kind: "face", side: "z1", axis: "z", world: { x: cx, y: cy, z: z0 + sz } },
    ];
    if (obj.kind !== "platform") {
      handles.push(
        { kind: "face", side: "y0", axis: "y", world: { x: cx, y: y0, z: cz } },
        { kind: "face", side: "y1", axis: "y", world: { x: cx, y: y0 + sy, z: cz } }
      );
    }
    return handles;
  }
}


// ---- js/overheadView.js ----
const ORTHO = {
  top: { u: "x", v: "z", su: "sx", sv: "sz", hint: "XZ · +Z up · camera arrow" },
  left: { u: "z", v: "y", su: "sz", sv: "sy", hint: "YZ · +Y up · camera arrow" },
  forward: { u: "x", v: "y", su: "sx", sv: "sy", hint: "XY · +Y up · camera arrow" },
};

function hexAlpha(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

class OverheadView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.mode = "top";
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(canvas.parentElement);
    this.resize();
  }

  setMode(mode) {
    if (!ORTHO[mode] || mode === this.mode) return;
    this.mode = mode;
    this.draw();
  }

  hint() {
    return ORTHO[this.mode].hint;
  }

  resize() {
    const parent = this.canvas.parentElement;
    const rect = parent.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  draw() {
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const pad = 8;
    const side = Math.min(w, h) - pad * 2;
    const ox = (w - side) / 2;
    const oy = (h - side) / 2;
    const s = side / WORLD_SIZE;
    const axes = ORTHO[this.mode];

    ctx.strokeStyle = "#8b91a0";
    ctx.strokeRect(ox, oy, side, side);
    ctx.strokeStyle = "#3d4658";
    for (let i = 0; i <= WORLD_SIZE; i += 8) {
      ctx.beginPath();
      ctx.moveTo(ox + i * s, oy);
      ctx.lineTo(ox + i * s, oy + side);
      ctx.moveTo(ox, oy + i * s);
      ctx.lineTo(ox + side, oy + i * s);
      ctx.stroke();
    }
    ctx.strokeStyle = "#6a7388";
    for (let i = 0; i <= WORLD_SIZE; i += 32) {
      ctx.beginPath();
      ctx.moveTo(ox + i * s, oy);
      ctx.lineTo(ox + i * s, oy + side);
      ctx.moveTo(ox, oy + i * s);
      ctx.lineTo(ox + side, oy + i * s);
      ctx.stroke();
    }

    const doc = this.opts.getDoc();
    const cam = this.opts.getCamera();
    const local = this.opts.getLocalMode?.() || false;
    const neighbourOn = !!this.opts.getNeighbourMode?.();
    const camRoom = currentRoom(doc, cam);
    const focus = local ? this.opts.getFocusRoom?.() || null : camRoom;
    const neigh = focus ? neighbourRooms(doc, focus) : [];
    const vis = local ? localVisibleIds(doc, focus, neighbourOn) : null;
    const cur = focus;
    const selected = new Set(this.opts.getSelectedIds?.() || []);
    const primary = this.opts.getSelectedId?.();
    if (primary) selected.add(primary);

    const toScreen = (u, v) => ({ x: ox + u * s, y: oy + side - v * s });

    const drawBox = (obj, fill, stroke, lw = 1) => {
      const uw = obj[axes.su] * s;
      const vh = obj[axes.sv] * s;
      const p = toScreen(obj[axes.u], obj[axes.v] + obj[axes.sv]);
      ctx.lineWidth = lw;
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fillRect(p.x, p.y, uw, vh);
      }
      ctx.strokeStyle = stroke;
      ctx.strokeRect(p.x, p.y, uw, vh);
    };

    const drawRoom = (obj, fill, stroke, lw = 1) => {
      const g = roomGeometry(obj);
      ctx.lineWidth = lw;
      for (const c of g.colliders) {
        const uw = c[axes.su] * s;
        const vh = c[axes.sv] * s;
        const p = toScreen(c[axes.u], c[axes.v] + c[axes.sv]);
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fillRect(p.x, p.y, uw, vh);
        }
      }
      ctx.strokeStyle = stroke;
      for (const e of g.edges) {
        const a = g.verts[e.a];
        const b = g.verts[e.b];
        if (a[axes.u] === b[axes.u] && a[axes.v] === b[axes.v]) continue;
        const pa = toScreen(a[axes.u], a[axes.v]);
        const pb = toScreen(b[axes.u], b[axes.v]);
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      }
    };

    for (const obj of activeMap(doc).objects) {
      if (obj.kind !== "room") continue;
      const isCur = cur && obj.id === cur.id;
      const isN = neigh.some((n) => n.id === obj.id);
      const faded = vis && !vis.has(obj.id);
      const bgHex = colorHex(obj.bgColor ?? ROOM_BG_DEFAULT);
      const lineHex = colorHex(obj.lineColor ?? ROOM_LINE_DEFAULT);
      const fill = isCur
        ? hexAlpha(bgHex, 0.28)
        : isN
          ? hexAlpha(bgHex, 0.18)
          : hexAlpha(bgHex, 0.08);
      drawRoom(obj, fill, faded ? "#333" : lineHex, isCur ? 2 : 1);
    }

    for (const obj of activeMap(doc).objects) {
      if (obj.kind === "room") continue;
      const faded = vis && !vis.has(obj.id);
      const col = faded ? "#444" : KINDS[obj.kind].color;
      if (isGhostKind(obj.kind)) ctx.setLineDash([4, 3]);
      drawBox(obj, null, selected.has(obj.id) ? "#f2d36b" : col, selected.has(obj.id) ? 2 : 1);
      ctx.setLineDash([]);
    }

    const { forward } = lookVectors(cam.yaw, cam.pitch);
    const c = toScreen(cam[axes.u], cam[axes.v]);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#d4a017";
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + forward[axes.u] * 14, c.y - forward[axes.v] * 14);
    ctx.stroke();
  }
}


// ---- js/animView.js ----
const AXIS_LEN = 8;
const AXIS_HIT = 9;
const ANIM_BOX_CLICK = 4;
const ANIM_ZOOM_K = 0.008;
function clampAnimDist(d) {
  return Math.max(ANIM_ORBIT_DIST_MIN, Math.min(ANIM_ORBIT_DIST_MAX, d));
}
const AXIS_COLS = { x: "#e55", y: "#5e5", z: "#55e" };

class AnimView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.orbit = { yaw: 0.5, pitch: 0.15, dist: 48, target: { x: 0, y: 10, z: 0 } };
    this.drag = null;
    this.hover = -1;
    this.hoverAxis = null;
    this.enabled = false;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    canvas.addEventListener("auxclick", (e) => {
      if (e.button === 1) e.preventDefault();
    });
  }

  resize() {
    if (!this.enabled) return;
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  #overlay() {
    return this.opts.getMeshOverlay?.() || null;
  }

  #hasStick() {
    return this.opts.hasStickFrame?.() !== false;
  }

  #binding() {
    const overlay = this.#overlay();
    return overlay && overlay.bindJoint >= 0;
  }

  #cam() {
    const { yaw, pitch, dist, target } = this.orbit;
    const { forward } = lookVectors(yaw, pitch);
    return {
      x: target.x - forward.x * dist,
      y: target.y - forward.y * dist,
      z: target.z - forward.z * dist,
      yaw,
      pitch,
    };
  }

  /** Frame stick/MDL verts; if none, center on origin without changing dist. */
  focusObject() {
    let points = null;
    if (this.#hasStick()) {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      points = enemy?.frames?.[frame] || enemy?.frames?.[0] || null;
    }
    if (!points?.length) {
      const overlay = this.#overlay();
      points = overlay?.verts || null;
    }
    if (!points?.length) {
      this.orbit.target = { x: 0, y: 0, z: 0 };
      this.opts.onViewChanged?.();
      this.draw();
      return true;
    }

    let minx = Infinity;
    let miny = Infinity;
    let minz = Infinity;
    let maxx = -Infinity;
    let maxy = -Infinity;
    let maxz = -Infinity;
    for (const v of points) {
      minx = Math.min(minx, v.x);
      miny = Math.min(miny, v.y);
      minz = Math.min(minz, v.z);
      maxx = Math.max(maxx, v.x);
      maxy = Math.max(maxy, v.y);
      maxz = Math.max(maxz, v.z);
    }
    const box = {
      x: minx,
      y: miny,
      z: minz,
      sx: Math.max(1e-3, maxx - minx),
      sy: Math.max(1e-3, maxy - miny),
      sz: Math.max(1e-3, maxz - minz),
    };
    const center = aabbCenter(box);
    const { yaw, pitch } = this.orbit;
    const { forward, right, up } = lookVectors(yaw, pitch);
    const w = this.cssW;
    const h = this.cssH;
    const focal = Math.min(w, h) * 0.9;
    const pad = 0.82;
    const halfW = Math.max(1, w * 0.5 * pad);
    const halfH = Math.max(1, h * 0.5 * pad);

    let frameDist = 4;
    for (let i = 0; i < 8; i++) {
      const c = cornerWorld(box, i);
      const rx = c.x - center.x;
      const ry = c.y - center.y;
      const rz = c.z - center.z;
      const cx = rx * right.x + ry * right.y + rz * right.z;
      const cy = rx * up.x + ry * up.y + rz * up.z;
      const cz = rx * forward.x + ry * forward.y + rz * forward.z;
      frameDist = Math.max(frameDist, (Math.abs(cx) * focal) / halfW - cz);
      frameDist = Math.max(frameDist, (Math.abs(cy) * focal) / halfH - cz);
      frameDist = Math.max(frameDist, 1 - cz);
    }

    this.orbit.target = { x: center.x, y: center.y, z: center.z };
    this.orbit.dist = clampAnimDist(frameDist);
    this.opts.onViewChanged?.();
    this.draw();
    return true;
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #primaryVert() {
    return this.#selectionAnchor();
  }

  #selectedIndices() {
    return this.opts.getSelectedVerts?.() || [];
  }

  #selectionAnchor() {
    if (!this.#hasStick()) return null;
    const selected = this.#selectedIndices();
    if (!selected.length) return null;
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const verts = enemy.frames[frame];
    if (selected.length === 1) {
      const i = selected[0];
      return { index: i, v: verts[i], indices: selected };
    }
    let x = 0;
    let y = 0;
    let z = 0;
    for (const i of selected) {
      x += verts[i].x;
      y += verts[i].y;
      z += verts[i].z;
    }
    const n = selected.length;
    return { index: selected[selected.length - 1], v: { x: x / n, y: y / n, z: z / n }, indices: selected };
  }

  #axisEnd(v, axis) {
    return {
      x: v.x + (axis === "x" ? AXIS_LEN : 0),
      y: v.y + (axis === "y" ? AXIS_LEN : 0),
      z: v.z + (axis === "z" ? AXIS_LEN : 0),
    };
  }

  #hitAmong(verts, mx, my, radius = 10) {
    const cam = this.#cam();
    let best = -1;
    let bestD = radius;
    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      const d = Math.hypot(mx - p.sx, my - p.sy);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  #hitVert(mx, my) {
    const overlay = this.#overlay();
    if (overlay && overlay.bindJoint >= 0) return this.#hitAmong(overlay.verts, mx, my, 8);
    if (!this.#hasStick()) return -1;
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    return this.#hitAmong(enemy.frames[frame], mx, my, 10);
  }

  #hitAxis(mx, my) {
    const prim = this.#primaryVert();
    if (!prim) return null;
    const cam = this.#cam();
    const w = this.cssW;
    const h = this.cssH;
    const pa = projectPoint(prim.v, cam, w, h);
    if (!pa.ok) return null;
    let best = null;
    let bestD = AXIS_HIT;
    for (const axis of ["x", "y", "z"]) {
      const pb = projectPoint(this.#axisEnd(prim.v, axis), cam, w, h);
      if (!pb.ok) continue;
      const d = distPointToSegment2d(mx, my, pa.sx, pa.sy, pb.sx, pb.sy);
      if (d < bestD) {
        bestD = d;
        best = axis;
      }
    }
    return best;
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.orbit.dist = clampAnimDist(this.orbit.dist * (e.deltaY > 0 ? 1.1 : 1 / 1.1));
    this.opts.onViewChanged?.();
    this.draw();
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    if (e.button === 2 && e.altKey) {
      this.drag = { kind: "zoom", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 1) {
      this.drag = { kind: "pan", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 2) {
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;
    if (e.altKey) {
      e.preventDefault();
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const binding = this.#binding();
    const axis = binding ? null : this.#hitAxis(p.x, p.y);
    if (axis) {
      const prim = this.#selectionAnchor();
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const verts = enemy.frames[frame];
      this.opts.beginUndo?.();
      this.drag = {
        kind: "axis",
        axis,
        origs: prim.indices.map((i) => ({ i, x: verts[i].x, y: verts[i].y, z: verts[i].z })),
        orig: { x: prim.v.x, y: prim.v.y, z: prim.v.z },
        start: p,
      };
