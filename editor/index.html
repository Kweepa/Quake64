      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const vi = this.#hitVert(p.x, p.y);
    if (vi >= 0) {
      if (binding) {
        this.opts.onSelectMeshVert?.(vi, e.shiftKey);
        this.drag = { kind: "select" };
        this.canvas.setPointerCapture(e.pointerId);
        this.draw();
        return;
      }
      const selected = this.opts.getSelectedVerts?.() || [];
      const wasSelected = selected.includes(vi);
      this.opts.onSelectVert?.(vi, e.shiftKey);
      if (!wasSelected && !e.shiftKey) {
        const enemy = this.opts.getEnemy();
        const frame = this.opts.getFrame();
        const v = enemy.frames[frame][vi];
        this.drag = {
          kind: "plane",
          index: vi,
          lock: this.#lockAxis(),
          orig: { x: v.x, y: v.y, z: v.z },
          undoStarted: false,
        };
      } else {
        this.drag = { kind: "select" };
      }
      this.canvas.setPointerCapture(e.pointerId);
      this.draw();
      return;
    }
    this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    if (!this.drag) {
      this.hoverAxis = this.#binding() ? null : this.#hitAxis(p.x, p.y);
      this.hover = this.hoverAxis ? -1 : this.#hitVert(p.x, p.y);
      this.draw();
      return;
    }
    if (this.drag.kind === "orbit") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      this.orbit.yaw += dx * 0.01;
      this.orbit.pitch = Math.max(-1.2, Math.min(1.2, this.orbit.pitch - dy * 0.01));
      this.draw();
      return;
    }
    if (this.drag.kind === "pan") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      if (dx || dy) {
        const focal = Math.min(this.cssW, this.cssH) * 0.9;
        const scale = this.orbit.dist / focal;
        const { right, up } = lookVectors(this.orbit.yaw, this.orbit.pitch);
        const t = this.orbit.target;
        t.x += (-right.x * dx + up.x * dy) * scale;
        t.y += (-right.y * dx + up.y * dy) * scale;
        t.z += (-right.z * dx + up.z * dy) * scale;
      }
      this.draw();
      return;
    }
    if (this.drag.kind === "zoom") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      const delta = dx + dy;
      if (delta) {
        this.orbit.dist = clampAnimDist(this.orbit.dist * Math.exp(-delta * ANIM_ZOOM_K));
      }
      this.draw();
      return;
    }
    if (this.drag.kind === "box") {
      this.drag.end = p;
      this.draw();
      return;
    }
    if (this.drag.kind === "axis") {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const verts = enemy.frames[frame];
      const cam = this.#cam();
      const orig = this.drag.orig;
      const pa = projectPoint(orig, cam, this.cssW, this.cssH);
      const pb = projectPoint(this.#axisEnd(orig, this.drag.axis), cam, this.cssW, this.cssH);
      if (!pa.ok || !pb.ok) return;
      const ax = pb.sx - pa.sx;
      const ay = pb.sy - pa.sy;
      const alen2 = ax * ax + ay * ay;
      if (alen2 < 16) return;
      const t = ((p.x - this.drag.start.x) * ax + (p.y - this.drag.start.y) * ay) / alen2;
      const delta = Math.round(t * AXIS_LEN);
      for (const o of this.drag.origs) {
        const v = verts[o.i];
        v.x = o.x;
        v.y = o.y;
        v.z = o.z;
        v[this.drag.axis] = clampVert(o[this.drag.axis] + delta);
      }
      this.opts.onChange?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "plane") {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const v = enemy.frames[frame][this.drag.index];
      const orig = this.drag.orig;
      const cam = this.#cam();
      const ray = screenRay(p.x, p.y, cam, this.cssW, this.cssH);
      const n = { x: 0, y: 0, z: 0 };
      n[this.drag.lock] = 1;
      const hit = intersectPlane(ray.origin, ray.dir, orig, n);
      if (!hit) return;
      const next = {
        x: this.drag.lock === "x" ? orig.x : clampVert(Math.round(hit.point.x)),
        y: this.drag.lock === "y" ? orig.y : clampVert(Math.round(hit.point.y)),
        z: this.drag.lock === "z" ? orig.z : clampVert(Math.round(hit.point.z)),
      };
      if (next.x === v.x && next.y === v.y && next.z === v.z) return;
      if (!this.drag.undoStarted) {
        this.opts.beginUndo?.();
        this.drag.undoStarted = true;
      }
      v.x = next.x;
      v.y = next.y;
      v.z = next.z;
      this.opts.onChange?.();
      this.draw();
    }
  }

  #lockAxis() {
    const { forward } = lookVectors(this.orbit.yaw, this.orbit.pitch);
    const ax = Math.abs(forward.x);
    const ay = Math.abs(forward.y);
    const az = Math.abs(forward.z);
    if (ax >= ay && ax >= az) return "x";
    if (ay >= az) return "y";
    return "z";
  }

  #boxRect() {
    const a = this.drag.start;
    const b = this.drag.end;
    const x0 = Math.min(a.x, b.x);
    const y0 = Math.min(a.y, b.y);
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  #vertsInBox(rect) {
    const overlay = this.#overlay();
    const verts =
      overlay && overlay.bindJoint >= 0
        ? overlay.verts
        : this.#hasStick()
          ? this.opts.getEnemy().frames[this.opts.getFrame()]
          : [];
    const cam = this.#cam();
    const hits = [];
    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      if (p.sx >= rect.x0 && p.sx <= rect.x1 && p.sy >= rect.y0 && p.sy <= rect.y1) hits.push(i);
    });
    return hits;
  }

  #finishBox() {
    const rect = this.#boxRect();
    const additive = this.drag.additive;
    const binding = this.#binding();
    if (rect.w < ANIM_BOX_CLICK && rect.h < ANIM_BOX_CLICK) {
      if (!binding && !additive) this.opts.onSelectVerts?.([]);
      return;
    }
    const hits = this.#vertsInBox(rect);
    if (binding) this.opts.onSelectMeshVerts?.(hits, additive);
    else this.opts.onSelectVerts?.(hits, additive);
  }

  #onUp(e) {
    if (!this.enabled) return;
    const orbitEnded =
      this.drag?.kind === "orbit" || this.drag?.kind === "zoom" || this.drag?.kind === "pan";
    if (this.drag?.kind === "box") this.#finishBox();
    if (this.drag?.kind === "axis" || this.drag?.undoStarted) this.opts.endUndo?.();
    this.drag = null;
    if (orbitEnded) this.opts.onViewChanged?.();
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    this.draw();
  }

  #strokeSeg(ctx, cam, w, h, p0, p1, col, width = 1) {
    const seg = projectLine(p0, p1, cam, w, h);
    if (!seg) return;
    ctx.strokeStyle = col;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  #drawForwardArrow(ctx, cam, w, h) {
    const y = 0.2;
    const tip = { x: 0, y, z: 14 };
    const col = "#d4a017";
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y, z: 0 }, tip, col, 2.5);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 2.5, y, z: 10 }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: -2.5, y, z: 10 }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 0, y: 2.5, z: 10 }, col, 2);
    const label = projectPoint({ x: 0, y: 1.5, z: 16 }, cam, w, h);
    if (label.ok) {
      ctx.fillStyle = col;
      ctx.font = "11px Segoe UI, sans-serif";
      ctx.fillText("fwd", label.sx - 10, label.sy);
    }
  }

  #drawGizmo(ctx, cam, w, h, v) {
    for (const axis of ["x", "y", "z"]) {
      const hi = this.hoverAxis === axis || this.drag?.axis === axis;
      const col = hi ? "#fff" : AXIS_COLS[axis];
      this.#strokeSeg(ctx, cam, w, h, v, this.#axisEnd(v, axis), col, hi ? 3 : 2);
      const tip = projectPoint(this.#axisEnd(v, axis), cam, w, h);
      if (tip.ok) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(tip.sx, tip.sy, hi ? 5 : 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const cam = this.#cam();
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const selected = this.opts.getSelectedVerts?.() || [];
    const overlay = this.#overlay();
    const binding = overlay && overlay.bindJoint >= 0;
    const stickOn = this.#hasStick();
    const verts = stickOn ? enemy.frames[frame] || enemy.frames[0] : null;
    let shown = selected;
    let meshShown = overlay ? [...(overlay.jointVerts[overlay.bindJoint] || [])] : [];
    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      if (r.w >= ANIM_BOX_CLICK || r.h >= ANIM_BOX_CLICK) {
        const hits = this.#vertsInBox(r);
        if (binding) {
          meshShown = this.drag.additive ? [...new Set([...meshShown, ...hits])] : hits;
        } else {
          shown = this.drag.additive ? [...new Set([...selected, ...hits])] : hits;
        }
      }
    }

    ctx.lineWidth = 1;
    for (let i = -24; i <= 24; i += 8) {
      this.#strokeSeg(ctx, cam, w, h, { x: i, y: 0, z: -24 }, { x: i, y: 0, z: 24 }, "#3d4658");
      this.#strokeSeg(ctx, cam, w, h, { x: -24, y: 0, z: i }, { x: 24, y: 0, z: i }, "#3d4658");
    }
    this.#strokeSeg(ctx, cam, w, h, { x: -20, y: 0, z: 0 }, { x: 20, y: 0, z: 0 }, "#a66");
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y: 0, z: 0 }, { x: 0, y: 24, z: 0 }, "#6a6");
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y: 0, z: -20 }, { x: 0, y: 0, z: 20 }, "#66a");
    this.#drawForwardArrow(ctx, cam, w, h);

    if (overlay) {
      ctx.lineWidth = 1;
      for (const [i, j] of overlay.edges) {
        const a = overlay.verts[i];
        const b = overlay.verts[j];
        if (a && b) this.#strokeSeg(ctx, cam, w, h, a, b, "#3a4458", 1);
      }
      if (overlay.ghost) {
        for (const [i, j] of overlay.lines || enemy.lines) {
          const a = overlay.ghost[i];
          const b = overlay.ghost[j];
          if (a && b) this.#strokeSeg(ctx, cam, w, h, a, b, "#5ec8c8", 1.5);
        }
        overlay.ghost.forEach((v) => {
          if (!v) return;
          const p = projectPoint(v, cam, w, h);
          if (!p.ok) return;
          ctx.fillStyle = "#5ec8c8";
          ctx.beginPath();
          ctx.arc(p.sx, p.sy, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    if (stickOn && verts) {
      ctx.lineWidth = 1.5;
      for (const [i, j] of enemy.lines) {
        this.#strokeSeg(ctx, cam, w, h, verts[i], verts[j], "#c8ccd4", 1.5);
      }

      verts.forEach((v, i) => {
        const p = projectPoint(v, cam, w, h);
        if (!p.ok) return;
        const sel = !binding && shown.includes(i);
        const hover = !binding && i === this.hover;
        ctx.fillStyle = sel ? "#d4a017" : hover ? "#fff" : "#8b91a0";
        const r = sel ? 5 : 4;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    if (binding) {
      const assignedOther = new Set();
      overlay.jointVerts.forEach((list, ji) => {
        if (ji === overlay.bindJoint) return;
        for (const i of list) assignedOther.add(i);
      });
      overlay.verts.forEach((v, i) => {
        const p = projectPoint(v, cam, w, h);
        if (!p.ok) return;
        const sel = meshShown.includes(i);
        const hover = i === this.hover;
        const other = assignedOther.has(i);
        ctx.fillStyle = sel ? "#d4a017" : hover ? "#fff" : other ? "#5ec8c8" : "#5a6270";
        const r = sel || hover ? 3.5 : 2.5;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    const prim = this.#selectionAnchor();
    if (prim && !binding && stickOn) this.#drawGizmo(ctx, cam, w, h, prim.v);

    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      ctx.fillStyle = "rgba(212, 160, 23, 0.12)";
      ctx.fillRect(r.x0, r.y0, r.w, r.h);
      ctx.strokeStyle = "#d4a017";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w, r.h);
      ctx.setLineDash([]);
    }

    ctx.fillStyle = "#8b91a0";
    ctx.font = "11px Segoe UI, sans-serif";
    const clip = clipForFrame(enemy.clips, frame);
    let label;
    if (overlay?.frameName) {
      label = overlay.frameName;
    } else if (stickOn && enemy.clips?.length && clip) {
      label = `${clip.name} ${frame - clip.start}`;
    } else {
      label = "rest";
    }
    const frameTotal = stickOn && enemy.clips?.length ? enemy.frames.length : overlay ? "MDL" : enemy.frames.length;
    ctx.fillText(`${enemy.name} · ${label} · 13 verts · ${frameTotal} frames`, 8, 16);
  }
}


// ---- js/weaponView.js ----
const ONION = "rgba(180, 170, 140, 0.28)";
const CURRENT = "#e8e4d8";
const OVERLAY = "rgba(212, 160, 23, 0.9)";
const GRID = "rgba(255, 255, 255, 0.06)";

class WeaponView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.enabled = false;
    this.drag = null;
    this.cssW = 0;
    this.cssH = 0;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  resize() {
    if (!this.enabled) return;
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  #layout() {
    const w = this.cssW;
    const h = this.cssH;
    const cell = Math.min(w / (WEAPON_SPRITE_W * 2.15), h / (WEAPON_SPRITE_H * 2.15));
    const ow = WEAPON_SPRITE_W * cell;
    const oh = WEAPON_SPRITE_H * cell;
    return {
      cell,
      ox: (w - ow) / 2,
      oy: (h - oh) / 2,
      ow,
      oh,
    };
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #toCanvas(layout, x, y) {
    return { x: layout.ox + x * layout.cell, y: layout.oy + y * layout.cell };
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    const cur = this.opts.getScale();
    const next = Math.max(0.05, Math.min(8, cur * (e.deltaY > 0 ? 0.92 : 1.08)));
    if (Math.abs(next - cur) < 1e-6) return;
    this.opts.beginUndo?.();
    this.opts.setScale(next);
    this.opts.endUndo?.();
    this.opts.onChange?.();
    this.opts.onPanEnd?.();
    this.draw();
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    if (e.button !== 0) return;
    const p = this.#eventPos(e);
    const pan = this.opts.getPan();
    this.opts.beginUndo?.();
    this.drag = { kind: "pan", last: p, pan: { x: pan.x, y: pan.y } };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #onMove(e) {
    if (!this.enabled || !this.drag || this.drag.kind !== "pan") return;
    const p = this.#eventPos(e);
    const layout = this.#layout();
    const dx = (p.x - this.drag.last.x) / layout.cell;
    const dy = (p.y - this.drag.last.y) / layout.cell;
    this.drag.last = p;
    this.drag.pan = { x: this.drag.pan.x + dx, y: this.drag.pan.y + dy };
    this.opts.setPan(this.drag.pan.x, this.drag.pan.y);
    this.opts.onChange?.();
    this.draw();
  }

  #onUp() {
    if (!this.drag) return;
    const pan = this.drag.kind === "pan";
    this.drag = null;
    if (pan) {
      this.opts.endUndo?.();
      this.opts.onPanEnd?.();
    }
  }

  #strokeSegs(ctx, layout, segs, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    for (const s of segs) {
      const a = this.#toCanvas(layout, s.ax, s.ay);
      const b = this.#toCanvas(layout, s.bx, s.by);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
  }

  drawPreview() {
    const canvas = this.opts.previewCanvas;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const scale = 6;
    canvas.width = WEAPON_SPRITE_W * scale;
    canvas.height = WEAPON_SPRITE_H * scale;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const mdl = this.opts.getMdl?.();
    if (!mdl) return;
    const { pixels } = rasterWeaponFrame(
      mdl,
      this.opts.getPreviewFrame(),
      this.opts.getScale(),
      this.opts.getPan()
    );
    ctx.fillStyle = "#e8e4d8";
    for (let y = 0; y < WEAPON_SPRITE_H; y++) {
      for (let x = 0; x < WEAPON_SPRITE_W; x++) {
        if (!pixels[y * WEAPON_SPRITE_W + x]) continue;
        ctx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
    ctx.strokeStyle = "rgba(212, 160, 23, 0.5)";
    ctx.strokeRect(0.5, 0.5, canvas.width - 1, canvas.height - 1);
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.moveTo(24 * scale + 0.5, 0);
    ctx.lineTo(24 * scale + 0.5, canvas.height);
    ctx.moveTo(0, 21 * scale + 0.5);
    ctx.lineTo(canvas.width, 21 * scale + 0.5);
    ctx.stroke();
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const layout = this.#layout();
    ctx.fillStyle = "rgba(212, 160, 23, 0.06)";
    ctx.fillRect(layout.ox, layout.oy, layout.ow, layout.oh);
    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < WEAPON_SPRITE_W; x++) {
      const px = layout.ox + x * layout.cell;
      ctx.moveTo(px, layout.oy);
      ctx.lineTo(px, layout.oy + layout.oh);
    }
    for (let y = 1; y < WEAPON_SPRITE_H; y++) {
      const py = layout.oy + y * layout.cell;
      ctx.moveTo(layout.ox, py);
      ctx.lineTo(layout.ox + layout.ow, py);
    }
    ctx.stroke();
    ctx.strokeStyle = OVERLAY;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(layout.ox + 0.5, layout.oy + 0.5, layout.ow - 1, layout.oh - 1);
    ctx.strokeStyle = "rgba(212, 160, 23, 0.35)";
    ctx.beginPath();
    ctx.moveTo(layout.ox + 24 * layout.cell, layout.oy);
    ctx.lineTo(layout.ox + 24 * layout.cell, layout.oy + layout.oh);
    ctx.moveTo(layout.ox, layout.oy + 21 * layout.cell);
    ctx.lineTo(layout.ox + layout.ow, layout.oy + 21 * layout.cell);
    ctx.stroke();

    const mdl = this.opts.getMdl?.();
    if (!mdl) {
      ctx.fillStyle = "#8b91a0";
      ctx.font = "13px Segoe UI, sans-serif";
      ctx.fillText("Open shareware (pak0.pak) to load view-models", 16, 28);
      this.drawPreview();
      return;
    }

    const scale = this.opts.getScale();
    const pan = this.opts.getPan();
    const current = this.opts.getPreviewFrame();
    const onion = this.opts.getOnionFrames?.() || [];
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const fi of onion) {
      if (fi === current) continue;
      const { segs } = projectedWeaponEdges(mdl, fi, scale, pan);
      this.#strokeSegs(ctx, layout, segs, ONION, 1);
    }
    const { segs } = projectedWeaponEdges(mdl, current, scale, pan);
    this.#strokeSegs(ctx, layout, segs, CURRENT, 1.4);

    ctx.fillStyle = OVERLAY;
    ctx.font = "11px Segoe UI, sans-serif";
    ctx.fillText("48×42", layout.ox + 4, layout.oy - 6);

    this.drawPreview();
  }
}


// ---- js/itemView.js ----
const ITEM_VERT_HIT = 10;
const ITEM_LINE_HIT = 6;
const ITEM_BOX_CLICK = 4;
const ITEM_ZOOM_K = 0.008;

function clampItemDist(d) {
  return Math.max(ITEM_ORBIT_DIST_MIN, Math.min(ITEM_ORBIT_DIST_MAX, d));
}

/** { verts: [{x,y,z}], lines: [[i,j]] } in local indices. Survives mesh-type switches. */
let itemClip = null;

function offsetSortKey([dx, dy, dz]) {
  const m = Math.abs(dx) + Math.abs(dy) + Math.abs(dz);
  const axis = dx !== 0 ? 0 : dz !== 0 ? 1 : 2;
  const sign = dx + dy + dz < 0 ? 1 : 0;
  return m * 100 + axis * 10 + sign;
}

class ItemView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.orbit = { yaw: 0.6, pitch: 0.35, dist: 16, target: { x: 0, y: 0, z: 0 } };
    this.drag = null;
    this.hoverVert = -1;
    this.hoverLine = -1;
    this.hoverGizmo = null;
    this.selectedVerts = [];
    this.selectedLines = [];
    this.enabled = false;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    canvas.addEventListener("auxclick", (e) => {
      if (e.button === 1) e.preventDefault();
    });
  }

  resize() {
    if (!this.enabled) return;
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  selection() {
    return { verts: [...this.selectedVerts], lines: [...this.selectedLines] };
  }

  clearSelection() {
    this.selectedVerts = [];
    this.selectedLines = [];
    this.hoverVert = -1;
    this.hoverLine = -1;
    this.hoverGizmo = null;
  }

  addVertAtOrigin() {
    const mesh = this.#mesh();
    if (mesh.verts.length >= ITEM_MAX_VERTS) {
      this.opts.onStatus?.("Vertex cap (16)", true);
      return false;
    }
    const cell = { x: ITEM_ORIGIN, y: ITEM_ORIGIN, z: ITEM_ORIGIN };
    if (this.#occupied(mesh, cell.x, cell.y, cell.z)) {
      this.opts.onStatus?.("Origin is occupied", true);
      return false;
    }
    const next = [...mesh.verts, { ...cell }];
    if (!this.#uniqueOk(next)) {
      this.opts.onStatus?.(`Would exceed ${ITEM_MAX_UNIQUE} unique X or Z`, true);
      return false;
    }
    this.opts.beginUndo?.();
    mesh.verts.push({ ...cell });
    this.opts.endUndo?.();
    this.selectedVerts = [mesh.verts.length - 1];
    this.selectedLines = [];
    this.opts.onChange?.();
    this.opts.onSelect?.();
    this.draw();
    return true;
  }

  addLineFromSelection() {
    const mesh = this.#mesh();
    if (this.selectedVerts.length !== 2) {
      this.opts.onStatus?.("Select two vertices", true);
      return false;
    }
    const [a, b] = this.selectedVerts;
    if (!this.#canAddLine(mesh, a, b)) {
      this.opts.onStatus?.(mesh.lines.length >= ITEM_MAX_LINES ? "Line cap (16)" : "Line already exists", true);
      return false;
    }
    this.opts.beginUndo?.();
    this.#tryAddLine(mesh, a, b);
    this.opts.endUndo?.();
    this.opts.onChange?.();
    this.opts.onSelect?.();
    this.draw();
    return true;
  }

  deleteSelection() {
    const mesh = this.#mesh();
    if (!mesh) return false;
    const lines = [...this.selectedLines].filter((i) => i >= 0 && i < mesh.lines.length).sort((a, b) => b - a);
    const verts = [...this.selectedVerts].filter((i) => i >= 0 && i < mesh.verts.length).sort((a, b) => b - a);
    if (!lines.length && !verts.length) return false;
    this.opts.beginUndo?.();
    for (const i of lines) mesh.lines.splice(i, 1);
    for (const i of verts) {
      mesh.verts.splice(i, 1);
      mesh.lines = mesh.lines
        .filter(([a, b]) => a !== i && b !== i)
        .map(([a, b]) => [a > i ? a - 1 : a, b > i ? b - 1 : b]);
    }
    this.opts.endUndo?.();
    this.clearSelection();
    this.opts.onChange?.();
    this.opts.onSelect?.();
    this.draw();
    return true;
  }

  hasClipboard() {
    return !!(itemClip && itemClip.verts.length);
  }

  copySelection() {
    const clip = this.#gatherSelection();
    if (!clip) {
      this.opts.onStatus?.("Nothing selected", true);
      return false;
    }
    itemClip = clip;
    this.opts.onSelect?.();
    const nv = clip.verts.length;
    const ne = clip.lines.length;
    this.opts.onStatus?.(`Copied ${nv} vert${nv === 1 ? "" : "s"}, ${ne} line${ne === 1 ? "" : "s"}`);
    return true;
  }

  pasteSelection() {
    if (!itemClip?.verts.length) {
      this.opts.onStatus?.("Nothing to paste", true);
      return false;
    }
    const mesh = this.#mesh();
    const addV = itemClip.verts.length;
    const addE = itemClip.lines.length;
    if (mesh.verts.length + addV > ITEM_MAX_VERTS) {
      this.opts.onStatus?.("Vertex cap (16)", true);
      return false;
    }
    if (mesh.lines.length + addE > ITEM_MAX_LINES) {
      this.opts.onStatus?.("Line cap (16)", true);
      return false;
    }
    let uniqueFail = false;
    let placed = null;
    for (const [dx, dy, dz] of this.#pasteOffsets(itemClip.verts)) {
      const trial = this.#shiftedClip(dx, dy, dz);
      if (!trial || this.#cellsBlocked(mesh, trial)) continue;
      if (!this.#uniqueOk([...mesh.verts, ...trial])) {
        uniqueFail = true;
        continue;
      }
      placed = trial;
      break;
    }
    if (!placed) {
      this.opts.onStatus?.(
        uniqueFail ? `Would exceed ${ITEM_MAX_UNIQUE} unique X or Z` : "No free cells for paste",
        true
      );
      return false;
    }
    this.opts.beginUndo?.();
    const base = mesh.verts.length;
    for (const v of placed) mesh.verts.push({ x: v.x, y: v.y, z: v.z });
    for (const [a, b] of itemClip.lines) this.#tryAddLine(mesh, base + a, base + b);
    this.opts.endUndo?.();
    this.selectedVerts = placed.map((_, i) => base + i);
    this.selectedLines = [];
    this.opts.onChange?.();
    this.opts.onSelect?.();
    this.draw();
    this.opts.onStatus?.(`Pasted ${addV} vert${addV === 1 ? "" : "s"}, ${addE} line${addE === 1 ? "" : "s"}`);
    return true;
  }

  #gatherSelection() {
    const mesh = this.#mesh();
    const vset = new Set();
    const edgeKeys = new Set();
    const addEdge = (a, b) => {
      if (a === b || !mesh.verts[a] || !mesh.verts[b]) return;
      edgeKeys.add(`${Math.min(a, b)},${Math.max(a, b)}`);
    };
    for (const i of this.selectedVerts) {
      if (mesh.verts[i]) vset.add(i);
    }
    for (const i of this.selectedLines) {
      const e = mesh.lines[i];
      if (!e) continue;
      if (mesh.verts[e[0]]) vset.add(e[0]);
      if (mesh.verts[e[1]]) vset.add(e[1]);
      addEdge(e[0], e[1]);
    }
    if (!vset.size) return null;
    for (const [a, b] of mesh.lines) {
      if (vset.has(a) && vset.has(b)) addEdge(a, b);
    }
    const indices = [...vset].sort((a, b) => a - b);
    const imap = new Map(indices.map((i, j) => [i, j]));
    return {
      verts: indices.map((i) => {
        const v = mesh.verts[i];
        return { x: v.x | 0, y: v.y | 0, z: v.z | 0 };
      }),
      lines: [...edgeKeys].map((k) => {
        const [a, b] = k.split(",").map(Number);
        return [imap.get(a), imap.get(b)];
      }),
    };
  }

  #pasteOffsets(verts) {
    let minx = ITEM_MAX;
    let maxx = ITEM_MIN;
    let miny = ITEM_MAX;
    let maxy = ITEM_MIN;
    let minz = ITEM_MAX;
    let maxz = ITEM_MIN;
    for (const v of verts) {
      minx = Math.min(minx, v.x);
      maxx = Math.max(maxx, v.x);
      miny = Math.min(miny, v.y);
      maxy = Math.max(maxy, v.y);
      minz = Math.min(minz, v.z);
      maxz = Math.max(maxz, v.z);
    }
    const offs = [];
    for (let dx = ITEM_MIN - minx; dx <= ITEM_MAX - maxx; dx++) {
      for (let dy = ITEM_MIN - miny; dy <= ITEM_MAX - maxy; dy++) {
        for (let dz = ITEM_MIN - minz; dz <= ITEM_MAX - maxz; dz++) {
          offs.push([dx, dy, dz]);
        }
      }
    }
    offs.sort((a, b) => offsetSortKey(a) - offsetSortKey(b));
    return offs;
  }

  #shiftedClip(dx, dy, dz) {
    const placed = [];
    for (const v of itemClip.verts) {
      const x = v.x + dx;
      const y = v.y + dy;
      const z = v.z + dz;
      if (x < ITEM_MIN || x > ITEM_MAX || y < ITEM_MIN || y > ITEM_MAX || z < ITEM_MIN || z > ITEM_MAX) {
        return null;
      }
      placed.push({ x, y, z });
    }
    return placed;
  }

  #cellsBlocked(mesh, placed) {
    const seen = new Set();
    for (const v of placed) {
      const k = `${v.x},${v.y},${v.z}`;
      if (seen.has(k) || this.#occupied(mesh, v.x, v.y, v.z)) return true;
      seen.add(k);
    }
    return false;
  }

  #mesh() {
    return this.opts.getMesh?.() || { verts: [], lines: [] };
  }

  #cam() {
    const { yaw, pitch, dist, target } = this.orbit;
    const { forward } = lookVectors(yaw, pitch);
    return {
      x: target.x - forward.x * dist,
      y: target.y - forward.y * dist,
      z: target.z - forward.z * dist,
      yaw,
      pitch,
    };
  }

  /** Frame mesh verts; if none, center on origin without changing dist. */
  focusObject() {
    const points = this.#mesh().verts;
    if (!points?.length) {
      this.orbit.target = { x: 0, y: 0, z: 0 };
      this.opts.onViewChanged?.();
      this.draw();
      return true;
    }

    let minx = Infinity;
    let miny = Infinity;
    let minz = Infinity;
    let maxx = -Infinity;
    let maxy = -Infinity;
    let maxz = -Infinity;
    for (const v of points) {
      minx = Math.min(minx, v.x);
      miny = Math.min(miny, v.y);
      minz = Math.min(minz, v.z);
      maxx = Math.max(maxx, v.x);
      maxy = Math.max(maxy, v.y);
      maxz = Math.max(maxz, v.z);
    }
    const box = {
      x: minx,
      y: miny,
      z: minz,
      sx: Math.max(1e-3, maxx - minx),
      sy: Math.max(1e-3, maxy - miny),
      sz: Math.max(1e-3, maxz - minz),
    };
    const center = aabbCenter(box);
    const { yaw, pitch } = this.orbit;
    const { forward, right, up } = lookVectors(yaw, pitch);
    const w = this.cssW;
    const h = this.cssH;
    const focal = Math.min(w, h) * 0.9;
    const pad = 0.82;
    const halfW = Math.max(1, w * 0.5 * pad);
    const halfH = Math.max(1, h * 0.5 * pad);

    let frameDist = 4;
    for (let i = 0; i < 8; i++) {
      const c = cornerWorld(box, i);
      const rx = c.x - center.x;
      const ry = c.y - center.y;
      const rz = c.z - center.z;
      const cx = rx * right.x + ry * right.y + rz * right.z;
      const cy = rx * up.x + ry * up.y + rz * up.z;
      const cz = rx * forward.x + ry * forward.y + rz * forward.z;
      frameDist = Math.max(frameDist, (Math.abs(cx) * focal) / halfW - cz);
      frameDist = Math.max(frameDist, (Math.abs(cy) * focal) / halfH - cz);
      frameDist = Math.max(frameDist, 1 - cz);
    }

    this.orbit.target = { x: center.x, y: center.y, z: center.z };
    this.orbit.dist = clampItemDist(frameDist);
    this.opts.onViewChanged?.();
    this.draw();
    return true;
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #selectionAnchor() {
    const mesh = this.#mesh();
    const selected = this.selectedVerts.filter((i) => mesh.verts[i]);
    if (!selected.length) return null;
    if (selected.length === 1) {
      const i = selected[0];
      return { v: mesh.verts[i], indices: selected };
    }
    let x = 0;
    let y = 0;
    let z = 0;
    for (const i of selected) {
      x += mesh.verts[i].x;
      y += mesh.verts[i].y;
      z += mesh.verts[i].z;
    }
    const n = selected.length;
    return { v: { x: x / n, y: y / n, z: z / n }, indices: selected };
  }

  #applyVertDrag(origs, applyCoord) {
    const mesh = this.#mesh();
    const next = mesh.verts.map((v) => ({ ...v }));
    for (const o of origs) {
      next[o.i].x = o.x;
      next[o.i].y = o.y;
      next[o.i].z = o.z;
      applyCoord(next[o.i], o);
    }
    const seen = new Set();
    for (const v of next) {
      const k = `${v.x},${v.y},${v.z}`;
      if (seen.has(k)) return false;
      seen.add(k);
    }
    if (!this.#uniqueOk(next)) return false;
    for (const o of origs) {
      mesh.verts[o.i].x = next[o.i].x;
      mesh.verts[o.i].y = next[o.i].y;
      mesh.verts[o.i].z = next[o.i].z;
    }
    return true;
  }

  #gizmoDragOrigs(prim) {
    const mesh = this.#mesh();
    return prim.indices.map((i) => ({
      i,
      x: mesh.verts[i].x,
      y: mesh.verts[i].y,
      z: mesh.verts[i].z,
    }));
  }

  #startGizmoDrag(gizmoHit, prim, p) {
    this.opts.beginUndo?.();
    this.drag = {
      kind: gizmoHit.kind,
      axis: gizmoHit.axis,
      plane: gizmoHit.plane,
      planeN: gizmoHit.planeN,
      grab: gizmoHit.world,
      gizmoAxisLen: gizmoHit.gizmoAxisLen ?? GIZMO_FALLBACK_LEN,
      origs: this.#gizmoDragOrigs(prim),
      orig: { x: prim.v.x, y: prim.v.y, z: prim.v.z },
      start: p,
    };
  }

  #hitVert(mx, my, verts) {
    const cam = this.#cam();
    let best = -1;
    let bestD = ITEM_VERT_HIT;
    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      const d = Math.hypot(mx - p.sx, my - p.sy);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  #hitLine(mx, my, mesh) {
    const cam = this.#cam();
    let best = -1;
    let bestD = ITEM_LINE_HIT;
    mesh.lines.forEach(([ia, ib], i) => {
      const a = mesh.verts[ia];
      const b = mesh.verts[ib];
      if (!a || !b) return;
      const pl = projectLine(a, b, cam, this.cssW, this.cssH);
      if (!pl) return;
      const d = distPointToSegment2d(mx, my, pl.ax, pl.ay, pl.bx, pl.by);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.orbit.dist = clampItemDist(this.orbit.dist * (e.deltaY > 0 ? 1.1 : 1 / 1.1));
    this.opts.onViewChanged?.();
    this.draw();
  }

  #occupied(mesh, x, y, z, skip = new Set()) {
    return mesh.verts.some((v, i) => !skip.has(i) && v.x === x && v.y === y && v.z === z);
  }

  #uniqueOk(verts) {
    const { nx, nz } = itemUniqueXZ(verts);
    return nx <= ITEM_MAX_UNIQUE && nz <= ITEM_MAX_UNIQUE;
  }

  #canAddLine(mesh, a, b) {
    if (a === b || a < 0 || b < 0 || a >= mesh.verts.length || b >= mesh.verts.length) return false;
    if (mesh.lines.length >= ITEM_MAX_LINES) return false;
    const lo = Math.min(a, b);
    const hi = Math.max(a, b);
    return !mesh.lines.some(([ia, ib]) => Math.min(ia, ib) === lo && Math.max(ia, ib) === hi);
  }

  #tryAddLine(mesh, a, b) {
    if (!this.#canAddLine(mesh, a, b)) return false;
    mesh.lines.push([Math.min(a, b), Math.max(a, b)]);
    return true;
  }

  #selectVert(i, additive) {
    if (i < 0) this.selectedVerts = [];
    else if (additive) {
      if (!this.selectedVerts.includes(i)) this.selectedVerts.push(i);
    } else this.selectedVerts = [i];
    this.selectedLines = [];
    this.opts.onSelect?.();
  }

  #selectVerts(indices, additive) {
    if (additive) {
      for (const i of indices) {
        if (!this.selectedVerts.includes(i)) this.selectedVerts.push(i);
      }
    } else this.selectedVerts = [...indices];
    this.selectedLines = [];
    this.opts.onSelect?.();
  }

  #selectLine(i, additive) {
    if (i < 0) this.selectedLines = [];
    else if (additive) {
      if (!this.selectedLines.includes(i)) this.selectedLines.push(i);
    } else this.selectedLines = [i];
    this.selectedVerts = [];
    this.opts.onSelect?.();
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    const mesh = this.#mesh();

    if (e.button === 2 && e.altKey) {
      this.drag = { kind: "zoom", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 1) {
      this.drag = { kind: "pan", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 2) {
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;
    if (e.altKey) {
      e.preventDefault();
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const prim = this.#selectionAnchor();
    const cam = this.#cam();
    if (prim) {
      const gizmoHit = hitTranslateGizmo(prim.v, cam, this.cssW, this.cssH, p.x, p.y);
      if (gizmoHit) {
        this.#startGizmoDrag(gizmoHit, prim, p);
        this.canvas.setPointerCapture(e.pointerId);
        return;
      }
    }

    const vi = this.#hitVert(p.x, p.y, mesh.verts);
    if (vi >= 0) {
      this.#selectVert(vi, e.shiftKey);
      this.drag = { kind: "select" };
      this.canvas.setPointerCapture(e.pointerId);
      this.draw();
      return;
    }

    const li = this.#hitLine(p.x, p.y, mesh);
    if (li >= 0) {
      this.#selectLine(li, e.shiftKey);
      this.drag = { kind: "select" };
      this.canvas.setPointerCapture(e.pointerId);
      this.draw();
      return;
    }

    this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    const mesh = this.#mesh();
    if (!this.drag) {
      const prim = this.#selectionAnchor();
      const cam = this.#cam();
      this.hoverVert = this.#hitVert(p.x, p.y, mesh.verts);
      this.hoverGizmo =
        prim && this.hoverVert < 0
          ? hitTranslateGizmo(prim.v, cam, this.cssW, this.cssH, p.x, p.y)
          : null;
      this.hoverLine = this.hoverGizmo || this.hoverVert >= 0 ? -1 : this.#hitLine(p.x, p.y, mesh);
      this.draw();
      return;
    }
    if (this.drag.kind === "orbit") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      this.orbit.yaw += dx * 0.01;
      this.orbit.pitch = Math.max(-1.2, Math.min(1.2, this.orbit.pitch - dy * 0.01));
      this.opts.onViewChanged?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "pan") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      const focal = Math.min(this.cssW, this.cssH) * 0.9;
      const scale = this.orbit.dist / focal;
      const { right, up } = lookVectors(this.orbit.yaw, this.orbit.pitch);
      const t = this.orbit.target;
      t.x += (-right.x * dx + up.x * dy) * scale;
      t.y += (-right.y * dx + up.y * dy) * scale;
      t.z += (-right.z * dx + up.z * dy) * scale;
      this.opts.onViewChanged?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "zoom") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      const delta = dx + dy;
      if (delta) this.orbit.dist = clampItemDist(this.orbit.dist * Math.exp(-delta * ITEM_ZOOM_K));
      this.opts.onViewChanged?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "box") {
      this.drag.end = p;
      this.draw();
      return;
    }
    if (this.drag.kind === "axis") {
      const cam = this.#cam();
      const delta = gizmoAxisDragDelta(
        p,
        this.drag.grab,
        this.drag.axis,
        this.drag.start,
        this.drag.gizmoAxisLen ?? GIZMO_FALLBACK_LEN,
        cam,
        this.cssW,
        this.cssH
      );
      if (delta == null) return;
      if (
        this.#applyVertDrag(this.drag.origs, (v, o) => {
          v[this.drag.axis] = clampItemCoord(o[this.drag.axis] + delta);
        })
      ) {
        this.opts.onChange?.();
        this.draw();
      }
      return;
    }
    if (this.drag.kind === "plane") {
      const cam = this.#cam();
      const ray = screenRay(p.x, p.y, cam, this.cssW, this.cssH);
      const hit = intersectPlane(ray.origin, ray.dir, this.drag.grab, this.drag.planeN);
      if (!hit) return;
      let dx = Math.round(hit.point.x - this.drag.grab.x);
      let dy = Math.round(hit.point.y - this.drag.grab.y);
      let dz = Math.round(hit.point.z - this.drag.grab.z);
      if (this.drag.plane === "xy") dz = 0;
      else if (this.drag.plane === "xz") dy = 0;
      else if (this.drag.plane === "yz") dx = 0;
      if (
        this.#applyVertDrag(this.drag.origs, (v, o) => {
          v.x = clampItemCoord(o.x + dx);
          v.y = clampItemCoord(o.y + dy);
          v.z = clampItemCoord(o.z + dz);
        })
      ) {
        this.opts.onChange?.();
        this.draw();
      }
    }
  }

  #boxRect() {
    const a = this.drag.start;
    const b = this.drag.end;
    const x0 = Math.min(a.x, b.x);
    const y0 = Math.min(a.y, b.y);
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  #vertsInBox(rect) {
    const mesh = this.#mesh();
    const cam = this.#cam();
    const hits = [];
    mesh.verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      if (p.sx >= rect.x0 && p.sx <= rect.x1 && p.sy >= rect.y0 && p.sy <= rect.y1) hits.push(i);
    });
    return hits;
  }

  #finishBox() {
    const rect = this.#boxRect();
    const additive = this.drag.additive;
    if (rect.w < ITEM_BOX_CLICK && rect.h < ITEM_BOX_CLICK) {
      if (!additive) {
        this.selectedVerts = [];
        this.selectedLines = [];
        this.opts.onSelect?.();
      }
      return;
    }
    this.#selectVerts(this.#vertsInBox(rect), additive);
  }

  #onUp(e) {
    if (!this.enabled) return;
    const orbitEnded = this.drag?.kind === "orbit" || this.drag?.kind === "zoom" || this.drag?.kind === "pan";
    if (this.drag?.kind === "box") this.#finishBox();
    if (this.drag?.kind === "axis" || this.drag?.kind === "plane") this.opts.endUndo?.();
    this.drag = null;
    if (orbitEnded) this.opts.onViewChanged?.();
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    this.draw();
  }

  #strokeSeg(ctx, cam, w, h, p0, p1, col, width = 1) {
    const seg = projectLine(p0, p1, cam, w, h);
    if (!seg) return;
    ctx.strokeStyle = col;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  #drawGizmo(ctx, cam, w, h, v) {
    drawTranslateGizmo(ctx, v, cam, w, h, { hoverGizmo: this.hoverGizmo, drag: this.drag });
  }

  #drawForwardArrow(ctx, cam, w, h) {
    const y = 0.15;
    const tipZ = ITEM_MAX;
    const barbZ = ITEM_MAX - 1.2;
    const tip = { x: 0, y, z: tipZ };
    const col = "#d4a017";
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y, z: 0 }, tip, col, 2.5);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 0.9, y, z: barbZ }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: -0.9, y, z: barbZ }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 0, y: 1.05, z: barbZ }, col, 2);
    const label = projectPoint({ x: 0, y: 0.55, z: tipZ + 0.6 }, cam, w, h);
    if (label.ok) {
      ctx.fillStyle = col;
      ctx.font = "11px Segoe UI, sans-serif";
      ctx.fillText("fwd", label.sx - 10, label.sy);
    }
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);
    const cam = this.#cam();
    const mesh = this.#mesh();
    const lo = ITEM_MIN;
    const hi = ITEM_MAX;

    for (let i = lo; i <= hi; i++) {
      const col = i === 0 ? "#3d4658" : "#2a3140";
      this.#strokeSeg(ctx, cam, w, h, { x: i, y: 0, z: lo }, { x: i, y: 0, z: hi }, col);
      this.#strokeSeg(ctx, cam, w, h, { x: lo, y: 0, z: i }, { x: hi, y: 0, z: i }, col);
    }
    const cube = [
      [
        { x: lo, y: lo, z: lo },
        { x: hi, y: lo, z: lo },
      ],
      [
        { x: hi, y: lo, z: lo },
        { x: hi, y: lo, z: hi },
      ],
      [
        { x: hi, y: lo, z: hi },
        { x: lo, y: lo, z: hi },
      ],
      [
        { x: lo, y: lo, z: hi },
        { x: lo, y: lo, z: lo },
      ],
      [
        { x: lo, y: hi, z: lo },
        { x: hi, y: hi, z: lo },
      ],
      [
        { x: hi, y: hi, z: lo },
        { x: hi, y: hi, z: hi },
      ],
      [
        { x: hi, y: hi, z: hi },
        { x: lo, y: hi, z: hi },
      ],
      [
        { x: lo, y: hi, z: hi },
        { x: lo, y: hi, z: lo },
      ],
      [
        { x: lo, y: lo, z: lo },
        { x: lo, y: hi, z: lo },
      ],
      [
        { x: hi, y: lo, z: lo },
        { x: hi, y: hi, z: lo },
      ],
      [
        { x: hi, y: lo, z: hi },
        { x: hi, y: hi, z: hi },
      ],
      [
        { x: lo, y: lo, z: hi },
        { x: lo, y: hi, z: hi },
      ],
    ];
    for (const [a, b] of cube) this.#strokeSeg(ctx, cam, w, h, a, b, "#252a35");

    this.#drawForwardArrow(ctx, cam, w, h);

    let shownVerts = this.selectedVerts;
    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      if (r.w >= ITEM_BOX_CLICK || r.h >= ITEM_BOX_CLICK) {
        const hits = this.#vertsInBox(r);
        shownVerts = this.drag.additive ? [...new Set([...this.selectedVerts, ...hits])] : hits;
      }
    }

    mesh.lines.forEach(([ia, ib], i) => {
      const a = mesh.verts[ia];
      const b = mesh.verts[ib];
      if (!a || !b) return;
      const sel = this.selectedLines.includes(i);
      this.#strokeSeg(ctx, cam, w, h, a, b, sel ? "#f2d36b" : "#c8ccd4", sel ? 2.5 : 1.5);
    });

    mesh.verts.forEach((v, i) => {
      const pr = projectPoint(v, cam, w, h);
      if (!pr.ok) return;
      const sel = shownVerts.includes(i);
      const ho = i === this.hoverVert;
      ctx.fillStyle = sel ? "#d4a017" : ho ? "#fff" : "#6ec4a8";
      const r = sel || ho ? 5 : 4;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, r, 0, Math.PI * 2);
      ctx.fill();
    });

    const prim = this.#selectionAnchor();
    if (prim) this.#drawGizmo(ctx, cam, w, h, prim.v);

    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      ctx.fillStyle = "rgba(212, 160, 23, 0.12)";
      ctx.fillRect(r.x0, r.y0, r.w, r.h);
      ctx.strokeStyle = "#d4a017";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w, r.h);
      ctx.setLineDash([]);
    }
  }
}


// ---- js/main.js ----
const statusEl = document.getElementById("status");
const titleEl = document.querySelector(".toolbar h1");
const btnUndo = document.getElementById("btn-undo");
const btnRedo = document.getElementById("btn-redo");
const UNDO_LIMIT = 40;
const AUTOSAVE_MS = 8000;
const MDL_RIG_BACKUP_KEY = "quake64-mdl-rigs";
/** Match Quake monster default: one MDL frame per 0.1s think. */
const ANIM_PLAY_MS = 100;

let doc = createDefaultDocument();
let editorMode = "layout";
let localDraw = false;
let neighbourDraw = false;
let selectedIds = [];
let pendingPlace = null;
let enemyIndex = 0;
let frameIndex = 0;
let selectedVerts = [];
let dirty = false;
let saving = false;
let autosaveTimer = null;
let editorSaveRaf = 0;
let editorSettingsReady = false;
let applyingEditor = false;
let undoStack = [];
let redoStack = [];
let undoGesture = false;
let animPlaying = false;
let animPlayTimer = null;
let animLoop = false;
let sharewareModels = {};
let sharewareMissing = [];
let sharewareWeapons = {};
let sharewareWeaponMissing = [];
let overlayOn = true;
let bindJoint = -1;
let clipIndex = 0;
let frameLocal = 0;
let mdlScale = DEFAULT_MDL_SCALE;
let weaponKey = "axe";
let weaponFrame = 0;
let itemMeshKey = "backpack";
/** Collapsed room ids in the Objects tree. */
const collapsedRooms = new Set();
/** Last room used for placement / parenting. */
let lastRoomId = null;

const layoutView = new LayoutView(document.getElementById("view-canvas"), {
  stage: document.getElementById("map-stage"),
  getDoc: () => doc,
  getSelectedIds: () => selectedIds,
  getLocalMode: () => localDraw && editorMode === "layout",
  getNeighbourMode: () => neighbourDraw,
  getFocusRoom: () => localFocusRoom(doc, selectedIds, lastRoomId),
  onSelectIds: (ids, additive) => {
    if (additive) {
      for (const id of ids) {
        if (!selectedIds.includes(id)) selectedIds.push(id);
      }
    } else selectedIds = [...ids];
    rememberSelectedRoom();
    markUi();
    refreshPanels();
  },
  onToggleSelect: (id) => {
    const i = selectedIds.indexOf(id);
    if (i >= 0) selectedIds.splice(i, 1);
    else selectedIds.push(id);
    rememberSelectedRoom();
    markUi();
    refreshPanels();
  },
  onChange: () => {
    markDirty();
    refreshPanels();
  },
  onViewChanged: () => {
    markUi();
  },
  onStatus: setStatus,
  beginUndo,
  endUndo,
});

const overheadView = new OverheadView(document.getElementById("overhead-canvas"), {
  getDoc: () => doc,
  getCamera: () => layoutView.camera,
  getSelectedId: () => (selectedIds.length ? selectedIds[selectedIds.length - 1] : null),
  getSelectedIds: () => selectedIds,
  getLocalMode: () => localDraw,
  getNeighbourMode: () => neighbourDraw,
  getFocusRoom: () => localFocusRoom(doc, selectedIds, lastRoomId),
});

const animView = new AnimView(document.getElementById("view-canvas"), {
  stage: document.getElementById("map-stage"),
  getEnemy: () => doc.enemies[enemyIndex],
  getFrame: () => {
    const e = doc.enemies[enemyIndex];
    const stick = stickClipFor(e, activeTimelineClip());
    if (stick) return stick.start + frameLocal;
    if (!e?.clips?.length) return 0;
    return frameIndex;
  },
  hasStickFrame: () => !!stickClipFor(doc.enemies[enemyIndex], activeTimelineClip()),
  getSelectedVerts: () => selectedVerts,
  onSelectVert: (i, additive) => {
    if (i < 0) selectedVerts = [];
    else if (additive) {
      if (!selectedVerts.includes(i)) selectedVerts.push(i);
    } else selectedVerts = [i];
    markUi();
    refreshPanels();
  },
  onSelectVerts: (indices, additive) => {
    if (additive) {
      for (const i of indices) {
        if (!selectedVerts.includes(i)) selectedVerts.push(i);
      }
    } else selectedVerts = [...indices];
    markUi();
    refreshPanels();
  },
  onChange: () => {
    markDirty();
    refreshPanels();
  },
  onViewChanged: () => {
    markUi();
  },
  beginUndo,
  endUndo,
  getMeshOverlay: () => {
    if (!overlayOn) return null;
    const e = doc.enemies[enemyIndex];
    if (!e) return null;
    const mdl = sharewareModels[e.name];
    if (!mdl) return null;
    const timeline = getTimeline(e);
    const clip = timeline[clipIndex] || timeline[0];
    if (!clip) return null;
    const local = Math.max(0, Math.min(frameLocal, clip.len - 1));
    const frameName = clip.frameNames?.[local] || `${clip.name}${local}`;
    const mdlFi = clip.mdlFrames[local]?.index ?? 0;
    const verts = mdlEditorVerts(mdl, mdlFi, mdlScale);
    const rig = e.mdlRig || emptyMdlRig();
    return {
      verts,
      edges: mdl.edges,
      bindJoint,
      jointVerts: rig.jointVerts,
      ghost: averageJointPositions(verts, rig.jointVerts),
      lines: e.lines,
      frameName,
    };
  },
  onSelectMeshVert: (i, additive) => {
    assignMeshVerts([i], additive);
  },
  onSelectMeshVerts: (indices, additive) => {
    assignMeshVerts(indices, additive);
  },
});

const weaponView = new WeaponView(document.getElementById("view-canvas"), {
  stage: document.getElementById("map-stage"),
  previewCanvas: document.getElementById("weapon-preview-canvas"),
  getMdl: () => sharewareWeapons[weaponKey] || null,
  getScale: () => doc.weapons.scale,
  getPan: () => {
    const item = doc.weapons.items[weaponKey];
    return item?.pan || { x: 0, y: 0 };
  },
  getPreviewFrame: () => weaponFrame,
  getOnionFrames: () => selectedWeaponFrames(),
  setScale: (v) => {
    doc.weapons.scale = clampWeaponScale(v);
    syncWeaponScaleInputs();
  },
  setPan: (x, y) => {
    const item = ensureWeaponItem(weaponKey);
    item.pan = { x, y };
  },
  beginUndo,
  endUndo,
  onChange: () => {
    markDirty();
  },
  onPanEnd: () => {
    refreshWeaponClipStatus();
  },
});

const itemView = new ItemView(document.getElementById("view-canvas"), {
  stage: document.getElementById("map-stage"),
  getMesh: () => {
    if (!doc.items) doc.items = {};
    if (!doc.items[itemMeshKey]) doc.items[itemMeshKey] = { verts: [], lines: [] };
    return doc.items[itemMeshKey];
  },
  beginUndo,
  endUndo,
  onChange: () => {
    markDirty();
    renderInspector();
  },
  onSelect: () => renderInspector(),
  onStatus: (msg, isError) => setStatus(msg, isError),
  onViewChanged: () => markUi(),
});

function setStatus(msg, isError = false) {
  statusEl.textContent = msg || "";
  statusEl.classList.toggle("error", isError);
}

function updateDirtyIndicator() {
  const star = dirty ? "*" : "";
  if (titleEl) titleEl.textContent = `Quake64${star}`;
  document.title = dirty ? "Quake64 *" : "Quake64 Editor";
}

function markDirty() {
  if (!dirty) {
    dirty = true;
    updateDirtyIndicator();
  }
  scheduleAutosave();
}

function markClean() {
  dirty = false;
  updateDirtyIndicator();
  clearAutosaveTimer();
}

function mdlRigBackupRaw() {
  try {
    const raw = JSON.parse(localStorage.getItem(MDL_RIG_BACKUP_KEY) || "null");
    return raw && typeof raw === "object" ? raw : null;
  } catch {
    return null;
  }
}

function persistMdlRigBackup() {
  const out = { ...(mdlRigBackupRaw() || {}) };
  for (const e of doc.enemies || []) {
    const jv = e.mdlRig?.jointVerts;
    if (!Array.isArray(jv) || !jv.some((list) => list.length)) {
      delete out[e.name];
      continue;
    }
    out[e.name] = jv.map((list) => [...list]);
  }
  try {
    if (!Object.keys(out).length) localStorage.removeItem(MDL_RIG_BACKUP_KEY);
    else localStorage.setItem(MDL_RIG_BACKUP_KEY, JSON.stringify(out));
  } catch {
    /* private mode / quota */
  }
}

/** Fill empty in-memory rigs from localStorage (survives refresh without doc reload). */
function restoreMdlRigBackup() {
  const raw = mdlRigBackupRaw();
  if (!raw) return false;
  let changed = false;
  for (const e of doc.enemies || []) {
    const jv = e.mdlRig?.jointVerts;
    if (Array.isArray(jv) && jv.some((list) => list.length)) continue;
    const saved = raw[e.name];
    if (!Array.isArray(saved)) continue;
    e.mdlRig = normalizeMdlRig({ jointVerts: saved });
    changed = true;
  }
  return changed;
}

function clearAutosaveTimer() {
  if (autosaveTimer) {
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
  }
}

function isEditingField(el = document.activeElement) {
  return (
    el instanceof HTMLInputElement ||
    el instanceof HTMLTextAreaElement ||
    el instanceof HTMLSelectElement ||
    !!el?.isContentEditable
  );
}

function scheduleAutosave() {
  clearAutosaveTimer();
  if (!dirty || isEditingField()) return;
  autosaveTimer = setTimeout(() => {
    autosaveTimer = null;
    void runAutosave();
  }, AUTOSAVE_MS);
}

async function runAutosave() {
  if (!dirty || saving || !hasDocFileHandle()) return;
  if (isEditingField()) {
    scheduleAutosave();
    return;
  }
  await saveNow("Autosaved");
}

document.addEventListener("focusin", (e) => {
  if (isEditingField(e.target)) clearAutosaveTimer();
});
document.addEventListener("focusout", () => {
  requestAnimationFrame(() => {
    if (dirty && !isEditingField()) scheduleAutosave();
  });
});

function markUi() {
  if (applyingEditor || !editorSettingsReady) return;
  schedulePersistEditor();
}

/** Per-map layout cameras (E1M1 …). */
let layoutCamerasByLevel = {};

function snapshotLayoutCamera() {
  const cam = layoutView.camera;
  return {
    x: cam.x,
    y: cam.y,
    z: cam.z,
    yaw: cam.yaw,
    pitch: cam.pitch,
    speed: cam.speed,
  };
}

function applyLayoutCamera(cam) {
  const c = layoutView.camera;
  c.x = cam.x;
  c.y = cam.y;
  c.z = cam.z;
  c.yaw = cam.yaw;
  c.pitch = cam.pitch;
  c.speed = cam.speed;
}

function defaultLayoutCamera() {
  return parseEditorState(null).layoutCamera;
}

function mergeLayoutCamerasFromEditor(ed) {
  layoutCamerasByLevel = { ...(ed.layoutCameras || {}) };
  const level =
    ed.activeLevel && LEVEL_NAMES.includes(ed.activeLevel) ? ed.activeLevel : doc.activeLevel;
  if (ed.layoutCamera && !layoutCamerasByLevel[level]) {
    layoutCamerasByLevel[level] = { ...ed.layoutCamera };
  }
}

function restoreLayoutCameraForLevel(level) {
  applyLayoutCamera(layoutCamerasByLevel[level] || defaultLayoutCamera());
}

function collectEditorState() {
  layoutCamerasByLevel[doc.activeLevel] = snapshotLayoutCamera();
  const cam = layoutCamerasByLevel[doc.activeLevel];
  const orb = animView.orbit;
  const iorb = itemView.orbit;
  const enemy = doc.enemies[enemyIndex];
  return parseEditorState({
    mode: editorMode,
    localDraw,
    neighbourDraw,
    selectedIds: [...selectedIds],
    enemy: enemy?.name || "Grunt",
    frameIndex,
    clipIndex,
    frameLocal,
    selectedVerts: [...selectedVerts],
    layoutCamera: { ...cam },
    layoutCameras: { ...layoutCamerasByLevel },
    animOrbit: { yaw: orb.yaw, pitch: orb.pitch, dist: orb.dist },
    mdlScale,
    weapon: weaponKey,
    weaponFrame,
    overlayOn,
    orthoMode: overheadView.mode,
    collapsedRooms: [...collapsedRooms],
    activeLevel: doc.activeLevel,
    item: itemMeshKey,
    itemOrbit: {
      yaw: iorb.yaw,
      pitch: iorb.pitch,
      dist: iorb.dist,
      target: { x: iorb.target.x, y: iorb.target.y, z: iorb.target.z },
    },
  });
}

function persistEditorSettings() {
  if (!editorSettingsReady) return;
  if (editorSaveRaf) {
    cancelAnimationFrame(editorSaveRaf);
    editorSaveRaf = 0;
  }
  saveEditorSettings(docFileName(), collectEditorState());
}

function schedulePersistEditor() {
  if (!editorSettingsReady || applyingEditor) return;
  if (editorSaveRaf) return;
  editorSaveRaf = requestAnimationFrame(() => {
    editorSaveRaf = 0;
    persistEditorSettings();
  });
}

function applyEditorState(ed) {
  ed = parseEditorState(ed);
  applyingEditor = true;
  try {
    mergeLayoutCamerasFromEditor(ed);
    if (ed.activeLevel && LEVEL_NAMES.includes(ed.activeLevel)) doc.activeLevel = ed.activeLevel;
    restoreLayoutCameraForLevel(doc.activeLevel);
    const orb = animView.orbit;
    orb.yaw = ed.animOrbit.yaw;
    orb.pitch = ed.animOrbit.pitch;
    orb.dist = ed.animOrbit.dist;
    const ei = doc.enemies.findIndex((e) => e.name === ed.enemy);
    enemyIndex = ei >= 0 ? ei : 0;
    frameIndex = ed.frameIndex;
    clampFrameIndex(activeEnemy());
    syncClipFromFrameIndex(activeEnemy());
    const have = new Set(activeMap(doc).objects.map((o) => o.id));
    selectedIds = ed.selectedIds.filter((id) => have.has(id));
    rememberSelectedRoom();
    selectedVerts = [...ed.selectedVerts];
    setMdlScale(ed.mdlScale);
    weaponKey = WEAPON_KEYS.includes(ed.weapon) ? ed.weapon : "axe";
    weaponFrame = Math.max(0, ed.weaponFrame | 0);
    setOverlayOn(ed.overlayOn);
    setOrthoMode(ed.orthoMode);
    collapsedRooms.clear();
    for (const id of ed.collapsedRooms) collapsedRooms.add(id);
    itemMeshKey = ALL_MESH_KEYS.includes(ed.item) ? ed.item : "backpack";
    const iorb = itemView.orbit;
    iorb.yaw = ed.itemOrbit.yaw;
    iorb.pitch = ed.itemOrbit.pitch;
    iorb.dist = ed.itemOrbit.dist;
    iorb.target.x = ed.itemOrbit.target.x;
    iorb.target.y = ed.itemOrbit.target.y;
    iorb.target.z = ed.itemOrbit.target.z;
    setNeighbourDraw(ed.neighbourDraw, false);
    setDrawMode(ed.localDraw);
    setMode(ed.mode);
  } finally {
    applyingEditor = false;
  }
}

async function saveNow(okMsg = "Saved") {
  if (saving) return;
  saving = true;
  try {
    persistEditorSettings();
    const payload = gameDocument(doc);
    const how = hasDocFileHandle()
      ? await autosaveDocJSON(payload)
      : await saveDocJSON(payload, DEFAULT_DOC_PATH);
    if (!how) {
      setStatus("Save cancelled", true);
      return;
    }
    markClean();
    persistMdlRigBackup();
    setStatus(`${okMsg} ${docFileName()}`);
  } catch (err) {
    setStatus(String(err.message || err), true);
    scheduleAutosave();
  } finally {
    saving = false;
  }
}

function snapshot() {
  return JSON.stringify({
    version: doc.version,
    activeLevel: doc.activeLevel,
    maps: doc.maps,
    enemies: doc.enemies,
    weapons: doc.weapons,
    items: doc.items,
  });
}

function beginUndo() {
  if (undoGesture) return;
  undoStack.push(snapshot());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  undoGesture = true;
  updateUndoButtons();
}

function endUndo() {
  undoGesture = false;
}

function pushUndo() {
  beginUndo();
  endUndo();
}

function restore(json) {
  doc = normalizeDocument(JSON.parse(json));
  const have = new Set(activeMap(doc).objects.map((o) => o.id));
  selectedIds = selectedIds.filter((id) => have.has(id));
  selectedVerts = selectedVerts.filter((i) => i >= 0 && i < 13);
  if (enemyIndex >= doc.enemies.length) enemyIndex = 0;
  clampFrameIndex(activeEnemy());
  syncClipFromFrameIndex(activeEnemy());
  clampWeaponPreviewFrame();
  markDirty();
  refreshAll();
}

function clearUndoHistory() {
  undoStack.length = 0;
  redoStack.length = 0;
  undoGesture = false;
  updateUndoButtons();
}

function undo() {
  if (!undoStack.length) return;
  endUndo();
  redoStack.push(snapshot());
  restore(undoStack.pop());
  updateUndoButtons();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
  updateUndoButtons();
}

function updateUndoButtons() {
  btnUndo.disabled = undoStack.length === 0;
  btnRedo.disabled = redoStack.length === 0;
}

function activeEnemy() {
  return doc.enemies[enemyIndex];
}

function stickClipFor(e, clip) {
  if (!clip || !e?.clips?.length) return null;
  return e.clips.find((c) => c.name === clip.name) || null;
}

function exportClipNames(e, mdl) {
  const mdlNames = new Set((mdl?.clips || []).map((c) => c.name));
  if (Array.isArray(e?.exportClips)) {
    return e.exportClips.filter((n) => !mdlNames.size || mdlNames.has(n));
  }
  if (e?.clips?.length) {
    return e.clips.map((c) => c.name).filter((n) => !mdlNames.size || mdlNames.has(n));
  }
  return filterMdlClips(mdl?.clips).map((c) => c.name);
}

function formatPackedPoseMem(packed) {
  const { bytes, nLogical, nStored } = packed;
  const size =
    bytes >= 1024
      ? `${bytes / 1024 < 10 ? (bytes / 1024).toFixed(1) : Math.round(bytes / 1024)} KB`
      : `${bytes} bytes`;
  const over =
    bytes > ENEMY_POSE_MAX ? ` OVER ${bytes - ENEMY_POSE_MAX}` : "";
  return `≈ ${size} in-game (${nStored} stored / ${nLogical} logical)${over}`;
}

function getTimeline(e) {
  const mdl = sharewareModels[e?.name];
  if (mdl?.clips?.length) {
    const byName = new Map((e.clips || []).map((c) => [c.name, c]));
    return mdl.clips.map((c) => {
      const stick = byName.get(c.name);
      return {
        name: c.name,
        len: c.frames.length,
        start: stick ? stick.start : 0,
        frameNames: c.frames.map((fr) => fr.name),
        mdlFrames: c.frames,
        hasStick: !!stick,
      };
    });
  }
  if (e?.clips?.length) {
    return e.clips.map((c) => ({
      name: c.name,
      len: c.len,
      start: c.start,
      frameNames: [],
      mdlFrames: [],
      hasStick: true,
    }));
  }
  return [];
}

function clampFrameIndex(e) {
  if (!e?.frames?.length) {
    frameIndex = 0;
    return;
  }
  if (e.clips?.length) {
    frameIndex = Math.max(0, Math.min(frameIndex, e.frames.length - 1));
  }
}

function syncClipFromFrameIndex(e) {
  const timeline = getTimeline(e);
  if (!timeline.length) {
    clipIndex = 0;
    frameLocal = 0;
    return;
  }
  const mdl = sharewareModels[e?.name];
  if (e?.clips?.length) {
    const stick = clipForFrame(e.clips, frameIndex);
    if (stick) {
      const idx = timeline.findIndex((c) => c.name === stick.name);
      if (idx >= 0) {
        clipIndex = idx;
        frameLocal = frameIndex - stick.start;
        return;
      }
      if (!mdl) {
        clipIndex = Math.max(0, e.clips.indexOf(stick));
        frameLocal = frameIndex - stick.start;
        return;
      }
    }
  }
  if (clipIndex >= timeline.length) clipIndex = 0;
  const clip = timeline[clipIndex];
  frameLocal = Math.max(0, Math.min(frameLocal, clip.len - 1));
}

function frameLabel(e, fi) {
  if (!e?.clips?.length) return "rest";
  const clip = clipForFrame(e.clips, fi);
  if (!clip) return `frame ${fi}`;
  return `${clip.name} ${fi - clip.start}`;
}

function activeTimelineClip() {
  const timeline = getTimeline(activeEnemy());
  if (!timeline.length) return null;
  if (clipIndex >= timeline.length) clipIndex = 0;
  return timeline[clipIndex];
}

function canvasClientToScreen(e) {
  const canvas = document.getElementById("view-canvas");
  const rect = canvas.getBoundingClientRect();
  const over =
    e.clientX >= rect.left &&
    e.clientX <= rect.right &&
    e.clientY >= rect.top &&
    e.clientY <= rect.bottom;
  return {
    over,
    mx: ((e.clientX - rect.left) / rect.width) * layoutView.cssW,
    my: ((e.clientY - rect.top) / rect.height) * layoutView.cssH,
  };
}

/** Owner room for palette drop: doorway → selected/last; else ray-hit room, miss → selected/last. */
function placeOwner(kind, hitRoom) {
  if (kind === "room") return null;
  if (kind === "doorway") return placementRoom();
  return hitRoom || placementRoom();
}

function previewObjectAtScreen(place, mx, my) {
  const kind = place.kind;
  const p = layoutView.placeAtScreen(mx, my, kind);
  const owner = placeOwner(kind, p.room);
  const extra = place.enemy ? { enemy: place.enemy } : {};
  if (owner) extra.roomId = owner.id;
  if (kind === "spawn") {
    extra.enabled = !activeMap(doc).objects.some((o) => o.kind === "spawn");
  }
  const obj = createObject(kind, p.x, p.y, p.z, extra);
  if (owner && kind !== "room" && kind !== "doorway") {
    obj.y = roomFloorY(owner, obj.x + obj.sx / 2, obj.z + obj.sz / 2);
  }
  clampObject(obj);
  return obj;
}

function clearPaletteDrag() {
  document.body.classList.remove("palette-dragging");
  layoutView.clearPlacePreview();
  pendingPlace = null;
  if (editorMode === "layout") layoutView.draw();
}

function updatePaletteDrag(e) {
  if (!pendingPlace || pendingPlace.pointerId !== e.pointerId || editorMode !== "layout") return;
  const { over, mx, my } = canvasClientToScreen(e);
  if (over) layoutView.setPlacePreview(previewObjectAtScreen(pendingPlace, mx, my), true);
  else layoutView.setPlacePreview(null, false);
  layoutView.draw();
}

function buildPalette() {
  const root = document.getElementById("item-palette");
  root.innerHTML = "";
  for (const kind of PALETTE_ORDER) {
    root.appendChild(paletteButton(KINDS[kind].label, KINDS[kind].color, { kind }));
  }
  const sep = document.createElement("div");
  sep.className = "palette-sep";
  sep.textContent = "Enemies";
  root.appendChild(sep);
  for (const t of ENEMY_TYPES) {
    root.appendChild(paletteButton(t.name, KINDS.enemy.color, { kind: "enemy", enemy: t.name }));
  }
}

function paletteButton(label, color, payload) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "palette-item";
  el.textContent = label;
  el.style.borderColor = color;
  el.title = "Drag onto the map to place";
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    pendingPlace = { ...payload, pointerId: e.pointerId };
    el.setPointerCapture(e.pointerId);
    document.body.classList.add("palette-dragging");
    setStatus(`Drop ${label} on the map…`);
  });
  el.addEventListener("pointermove", (e) => {
    updatePaletteDrag(e);
  });
  el.addEventListener("pointerup", (e) => {
    if (!pendingPlace || pendingPlace.pointerId !== e.pointerId) return;
    finishPaletteDrop(e);
  });
  el.addEventListener("pointercancel", (e) => {
    if (pendingPlace?.pointerId === e.pointerId) clearPaletteDrag();
  });
  return el;
}

function finishPaletteDrop(e) {
  const place = pendingPlace;
  document.body.classList.remove("palette-dragging");
  layoutView.clearPlacePreview();
  pendingPlace = null;
  if (!place || editorMode !== "layout") return;
  const { over, mx, my } = canvasClientToScreen(e);
  if (!over) {
    layoutView.draw();
    setStatus("Place cancelled", true);
    return;
  }
  const kind = place.kind;
  const p = layoutView.placeAtScreen(mx, my, kind);
  const owner = placeOwner(kind, p.room);
  if (kind === "enemy" && !canAddEnemyType(activeMap(doc), place.enemy, owner?.id)) {
    layoutView.draw();
    setStatus(`Max ${ROOM_MAX_TYPES} enemy types per room`, true);
    return;
  }
  pushUndo();
  const obj = previewObjectAtScreen(place, mx, my);
  activeMap(doc).objects.push(obj);
  if (kind === "doorway") {
    assignDoorRooms(doc, obj, owner);
    clampObject(obj);
  } else if (kind === "switch" && owner) {
    snapSwitchToRoom(obj, owner);
    clampObject(obj);
  }
  if (kind === "room") lastRoomId = obj.id;
  selectedIds = [obj.id];
  rememberSelectedRoom();
  markDirty();
  refreshAll();
  setStatus(place.enemy ? `Placed ${place.enemy}` : `Placed ${KINDS[kind].label}`);
}

function selectedObject() {
  if (selectedIds.length !== 1) return null;
  return activeMap(doc).objects.find((o) => o.id === selectedIds[0]) || null;
}

function selectedLayoutObjects() {
  const map = activeMap(doc);
  return selectedIds.map((id) => map.objects.find((o) => o.id === id)).filter(Boolean);
}

function unanimous(objs, get) {
  if (!objs.length) return undefined;
  const v0 = get(objs[0]);
  for (let i = 1; i < objs.length; i++) {
    if (get(objs[i]) !== v0) return undefined;
  }
  return v0;
}

function rememberSelectedRoom() {
  for (let i = selectedIds.length - 1; i >= 0; i--) {
    const obj = activeMap(doc).objects.find((o) => o.id === selectedIds[i]);
    if (!obj) continue;
    if (obj.kind === "room") {
      lastRoomId = obj.id;
      break;
    }
    if (obj.roomId) {
      lastRoomId = obj.roomId;
      break;
    }
  }
  if (localDraw && !applyingEditor) {
    const msg = drawModeStatus();
    setStatus(msg, msg.startsWith("Local: no"));
  }
}

function placementRoom() {
  const obj = selectedObject();
  if (obj?.kind === "room") return obj;
  if (obj?.roomId) {
    const r = roomById(doc, obj.roomId);
    if (r) return r;
  }
  return roomById(doc, lastRoomId);
}

function deleteSelected() {
  if (editorMode === "layout") {
    if (!selectedIds.length) return;
    pushUndo();
    const drop = new Set(selectedIds);
    for (const o of activeMap(doc).objects) {
      if (o.kind === "room") continue;
      if (o.roomId && drop.has(o.roomId)) o.roomId = null;
      if (o.otherRoomId && drop.has(o.otherRoomId)) o.otherRoomId = null;
    }
    activeMap(doc).objects = activeMap(doc).objects.filter((o) => !drop.has(o.id));
    ensureSpawnExclusive(activeMap(doc).objects);
    selectedIds = [];
    markDirty();
    refreshAll();
    return;
  }
}

function duplicateSelected() {
  if (!selectedIds.length || editorMode !== "layout") return;
  pushUndo();
  const created = [];
  let skipped = 0;
  for (const id of selectedIds) {
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (!obj) continue;
    if (obj.kind === "enemy" && !canAddEnemyType(activeMap(doc), obj.enemy, obj.roomId)) {
      skipped++;
      continue;
    }
    const copy = clampObject({
      ...obj,
      id: uid(),
      x: obj.x + 2,
      z: obj.z + 2,
    });
    if (copy.kind === "spawn") copy.enabled = false;
    activeMap(doc).objects.push(copy);
    created.push(copy.id);
  }
  if (!created.length) {
    endUndo();
    undoStack.pop();
    updateUndoButtons();
    setStatus(
      skipped ? `Max ${ROOM_MAX_TYPES} enemy types per room` : "Nothing to duplicate",
      true
    );
    return;
  }
  selectedIds = created;
  markDirty();
  refreshAll();
  setStatus(skipped ? `Duplicated ${created.length} (${skipped} skipped)` : `Duplicated ${created.length}`);
}

function dropSelectedToFloor() {
  if (!selectedIds.length || editorMode !== "layout") return;
  pushUndo();
  let n = 0;
  for (const id of selectedIds) {
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (!obj || obj.kind === "room" || obj.kind === "doorway") continue;
    const room = roomUnderObject(doc, obj);
    obj.y = room ? roomFloorY(room, obj.x + obj.sx / 2, obj.z + obj.sz / 2) : 0;
    clampObject(obj);
    n++;
  }
  if (!n) {
    endUndo();
    undoStack.pop();
    updateUndoButtons();
    setStatus("Nothing to drop", true);
    return;
  }
  markDirty();
  refreshAll();
  setStatus(`Dropped ${n} to floor`);
}

function switchLevel(name) {
  if (!LEVEL_NAMES.includes(name) || name === doc.activeLevel) return;
  layoutCamerasByLevel[doc.activeLevel] = snapshotLayoutCamera();
  doc.activeLevel = name;
  restoreLayoutCameraForLevel(name);
  selectedIds = [];
  lastRoomId = null;
  collapsedRooms.clear();
  markDirty();
  markUi();
  refreshAll();
  setStatus(name);
}

function updateCenterChrome() {
  const titleEl = document.getElementById("center-title");
  const statsEl = document.getElementById("map-stats");
  if (editorMode === "layout") {
    const map = activeMap(doc);
    titleEl.textContent = map.name
      ? `Map ${doc.activeLevel} — ${map.name}`
      : `Map ${doc.activeLevel}`;
    if (statsEl) {
      const stats = mapStats(doc);
      statsEl.hidden = false;
      statsEl.textContent = formatMapStats(stats);
      statsEl.title = formatMapLoadTitle(stats);
      statsEl.classList.toggle("error", !!stats.overBudget);
    }
    return;
  }
  titleEl.textContent =
    editorMode === "weapons"
      ? WEAPON_LABELS[weaponKey] || "Weapons"
      : editorMode === "items"
        ? itemMeshKey === "backpack"
          ? "Backpack"
          : itemMeshKey
        : "Enemy";
  if (statsEl) {
    statsEl.hidden = true;
    statsEl.textContent = "";
    statsEl.title = "";
    statsEl.classList.remove("error");
  }
}

function renderLevelList() {
  const root = document.getElementById("level-list");
  if (!root) return;
  root.classList.add("level-list");
  root.innerHTML = "";
  const title = document.createElement("h2");
  title.textContent = "Levels";
  root.appendChild(title);
  const ul = document.createElement("ul");
  for (const name of LEVEL_NAMES) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    const map = doc.maps[name];
    const display = clampName(map?.name);
    btn.textContent = name;

function selectObjectIds(ids, additive) {
  if (additive) {
    for (const id of ids) {
      const i = selectedIds.indexOf(id);
      if (i >= 0) selectedIds.splice(i, 1);
      else selectedIds.push(id);
    }
  } else selectedIds = [...ids];
  rememberSelectedRoom();
  markDirty();
  refreshPanels();
}

function makeObjectListButton(obj) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = objectLabel(obj);
  btn.classList.add(obj.kind === "room" ? "tree-label-wrap" : "tree-label-elide");
  if (selectedIds.includes(obj.id)) btn.classList.add("active");
  btn.addEventListener("click", (e) => {
    selectObjectIds([obj.id], e.shiftKey);
  });
  return btn;
}

function renderObjectList() {
  const ul = document.getElementById("object-list");
  ul.innerHTML = "";
  ul.classList.add("object-tree");
  const { nodes, orphans } = objectTree(doc);

  for (const { room, children } of nodes) {
    const li = document.createElement("li");
    li.className = "tree-room";
    const row = document.createElement("div");
    row.className = "tree-row";
    const twist = document.createElement("button");
    twist.type = "button";
    twist.className = "tree-twist";
    const collapsed = collapsedRooms.has(room.id);
    twist.textContent = collapsed ? "▸" : "▾";
    twist.title = collapsed ? "Expand" : "Collapse";
    twist.addEventListener("click", (e) => {
      e.stopPropagation();
      if (collapsedRooms.has(room.id)) collapsedRooms.delete(room.id);
      else collapsedRooms.add(room.id);
      markUi();
      renderObjectList();
    });
    const roomBtn = makeObjectListButton(room);
    roomBtn.classList.add("tree-room-btn");
    row.append(twist, roomBtn);
    li.appendChild(row);
    if (!collapsed) {
      const childUl = document.createElement("ul");
      childUl.className = "tree-children";
      if (!children.length) {
        const empty = document.createElement("li");
        empty.className = "tree-empty";
        empty.textContent = "(empty)";
        childUl.appendChild(empty);
      } else {
        for (const obj of children) {
          const cli = document.createElement("li");
          cli.appendChild(makeObjectListButton(obj));
          childUl.appendChild(cli);
        }
      }
      li.appendChild(childUl);
    }
    ul.appendChild(li);
  }

  if (orphans.length) {
    const li = document.createElement("li");
    li.className = "tree-orphans";
    const label = document.createElement("div");
    label.className = "tree-orphan-label";
    label.textContent = "Outside rooms";
    li.appendChild(label);
    const childUl = document.createElement("ul");
    childUl.className = "tree-children";
    for (const obj of orphans) {
      const cli = document.createElement("li");
      cli.appendChild(makeObjectListButton(obj));
      childUl.appendChild(cli);
    }
    li.appendChild(childUl);
    ul.appendChild(li);
  }
}

function renderEnemyList() {
  const ul = document.getElementById("enemy-list");

function clampWeaponPreviewFrame() {
  const mdl = sharewareWeapons[weaponKey];
  const selected = selectedWeaponFrames();

    weaponFrame = Math.max(0, Math.min(weaponFrame, mdl.frames.length - 1));
