  const spanY = Math.max(1, aabb.maxY - aabb.minY);
  let s = Math.min(scale, maxDim / spanX, maxDim / spanY);
  if (!(s > 0)) s = 1;
  const bw = Math.max(1, Math.ceil(spanX * s));
  const bh = Math.max(1, Math.ceil(spanY * s));
  const zbuf = new Float32Array(bw * bh);
  zbuf.fill(1e12);
  const triId = new Uint16Array(bw * bh);
  triId.fill(TRI_ID_EMPTY);
  for (const ft of frontTris) {
    fillTriZ(
      zbuf,
      triId,
      ft.ti,
      0,
      0,
      bw,
      bh,
      scaledVert(ft.a, aabb.minX, aabb.minY, s),
      scaledVert(ft.b, aabb.minX, aabb.minY, s),
      scaledVert(ft.c, aabb.minX, aabb.minY, s)
    );
  }
  return { zbuf, triId, minX: 0, minY: 0, bw, bh, originX: aabb.minX, originY: aabb.minY, scale: s };
}

function spriteVert(p, scale, pan) {
  const s = toSpritePos(p.sx, p.sy, scale, pan);
  return { x: s.x, y: s.y, z: p.cz, iz: 1 / p.cz };
}

function faceToward(proj, tri) {
  return viewFaceTowardCamera(proj[tri[0]], proj[tri[1]], proj[tri[2]]);
}

function trisSharingEdge(tris, proj, ia, ib) {
  const adj = new Set();
  for (let ti = 0; ti < tris.length; ti++) {
    const t = tris[ti];
    if (t[0] !== ia && t[1] !== ia && t[2] !== ia) continue;
    if (t[0] !== ib && t[1] !== ib && t[2] !== ib) continue;
    if (!faceToward(proj, t)) continue;
    adj.add(ti);
  }
  return adj;
}

function fillTriZ(zbuf, triId, ti, ox, oy, bw, bh, a, b, c) {
  const minX = Math.max(0, Math.floor(Math.min(a.x, b.x, c.x) - ox));
  const maxX = Math.min(bw - 1, Math.ceil(Math.max(a.x, b.x, c.x) - ox));
  const minY = Math.max(0, Math.floor(Math.min(a.y, b.y, c.y) - oy));
  const maxY = Math.min(bh - 1, Math.ceil(Math.max(a.y, b.y, c.y) - oy));
  if (minX > maxX || minY > maxY) return;
  const denom = (b.y - c.y) * (a.x - c.x) + (c.x - b.x) * (a.y - c.y);
  if (Math.abs(denom) < 1e-8) return;
  const inv = 1 / denom;
  for (let y = minY; y <= maxY; y++) {
    const py = y + oy + 0.5;
    for (let x = minX; x <= maxX; x++) {
      const px = x + ox + 0.5;
      const w0 = ((b.y - c.y) * (px - c.x) + (c.x - b.x) * (py - c.y)) * inv;
      const w1 = ((c.y - a.y) * (px - c.x) + (a.x - c.x) * (py - c.y)) * inv;
      const w2 = 1 - w0 - w1;
      if (w0 < -1e-4 || w1 < -1e-4 || w2 < -1e-4) continue;
      const iz = w0 * a.iz + w1 * b.iz + w2 * c.iz;
      if (iz <= 0) continue;
      const z = 1 / iz;
      const i = y * bw + x;
      if (z < zbuf[i]) {
        zbuf[i] = z;
        triId[i] = ti;
      }
    }
  }
}

function segmentT(a, b, px, py) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  if (len2 < 1e-12) return 0;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
  if (t < 0) return 0;
  if (t > 1) return 1;
  return t;
}

function lerpDepth(a, b, t) {
  const iz = a.iz * (1 - t) + b.iz * t;
  return iz > 0 ? 1 / iz : 1e9;
}

function edgePixelVisible(zctx, x, y, a, b, adj) {
  const bx = Math.floor(x - zctx.minX);
  const by = Math.floor(y - zctx.minY);
  if (bx < 0 || by < 0 || bx >= zctx.bw || by >= zctx.bh) return false;
  const i = by * zctx.bw + bx;
  const owner = zctx.triId[i];
  if (owner === TRI_ID_EMPTY) return true;
  if (adj.has(owner)) return true;
  const cx = bx + zctx.minX + 0.5;
  const cy = by + zctx.minY + 0.5;
  const z = lerpDepth(a, b, segmentT(a, b, cx, cy));
  return z <= zctx.zbuf[i] * Z_EDGE_SLACK;
}

function toZspace(p, zctx) {
  return scaledVert(p, zctx.originX, zctx.originY, zctx.scale);
}

function fromZspace(x, y, zctx) {
  return {
    x: x / zctx.scale + zctx.originX,
    y: y / zctx.scale + zctx.originY,
  };
}

/** Visible bits of an edge in projected sprite space (no pixel snapping). */
function edgeRuns(zctx, a, b, adj) {
  const ha = toZspace(a, zctx);
  const hb = toZspace(b, zctx);
  const dist = Math.hypot(hb.x - ha.x, hb.y - ha.y);
  const n = Math.max(2, Math.ceil(dist * 2));
  const runs = [];
  let run = null;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = ha.x + (hb.x - ha.x) * t;
    const y = ha.y + (hb.y - ha.y) * t;
    if (edgePixelVisible(zctx, x, y, ha, hb, adj)) {
      const p = fromZspace(x, y, zctx);
      if (!run) run = { ax: p.x, ay: p.y, bx: p.x, by: p.y };
      else {
        run.bx = p.x;
        run.by = p.y;
      }
    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs;
}

function leftToRight(a, b) {
  if (a.x < b.x || (a.x === b.x && a.y <= b.y)) return [a, b];
  return [b, a];
}

function plotSpritePixel(pixels, x, y, zctx, adj, za, zb) {
  if (x < 0 || y < 0 || x >= WEAPON_SPRITE_W || y >= WEAPON_SPRITE_H) return;
  if (zctx) {
    const p = toZspace({ x: x + 0.5, y: y + 0.5, iz: 0 }, zctx);
    if (!edgePixelVisible(zctx, p.x, p.y, za, zb, adj)) return;
  }
  pixels[y * WEAPON_SPRITE_W + x] = 1;
}

/** Thin 8-connected Bresenham: one pixel per major-axis step, no corner elbows. */
function plotSpriteLine(pixels, a, b, zctx, adj) {
  [a, b] = leftToRight(a, b);
  const za = zctx ? toZspace(a, zctx) : null;
  const zb = zctx ? toZspace(b, zctx) : null;
  let x = Math.round(a.x);
  let y = Math.round(a.y);
  const xEnd = Math.round(b.x);
  const yEnd = Math.round(b.y);
  const dx = Math.abs(xEnd - x);
  const dy = Math.abs(yEnd - y);
  const sx = x < xEnd ? 1 : -1;
  const sy = y < yEnd ? 1 : -1;
  if (dx >= dy) {
    let err = 2 * dy - dx;
    for (;;) {
      plotSpritePixel(pixels, x, y, zctx, adj, za, zb);
      if (x === xEnd) break;
      if (err >= 0) {
        y += sy;
        err -= 2 * dx;
      }
      err += 2 * dy;
      x += sx;
    }
  } else {
    let err = 2 * dx - dy;
    for (;;) {
      plotSpritePixel(pixels, x, y, zctx, adj, za, zb);
      if (y === yEnd) break;
      if (err >= 0) {
        x += sx;
        err -= 2 * dy;
      }
      err += 2 * dx;
      y += sy;
    }
  }
}

function visibleWeaponMesh(mdl, frameIndex, scale, pan) {
  const verts = mdlQuakeVerts(mdl, frameIndex);
  const proj = verts.map(projectViewVert);
  const quads = mdlEnsureQuads(mdl);
  const pts = [];
  const frontTris = [];
  const frontEdges = [];
  const seenEdge = new Set();
  let clipped = false;

  for (let ti = 0; ti < mdl.tris.length; ti++) {
    const t = mdl.tris[ti];
    if (!faceToward(proj, t)) continue;
    const a = proj[t[0]];
    const b = proj[t[1]];
    const c = proj[t[2]];
    if (!a.ok || !b.ok || !c.ok) continue;
    const pa = spriteVert(a, scale, pan);
    const pb = spriteVert(b, scale, pan);
    const pc = spriteVert(c, scale, pan);
    frontTris.push({ a: pa, b: pb, c: pc, ti });
    pts.push(pa, pb, pc);
  }

  for (const q of quads) {
    const tris = q.tris || [q.tri];
    if (!tris.some((t) => faceToward(proj, t))) continue;
    for (const [ia, ib] of q.edges) {
      const a = proj[ia];
      const b = proj[ib];
      if (!a?.ok || !b?.ok) {
        clipped = true;
        continue;
      }
      const k = edgeKey(ia, ib);
      if (seenEdge.has(k)) continue;
      seenEdge.add(k);
      const pa = spriteVert(a, scale, pan);
      const pb = spriteVert(b, scale, pan);
      const adj = trisSharingEdge(mdl.tris, proj, ia, ib);
      const [la, lb] = leftToRight(pa, pb);
      frontEdges.push({ a: la, b: lb, adj });
      pts.push(pa, pb);
      if (
        pa.x < 0 ||
        pa.y < 0 ||
        pa.x >= WEAPON_SPRITE_W ||
        pa.y >= WEAPON_SPRITE_H ||
        pb.x < 0 ||
        pb.y < 0 ||
        pb.x >= WEAPON_SPRITE_W ||
        pb.y >= WEAPON_SPRITE_H
      ) {
        clipped = true;
      }
    }
  }

  const segs = [];
  const pixels = new Uint8Array(WEAPON_SPRITE_W * WEAPON_SPRITE_H);
  const viewAabb = spriteAabb(pts);
  const zView = makeZctx(frontTris, viewAabb, VIEW_Z_SCALE, VIEW_ZBUF_MAX);
  const zBake = makeZctx(frontTris, { minX: 0, minY: 0, maxX: WEAPON_SPRITE_W, maxY: WEAPON_SPRITE_H }, 1, ZBUF_MAX);
  for (const e of frontEdges) {
    for (const run of edgeRuns(zView, e.a, e.b, e.adj)) segs.push(run);
  }
  for (const e of frontEdges) plotSpriteLine(pixels, e.a, e.b, zBake, e.adj);

  return { segs, pixels, clipped };
}

function projectedWeaponEdges(mdl, frameIndex, scale, pan) {
  const { segs, clipped } = visibleWeaponMesh(mdl, frameIndex, scale, pan);
  return { segs, clipped };
}

function rasterWeaponFrame(mdl, frameIndex, scale, pan) {
  return visibleWeaponMesh(mdl, frameIndex, scale, pan);
}

// ---- js/layoutView.js ----
const HANDLE = 7;
const LINE_HIT = 8;
const LAYOUT_BOX_CLICK = 4;
const ZOOM_K = 0.008;

class LayoutView {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {object} opts
   */
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.camera = {
      x: 28,
      y: 10,
      z: -6,
      yaw: 0.35,
      pitch: -0.2,
      speed: 28,
    };
    this.keys = new Set();
    this.look = false;
    this.orbit = null;
    this.zoom = null;
    this.lastT = 0;
    this.hoverId = null;
    this.drag = null;
    this.gridY = 0;
    this.enabled = true;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("mousedown", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    canvas.addEventListener("auxclick", (e) => {
      if (e.button === 1) e.preventDefault();
    });
    window.addEventListener("keydown", (e) => this.#onKey(e, true));
    window.addEventListener("keyup", (e) => this.#onKey(e, false));

    this._raf = (t) => {
      if (this.enabled) this.#tick(t);
      else this.lastT = t;
      requestAnimationFrame(this._raf);
    };
    requestAnimationFrame(this._raf);
  }

  resize() {
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  #focused() {
    return document.activeElement === this.canvas;
  }

  #onKey(e, down) {
    if (!this.enabled) return;
    if (!this.#focused() && down) return;
    const k = e.key.toLowerCase();
    if ("wasdqe".includes(k) || k === "shift") {
      if (down) this.keys.add(k);
      else this.keys.delete(k);
      if (down) e.preventDefault();
    }
  }

  #tick(t) {
    const dt = this.lastT ? Math.min(0.05, (t - this.lastT) / 1000) : 0;
    this.lastT = t;
    let moved = false;
    if (this.#focused()) {
      const { forward, right, up } = lookVectors(this.camera.yaw, this.camera.pitch);
      const boost = this.keys.has("shift") ? 3 : 1;
      const sp = this.camera.speed * boost * dt;
      if (this.keys.has("w")) {
        this.camera.x += forward.x * sp;
        this.camera.y += forward.y * sp;
        this.camera.z += forward.z * sp;
        moved = true;
      }
      if (this.keys.has("s")) {
        this.camera.x -= forward.x * sp;
        this.camera.y -= forward.y * sp;
        this.camera.z -= forward.z * sp;
        moved = true;
      }
      if (this.keys.has("d")) {
        this.camera.x += right.x * sp;
        this.camera.y += right.y * sp;
        this.camera.z += right.z * sp;
        moved = true;
      }
      if (this.keys.has("a")) {
        this.camera.x -= right.x * sp;
        this.camera.y -= right.y * sp;
        this.camera.z -= right.z * sp;
        moved = true;
      }
      if (this.keys.has("e")) {
        this.camera.x += up.x * sp;
        this.camera.y += up.y * sp;
        this.camera.z += up.z * sp;
        moved = true;
      }
      if (this.keys.has("q")) {
        this.camera.x -= up.x * sp;
        this.camera.y -= up.y * sp;
        this.camera.z -= up.z * sp;
        moved = true;
      }
    }
    if (moved) this.opts.onViewChanged?.();
    this.draw();
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #selectedIds() {
    return this.opts.getSelectedIds?.() || [];
  }

  #primaryId() {
    const ids = this.#selectedIds();
    return ids.length ? ids[ids.length - 1] : null;
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.canvas.focus();
    const { forward } = lookVectors(this.camera.yaw, this.camera.pitch);
    const notches = e.deltaY / 100;
    const dist = -notches * this.camera.speed * 0.35;
    this.camera.x += forward.x * dist;
    this.camera.y += forward.y * dist;
    this.camera.z += forward.z * dist;
    this.opts.onViewChanged?.();
    this.draw();
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    if (e.button === 1) {
      this.orbit = this.#beginOrbit(p);
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 2) {
      if (e.altKey) {
        this.zoom = this.#beginOrbit(p);
        this.canvas.setPointerCapture(e.pointerId);
        return;
      }
      this.look = true;
      this.lookLast = p;
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;

    const doc = this.opts.getDoc();
    const primary = this.#primaryId();
    const hitHandle = primary ? this.#hitHandle(doc, primary, p.x, p.y) : null;
    if (hitHandle) {
      this.opts.beginUndo?.();
      const ids = this.#selectedIds().length ? this.#selectedIds() : [primary];
      this.drag = this.#makeTransformDrag(doc, ids, hitHandle, p);
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const hit = this.#pick(doc, p.x, p.y);
    if (hit) {
      const ids = this.#selectedIds();
      if (e.shiftKey) {
        this.opts.onToggleSelect?.(hit.id);
        this.canvas.setPointerCapture(e.pointerId);
        this.drag = { kind: "select" };
        return;
      }
      if (!ids.includes(hit.id)) {
        this.opts.onSelectIds?.([hit.id]);
      }
      const moveIds = ids.includes(hit.id) ? ids : [hit.id];
      this.opts.beginUndo?.();
      this.drag = this.#makeTransformDrag(
        doc,
        moveIds,
        { kind: "move", world: hit.point },
        p
      );
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #makeTransformDrag(doc, ids, handle, p) {
    const objs = activeMap(doc).objects;
    const origs = ids
      .map((id) => objs.find((o) => o.id === id))
      .filter(Boolean)
      .map((o) => ({ ...o }));
    const contents = [];
    const claimed = new Set(ids);
    for (const o of origs) {
      if (o.kind !== "room") continue;
      for (const other of objs) {
        if (other.kind === "room" || claimed.has(other.id)) continue;
        if (!aabbOverlap(o, other)) continue;
        claimed.add(other.id);
        contents.push({ ...other });
      }
    }
    return {
      kind: handle.kind,
      axis: handle.axis,
      corner: handle.corner,
      start: p,
      origs,
      contents,
      grab: handle.world,
      planeN: lookVectors(this.camera.yaw, this.camera.pitch).forward,
      primaryId: ids[ids.length - 1],
    };
  }

  #beginOrbit(p) {
    const cam = this.camera;
    const doc = this.opts.getDoc();
    const id = this.#primaryId();
    const obj = id ? activeMap(doc).objects.find((o) => o.id === id) : null;
    let dist = 16;
    if (obj) {
      const c = aabbCenter(obj);
      dist = Math.hypot(c.x - cam.x, c.y - cam.y, c.z - cam.z);
      if (dist < 1) dist = 1;
    }
    return { last: p, dist };
  }

  #applyOrbit(p) {
    const o = this.orbit;
    const cam = this.camera;
    const dx = p.x - o.last.x;
    const dy = p.y - o.last.y;
    o.last = p;
    if (!dx && !dy) return;

    const dist = o.dist;
    const { forward } = lookVectors(cam.yaw, cam.pitch);
    const px = cam.x + forward.x * dist;
    const py = cam.y + forward.y * dist;
    const pz = cam.z + forward.z * dist;
    cam.yaw += dx * 0.008;
    cam.pitch = Math.max(-1.4, Math.min(1.4, cam.pitch - dy * 0.008));
    const f2 = lookVectors(cam.yaw, cam.pitch).forward;
    cam.x = px - f2.x * dist;
    cam.y = py - f2.y * dist;
    cam.z = pz - f2.z * dist;
  }

  #applyZoom(p) {
    const z = this.zoom;
    const dx = p.x - z.last.x;
    const dy = p.y - z.last.y;
    z.last = p;
    const delta = dx + dy;
    if (!delta) return;

    const cam = this.camera;
    const { forward } = lookVectors(cam.yaw, cam.pitch);
    const px = cam.x + forward.x * z.dist;
    const py = cam.y + forward.y * z.dist;
    const pz = cam.z + forward.z * z.dist;
    z.dist = Math.max(1, z.dist * Math.exp(-delta * ZOOM_K));
    cam.x = px - forward.x * z.dist;
    cam.y = py - forward.y * z.dist;
    cam.z = pz - forward.z * z.dist;
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    if (this.orbit) {
      this.#applyOrbit(p);
      return;
    }
    if (this.zoom) {
      this.#applyZoom(p);
      return;
    }
    if (this.look) {
      const dx = p.x - this.lookLast.x;
      const dy = p.y - this.lookLast.y;
      this.lookLast = p;
      this.camera.yaw += dx * 0.008;
      this.camera.pitch = Math.max(-1.4, Math.min(1.4, this.camera.pitch - dy * 0.008));
      return;
    }
    if (this.drag?.kind === "box") {
      this.drag.end = p;
      this.draw();
      return;
    }
    if (this.drag) {
      this.#applyDrag(p);
      this.opts.onChange?.();
      return;
    }
    const doc = this.opts.getDoc();
    this.hoverId = this.#pick(doc, p.x, p.y)?.id || null;
  }

  #onUp(e) {
    if (!this.enabled) return;
    const viewEnded = this.look || this.orbit || this.zoom;
    if (this.look) this.look = false;
    if (this.orbit) this.orbit = null;
    if (this.zoom) this.zoom = null;
    if (this.drag?.kind === "box") this.#finishBox();
    else if (this.drag && this.drag.kind !== "select") this.opts.endUndo?.();
    this.drag = null;
    if (viewEnded) this.opts.onViewChanged?.();
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    this.draw();
  }

  #boxRect() {
    const a = this.drag.start;
    const b = this.drag.end;
    const x0 = Math.min(a.x, b.x);
    const y0 = Math.min(a.y, b.y);
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  #finishBox() {
    const rect = this.#boxRect();
    const additive = this.drag.additive;
    if (rect.w < LAYOUT_BOX_CLICK && rect.h < LAYOUT_BOX_CLICK) {
      if (!additive) this.opts.onSelectIds?.([]);
      return;
    }
    const doc = this.opts.getDoc();
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    const hits = [];
    for (const obj of this.#visibleObjects(doc)) {
      let inside = false;
      for (let i = 0; i < 8; i++) {
        const pr = projectPoint(cornerWorld(obj, i), cam, w, h);
        if (!pr.ok) continue;
        if (pr.sx >= rect.x0 && pr.sx <= rect.x1 && pr.sy >= rect.y0 && pr.sy <= rect.y1) {
          inside = true;
          break;
        }
      }
      if (!inside) {
        const c = projectPoint(aabbCenter(obj), cam, w, h);
        if (c.ok && c.sx >= rect.x0 && c.sx <= rect.x1 && c.sy >= rect.y0 && c.sy <= rect.y1) {
          inside = true;
        }
      }
      if (inside) hits.push(obj.id);
    }
    this.opts.onSelectIds?.(hits, additive);
  }

  #applyDrag(p) {
    const doc = this.opts.getDoc();
    const objs = activeMap(doc).objects;
    const ray = screenRay(p.x, p.y, this.camera, this.cssW, this.cssH);
    const d = this.drag;

    if (d.kind === "move") {
      const hit = intersectPlane(ray.origin, ray.dir, d.grab, d.planeN);
      if (!hit) return;
      const dx = Math.round(hit.point.x - d.grab.x);
      const dy = Math.round(hit.point.y - d.grab.y);
      const dz = Math.round(hit.point.z - d.grab.z);
      for (const orig of d.origs) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      for (const orig of d.contents) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj.x = orig.x + dx;
        obj.y = orig.y + dy;
        obj.z = orig.z + dz;
        clampObject(obj);
      }
      return;
    }

    if (d.kind === "axis") {
      const axis = d.axis;
      const cam = this.camera;
      const grab = d.grab;
      const along = { x: grab.x, y: grab.y, z: grab.z };
      along[axis] += 8;
      const pa = projectPoint(grab, cam, this.cssW, this.cssH);
      const pb = projectPoint(along, cam, this.cssW, this.cssH);
      if (!pa.ok || !pb.ok) return;
      const ax = pb.sx - pa.sx;
      const ay = pb.sy - pa.sy;
      const alen2 = ax * ax + ay * ay;
      if (alen2 < 16) return;
      const t = ((p.x - d.start.x) * ax + (p.y - d.start.y) * ay) / alen2;
      const delta = Math.round(t * 8);
      for (const orig of d.origs) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj[axis] = orig[axis] + delta;
        clampObject(obj);
      }
      for (const orig of d.contents) {
        const obj = objs.find((o) => o.id === orig.id);
        if (!obj) continue;
        obj[axis] = orig[axis] + delta;
        clampObject(obj);
      }
      return;
    }

    if (d.kind === "scale") {
      const primary = d.origs.find((o) => o.id === d.primaryId) || d.origs[0];
      if (!primary || KINDS[primary.kind].fixed) return;
      const obj = objs.find((o) => o.id === primary.id);
      if (!obj) return;
      const c = d.corner;
      const opp = {
        x: c[0] ? primary.x : primary.x + primary.sx,
        y: c[1] ? primary.y : primary.y + primary.sy,
        z: c[2] ? primary.z : primary.z + primary.sz,
      };
      const hit = intersectPlane(ray.origin, ray.dir, d.grab, d.planeN);
      if (!hit) return;
      const px = Math.round(hit.point.x);
      const py = Math.round(hit.point.y);
      const pz = Math.round(hit.point.z);
      obj.x = Math.min(opp.x, px);
      obj.y = Math.min(opp.y, py);
      obj.z = Math.min(opp.z, pz);
      obj.sx = Math.max(1, Math.max(opp.x, px) - obj.x);
      obj.sy = Math.max(1, Math.max(opp.y, py) - obj.y);
      obj.sz = Math.max(1, Math.max(opp.z, pz) - obj.z);
      clampObject(obj);
    }
  }

  #visibleObjects(doc) {
    const local = this.opts.getLocalMode?.() || false;
    return activeMap(doc).objects.filter((o) => objectVisible(doc, o, this.camera, local));
  }

  #objectSegments(doc, obj) {
    /** @type {{a:{x:number,y:number,z:number},b:{x:number,y:number,z:number}}[]} */
    const segs = [];
    if (isFigureObject(obj)) {
      const tmpl = findEnemyTemplate(doc, figureTemplateName(obj));
      const verts = enemyPlacementWorldVerts(obj, tmpl);
      if (tmpl && verts.length) {
        for (const [i, j] of tmpl.lines) {
          if (verts[i] && verts[j]) segs.push({ a: verts[i], b: verts[j] });
        }
      }
      for (const [i, j] of BOX_EDGES) {
        segs.push({ a: cornerWorld(obj, i), b: cornerWorld(obj, j) });
      }
      return segs;
    }
    if (obj.kind === "platform") {
      const y = obj.y;
      segs.push(
        { a: { x: obj.x, y, z: obj.z }, b: { x: obj.x + obj.sx, y, z: obj.z } },
        { a: { x: obj.x + obj.sx, y, z: obj.z }, b: { x: obj.x + obj.sx, y, z: obj.z + obj.sz } },
        { a: { x: obj.x + obj.sx, y, z: obj.z + obj.sz }, b: { x: obj.x, y, z: obj.z + obj.sz } },
        { a: { x: obj.x, y, z: obj.z + obj.sz }, b: { x: obj.x, y, z: obj.z } }
      );
      return segs;
    }
    if (obj.kind === "backpack") {
      for (const s of this.#backpackTetraSegs(obj)) segs.push(s);
      return segs;
    }
    for (const [i, j] of BOX_EDGES) {
      segs.push({ a: cornerWorld(obj, i), b: cornerWorld(obj, j) });
    }
    for (const s of this.#glyphSegments(obj)) segs.push(s);
    return segs;
  }

  /** Equilateral base (side = sx); height = sy ≈ φ·sx. */
  #backpackTetraSegs(obj) {
    const s = obj.sx;
    const y0 = obj.y;
    const y1 = obj.y + obj.sy;
    const depth = (s * Math.sqrt(3)) / 2;
    const b0 = { x: obj.x, y: y0, z: obj.z };
    const b1 = { x: obj.x + s, y: y0, z: obj.z };
    const b2 = { x: obj.x + s / 2, y: y0, z: obj.z + depth };
    const apex = { x: obj.x + s / 2, y: y1, z: obj.z + depth / 3 };
    return [
      { a: b0, b: b1 },
      { a: b1, b: b2 },
      { a: b2, b: b0 },
      { a: apex, b: b0 },
      { a: apex, b: b1 },
      { a: apex, b: b2 },
    ];
  }

  #glyphSegments(obj) {
    const segs = [];
    if (obj.kind === "crate") {
      const f = faceCorners(obj.face || "+z");
      segs.push({ a: cornerWorld(obj, f[0]), b: cornerWorld(obj, f[2]) });
      segs.push({ a: cornerWorld(obj, f[1]), b: cornerWorld(obj, f[3]) });
    }
    if (obj.kind === "doorway") {
      const f = faceCorners(obj.face);
      const c0 = cornerWorld(obj, f[0]);
      const c1 = cornerWorld(obj, f[1]);
      const c2 = cornerWorld(obj, f[2]);
      const c3 = cornerWorld(obj, f[3]);
      segs.push({ a: c0, b: c1 }, { a: c1, b: c2 }, { a: c2, b: c3 }, { a: c3, b: c0 });
      segs.push({ a: c0, b: c2 }, { a: c1, b: c3 });
    }
    if (obj.kind === "switch") {
      const f = faceCorners(obj.face);
      const a = cornerWorld(obj, f[0]);
      const b = cornerWorld(obj, f[1]);
      const c = cornerWorld(obj, f[2]);
      const d = cornerWorld(obj, f[3]);
      const apex = {
        x: (a.x + b.x + c.x + d.x) / 4,
        y: Math.max(a.y, b.y, c.y, d.y),
        z: (a.z + b.z + c.z + d.z) / 4,
      };
      const left = { x: (a.x + d.x) / 2, y: (a.y + d.y) / 2, z: (a.z + d.z) / 2 };
      const right = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2, z: (b.z + c.z) / 2 };
      segs.push({ a: apex, b: left }, { a: left, b: right }, { a: right, b: apex });
    }
    if (obj.kind === "trigger") {
      segs.push(
        { a: cornerWorld(obj, 0), b: cornerWorld(obj, 5) },
        { a: cornerWorld(obj, 1), b: cornerWorld(obj, 4) }
      );
    }
    if (obj.kind === "teleporter") {
      const c = aabbCenter(obj);
      const y = obj.y + obj.sy;
      segs.push(
        { a: { x: obj.x, y, z: obj.z }, b: { x: obj.x + obj.sx, y, z: obj.z + obj.sz } },
        { a: { x: obj.x + obj.sx, y, z: obj.z }, b: { x: obj.x, y, z: obj.z + obj.sz } },
        { a: { x: c.x, y: obj.y, z: c.z }, b: { x: c.x, y: y + 2, z: c.z } }
      );
    }
    if (obj.kind === "teleporter_dest") {
      const c = aabbCenter(obj);
      const rot = clampEnemyRot(obj.rot ?? 0);
      const th = (rot * Math.PI) / 4;
      const fx = Math.sin(th);
      const fz = Math.cos(th);
      segs.push(
        { a: c, b: { x: c.x + fx * 4, y: c.y, z: c.z + fz * 4 } },
        {
          a: { x: c.x + fx * 4, y: c.y, z: c.z + fz * 4 },
          b: { x: c.x + fx * 2 - fz * 1.5, y: c.y, z: c.z + fz * 2 + fx * 1.5 },
        },
        {
          a: { x: c.x + fx * 4, y: c.y, z: c.z + fz * 4 },
          b: { x: c.x + fx * 2 + fz * 1.5, y: c.y, z: c.z + fz * 2 - fx * 1.5 },
        }
      );
    }
    if (obj.kind === "key") {
      const c = aabbCenter(obj);
      const top = obj.y + obj.sy;
      segs.push(
        { a: { x: c.x - 1, y: top, z: c.z }, b: { x: c.x + 1, y: top, z: c.z } },
        { a: { x: c.x, y: top, z: c.z - 1 }, b: { x: c.x, y: top, z: c.z + 1 } },
        { a: { x: c.x, y: obj.y, z: c.z }, b: { x: c.x, y: top, z: c.z } }
      );
    }
    if (obj.kind === "patrol") {
      const c = aabbCenter(obj);
      const top = obj.y + obj.sy;
      const mid = top - 0.75;
      segs.push(
        { a: { x: c.x, y: obj.y, z: c.z }, b: { x: c.x, y: top, z: c.z } },
        { a: { x: c.x, y: top, z: c.z }, b: { x: c.x + 2, y: mid, z: c.z } },
        { a: { x: c.x + 2, y: mid, z: c.z }, b: { x: c.x, y: mid - 0.5, z: c.z } },
        { a: { x: c.x, y: mid - 0.5, z: c.z }, b: { x: c.x, y: top, z: c.z } }
      );
    }
    if (obj.kind === "slope") {
      const ramp = this.#rampCorners(obj);
      segs.push(
        { a: ramp.p0, b: ramp.p1 },
        { a: ramp.p1, b: ramp.p2 },
        { a: ramp.p2, b: ramp.p3 },
        { a: ramp.p3, b: ramp.p0 }
      );
    }
    return segs;
  }

  #rampCorners(obj) {
    const lowY = obj.y;
    const highY = obj.y + obj.sy;
    if (obj.axis === "x") {
      const x0 = obj.dir === 1 ? obj.x : obj.x + obj.sx;
      const x1 = obj.dir === 1 ? obj.x + obj.sx : obj.x;
      return {
        p0: { x: x0, y: lowY, z: obj.z },
        p1: { x: x0, y: lowY, z: obj.z + obj.sz },
        p2: { x: x1, y: highY, z: obj.z + obj.sz },
        p3: { x: x1, y: highY, z: obj.z },
      };
    }
    const z0 = obj.dir === 1 ? obj.z : obj.z + obj.sz;
    const z1 = obj.dir === 1 ? obj.z + obj.sz : obj.z;
    return {
      p0: { x: obj.x, y: lowY, z: z0 },
      p1: { x: obj.x + obj.sx, y: lowY, z: z0 },
      p2: { x: obj.x + obj.sx, y: highY, z: z1 },
      p3: { x: obj.x, y: highY, z: z1 },
    };
  }

  #pick(doc, mx, my) {
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    let bestLine = null;
    for (const obj of this.#visibleObjects(doc)) {
      for (const seg of this.#objectSegments(doc, obj)) {
        const pl = projectLine(seg.a, seg.b, cam, w, h);
        if (!pl) continue;
        const d = distPointToSegment2d(mx, my, pl.ax, pl.ay, pl.bx, pl.by);
        if (d > LINE_HIT) continue;
        const mid = {
          x: (seg.a.x + seg.b.x) / 2,
          y: (seg.a.y + seg.b.y) / 2,
          z: (seg.a.z + seg.b.z) / 2,
        };
        const depth =
          (mid.x - cam.x) ** 2 + (mid.y - cam.y) ** 2 + (mid.z - cam.z) ** 2;
        if (!bestLine || d < bestLine.d - 0.01 || (Math.abs(d - bestLine.d) < 0.01 && depth < bestLine.depth)) {
          bestLine = { id: obj.id, d, depth, point: mid };
        }
      }
    }
    if (bestLine) return { id: bestLine.id, t: bestLine.depth, point: bestLine.point };

    const ray = screenRay(mx, my, cam, w, h);
    let best = null;
    for (const obj of this.#visibleObjects(doc)) {
      const hit = rayAabb(ray.origin, ray.dir, obj);
      if (!hit) continue;
      if (!best || hit.t < best.t) best = { id: obj.id, t: hit.t, point: hit.point };
    }
    return best;
  }

  #hitHandle(doc, id, mx, my) {
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (!obj) return null;
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    const c = aabbCenter(obj);
    const axes = [
      { axis: "x", p: { x: c.x + 8, y: c.y, z: c.z } },
      { axis: "y", p: { x: c.x, y: c.y + 8, z: c.z } },
      { axis: "z", p: { x: c.x, y: c.y, z: c.z + 8 } },
    ];
    const pc = projectPoint(c, cam, w, h);
    for (const a of axes) {
      const pa = projectPoint(a.p, cam, w, h);
      if (!pc.ok || !pa.ok) continue;
      if (distPointToSegment2d(mx, my, pc.sx, pc.sy, pa.sx, pa.sy) < 8) {
        const t = closestTOnSegment2d(mx, my, pc.sx, pc.sy, pa.sx, pa.sy);
        return {
          kind: "axis",
          axis: a.axis,
          world: {
            x: c.x + (a.p.x - c.x) * t,
            y: c.y + (a.p.y - c.y) * t,
            z: c.z + (a.p.z - c.z) * t,
          },
        };
      }
    }
    if (!KINDS[obj.kind].fixed) {
      for (let i = 0; i < 8; i++) {
        const cw = cornerWorld(obj, i);
        const pr = projectPoint(cw, cam, w, h);
        if (!pr.ok) continue;
        if (Math.hypot(mx - pr.sx, my - pr.sy) < HANDLE) {
          return { kind: "scale", corner: BOX_CORNERS[i], world: cw };
        }
      }
    }
    return null;
  }

  /** Drop position from screen coords: room floor under cursor, else current grid plane. */
  placeAtScreen(mx, my, kind) {
    const doc = this.opts.getDoc();
    const ray = screenRay(mx, my, this.camera, this.cssW, this.cssH);
    const def = KINDS[kind] || KINDS.crate;
    const sx = def.defaultSize[0];
    const sz = def.defaultSize[2];
    let bestRoom = null;
    let bestT = Infinity;
    for (const room of roomsOf(doc)) {
      const hit = rayAabb(ray.origin, ray.dir, room);
      if (!hit || hit.t < 0 || hit.t >= bestT) continue;
      bestT = hit.t;
      bestRoom = { room, point: hit.point };
    }
    if (bestRoom) {
      const floor = intersectPlane(ray.origin, ray.dir, { x: 0, y: bestRoom.room.y, z: 0 }, { x: 0, y: 1, z: 0 });
      const pt = floor?.point || bestRoom.point;
      return {
        x: Math.round(pt.x - sx / 2),
        y: bestRoom.room.y,
        z: Math.round(pt.z - sz / 2),
      };
    }
    const gy = this.gridY;
    const floor = intersectPlane(ray.origin, ray.dir, { x: 0, y: gy, z: 0 }, { x: 0, y: 1, z: 0 });
    if (floor) {
      return {
        x: Math.round(floor.point.x - sx / 2),
        y: gy,
        z: Math.round(floor.point.z - sz / 2),
      };
    }
    const { forward } = lookVectors(this.camera.yaw, this.camera.pitch);
    return {
      x: Math.round(this.camera.x + forward.x * 12 - sx / 2),
      y: gy,
      z: Math.round(this.camera.z + forward.z * 12 - sz / 2),
    };
  }

  /** Keep look; put selection in view center. Pull back to frame if closer than that. */
  focusSelection() {
    const ids = this.#selectedIds();
    if (!ids.length) return false;
    const doc = this.opts.getDoc();
    const objs = ids
      .map((id) => activeMap(doc).objects.find((o) => o.id === id))
      .filter(Boolean);
    if (!objs.length) return false;

    let minx = Infinity;
    let miny = Infinity;
    let minz = Infinity;
    let maxx = -Infinity;
    let maxy = -Infinity;
    let maxz = -Infinity;
    for (const o of objs) {
      minx = Math.min(minx, o.x);
      miny = Math.min(miny, o.y);
      minz = Math.min(minz, o.z);
      maxx = Math.max(maxx, o.x + o.sx);
      maxy = Math.max(maxy, o.y + o.sy);
      maxz = Math.max(maxz, o.z + o.sz);
    }
    const box = { x: minx, y: miny, z: minz, sx: maxx - minx, sy: maxy - miny, sz: maxz - minz };
    const center = aabbCenter(box);
    const cam = this.camera;
    const { forward, right, up } = lookVectors(cam.yaw, cam.pitch);
    const w = this.cssW;
    const h = this.cssH;
    const focal = Math.min(w, h) * 0.9;
    const pad = 0.82;
    const halfW = Math.max(1, w * 0.5 * pad);
    const halfH = Math.max(1, h * 0.5 * pad);

    let frameDist = 4;
    for (let i = 0; i < 8; i++) {
      const c = cornerWorld(box, i);
      const rx = c.x - center.x;
      const ry = c.y - center.y;
      const rz = c.z - center.z;
      const cx = rx * right.x + ry * right.y + rz * right.z;
      const cy = rx * up.x + ry * up.y + rz * up.z;
      const cz = rx * forward.x + ry * forward.y + rz * forward.z;
      frameDist = Math.max(frameDist, (Math.abs(cx) * focal) / halfW - cz);
      frameDist = Math.max(frameDist, (Math.abs(cy) * focal) / halfH - cz);
      frameDist = Math.max(frameDist, 1 - cz);
    }

    const currentDist = Math.hypot(cam.x - center.x, cam.y - center.y, cam.z - center.z);
    const dist = Math.max(frameDist, currentDist);
    cam.x = center.x - forward.x * dist;
    cam.y = center.y - forward.y * dist;
    cam.z = center.z - forward.z * dist;
    this.opts.onViewChanged?.();
    this.draw();
    return true;
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const doc = this.opts.getDoc();
    const cam = this.camera;
    const selected = new Set(this.#selectedIds());
    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      if (r.w >= LAYOUT_BOX_CLICK || r.h >= LAYOUT_BOX_CLICK) {
        for (const obj of this.#visibleObjects(doc)) {
          for (let i = 0; i < 8; i++) {
            const pr = projectPoint(cornerWorld(obj, i), cam, w, h);
            if (pr.ok && pr.sx >= r.x0 && pr.sx <= r.x1 && pr.sy >= r.y0 && pr.sy <= r.y1) {
              selected.add(obj.id);
              break;
            }
          }
        }
      }
    }
    const local = this.opts.getLocalMode?.() || false;
    const primary = this.#primaryId();
    this.#syncGridY(doc);

    this.#drawGrid(ctx, cam, w, h);

    const objs = [...this.#visibleObjects(doc)].sort((a, b) => {
      const ca = aabbCenter(a);
      const cb = aabbCenter(b);
      const da = (ca.x - cam.x) ** 2 + (ca.y - cam.y) ** 2 + (ca.z - cam.z) ** 2;
      const db = (cb.x - cam.x) ** 2 + (cb.y - cam.y) ** 2 + (cb.z - cam.z) ** 2;
      return db - da;
    });

    for (const obj of objs) {
      const sel = selected.has(obj.id);
      const hi = sel || obj.id === this.hoverId;
      this.#drawObject(ctx, doc, obj, cam, w, h, hi, sel, obj.id === primary);
    }

    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      ctx.fillStyle = "rgba(212, 160, 23, 0.12)";
      ctx.fillRect(r.x0, r.y0, r.w, r.h);
      ctx.strokeStyle = "#d4a017";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w, r.h);
      ctx.setLineDash([]);
    }

    ctx.fillStyle = "#8b91a0";
    ctx.font = "11px Segoe UI, sans-serif";
    ctx.fillText(
      `xyz ${cam.x | 0},${cam.y | 0},${cam.z | 0}  ${local ? "LOCAL" : "ALL"}  spd ${cam.speed | 0}`,
      8,
      16
    );
  }

  #syncGridY(doc) {
    const id = this.#primaryId();
    if (!id) return;
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (obj?.kind === "room") this.gridY = obj.y;
  }

  #drawGrid(ctx, cam, w, h) {
    const y = this.gridY;
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#3d4658";
    for (let i = 0; i <= WORLD_SIZE; i += 8) {
      this.#line3(ctx, { x: i, y, z: 0 }, { x: i, y, z: WORLD_SIZE }, cam, w, h);
      this.#line3(ctx, { x: 0, y, z: i }, { x: WORLD_SIZE, y, z: i }, cam, w, h);
    }
    ctx.strokeStyle = "#6a7388";
    for (let i = 0; i <= WORLD_SIZE; i += 32) {
      this.#line3(ctx, { x: i, y, z: 0 }, { x: i, y, z: WORLD_SIZE }, cam, w, h);
      this.#line3(ctx, { x: 0, y, z: i }, { x: WORLD_SIZE, y, z: i }, cam, w, h);
    }
    ctx.strokeStyle = "#9aa3b5";
    this.#line3(ctx, { x: 0, y, z: 0 }, { x: WORLD_SIZE, y, z: 0 }, cam, w, h);
    this.#line3(ctx, { x: 0, y, z: 0 }, { x: 0, y, z: WORLD_SIZE }, cam, w, h);
    this.#line3(ctx, { x: 0, y: 0, z: 0 }, { x: 0, y: WORLD_SIZE, z: 0 }, cam, w, h);
  }

  #line3(ctx, a, b, cam, w, h, color) {
    const seg = projectLine(a, b, cam, w, h);
    if (!seg) return;
    if (color) ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  #drawObject(ctx, doc, obj, cam, w, h, highlight, selected, primary) {
    const color =
      highlight ? "#f2d36b" : obj.kind === "room" ? colorHex(obj.lineColor ?? ROOM_LINE_DEFAULT) : KINDS[obj.kind].color;
    ctx.lineWidth = selected ? 2 : 1;
    ctx.strokeStyle = color;

    if (isFigureObject(obj)) {
      ctx.globalAlpha = selected ? 0.35 : 0.2;
      for (const [i, j] of BOX_EDGES) {
        this.#line3(ctx, cornerWorld(obj, i), cornerWorld(obj, j), cam, w, h);
      }
      ctx.globalAlpha = 1;
      const tmpl = findEnemyTemplate(doc, figureTemplateName(obj));
      const verts = enemyPlacementWorldVerts(obj, tmpl);
      if (tmpl && verts.length) {
        ctx.lineWidth = selected ? 2 : 1.5;
        for (const [i, j] of tmpl.lines) {
          if (verts[i] && verts[j]) this.#line3(ctx, verts[i], verts[j], cam, w, h);
        }
      }
    } else if (obj.kind === "backpack") {
      for (const seg of this.#backpackTetraSegs(obj)) {
        this.#line3(ctx, seg.a, seg.b, cam, w, h);
      }
    } else {
      if (isGhostKind(obj.kind)) ctx.setLineDash([5, 4]);
      for (const [i, j] of BOX_EDGES) {
        this.#line3(ctx, cornerWorld(obj, i), cornerWorld(obj, j), cam, w, h);
      }
      ctx.setLineDash([]);
      this.#drawGlyphs(ctx, obj, cam, w, h, color);
    }
    if (primary) this.#drawGizmo(ctx, obj, cam, w, h);
  }

  #drawGlyphs(ctx, obj, cam, w, h, color) {
    ctx.strokeStyle = color;
    for (const seg of this.#glyphSegments(obj)) {
      this.#line3(ctx, seg.a, seg.b, cam, w, h);
    }
  }

  #drawGizmo(ctx, obj, cam, w, h) {
    const c = aabbCenter(obj);
    this.#line3(ctx, c, { x: c.x + 8, y: c.y, z: c.z }, cam, w, h, "#e55");
    this.#line3(ctx, c, { x: c.x, y: c.y + 8, z: c.z }, cam, w, h, "#5e5");
    this.#line3(ctx, c, { x: c.x, y: c.y, z: c.z + 8 }, cam, w, h, "#55e");
    if (KINDS[obj.kind].fixed) return;
    ctx.fillStyle = "#f2d36b";
    for (let i = 0; i < 8; i++) {
      const pr = projectPoint(cornerWorld(obj, i), cam, w, h);
      if (!pr.ok) continue;
      ctx.fillRect(pr.sx - 3, pr.sy - 3, 6, 6);
    }
  }
}

// ---- js/overheadView.js ----
const ORTHO = {
  top: { u: "x", v: "z", su: "sx", sv: "sz", hint: "XZ · +Z up · camera arrow" },
  left: { u: "z", v: "y", su: "sz", sv: "sy", hint: "YZ · +Y up · camera arrow" },
  forward: { u: "x", v: "y", su: "sx", sv: "sy", hint: "XY · +Y up · camera arrow" },
};

function hexAlpha(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.slice(0, 2), 16);
  const g = parseInt(h.slice(2, 4), 16);
  const b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

class OverheadView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.mode = "top";
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(canvas.parentElement);
    this.resize();
  }

  setMode(mode) {
    if (!ORTHO[mode] || mode === this.mode) return;
    this.mode = mode;
    this.draw();
  }

  hint() {
    return ORTHO[this.mode].hint;
  }

  resize() {
    const parent = this.canvas.parentElement;
    const rect = parent.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  draw() {
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const pad = 8;
    const side = Math.min(w, h) - pad * 2;
    const ox = (w - side) / 2;
    const oy = (h - side) / 2;
    const s = side / WORLD_SIZE;
    const axes = ORTHO[this.mode];

    ctx.strokeStyle = "#8b91a0";
    ctx.strokeRect(ox, oy, side, side);
    ctx.strokeStyle = "#3d4658";
    for (let i = 0; i <= WORLD_SIZE; i += 8) {
      ctx.beginPath();
      ctx.moveTo(ox + i * s, oy);
      ctx.lineTo(ox + i * s, oy + side);
      ctx.moveTo(ox, oy + i * s);
      ctx.lineTo(ox + side, oy + i * s);
      ctx.stroke();
    }
    ctx.strokeStyle = "#6a7388";
    for (let i = 0; i <= WORLD_SIZE; i += 32) {
      ctx.beginPath();
      ctx.moveTo(ox + i * s, oy);
      ctx.lineTo(ox + i * s, oy + side);
      ctx.moveTo(ox, oy + i * s);
      ctx.lineTo(ox + side, oy + i * s);
      ctx.stroke();
    }

    const doc = this.opts.getDoc();
    const cam = this.opts.getCamera();
    const local = this.opts.getLocalMode?.() || false;
    const cur = currentRoom(doc, cam);
    const neigh = cur ? neighbourRooms(doc, cur) : [];
    const vis = local ? localVisibleIds(doc, cam) : null;
    const selected = new Set(this.opts.getSelectedIds?.() || []);
    const primary = this.opts.getSelectedId?.();
    if (primary) selected.add(primary);

    const toScreen = (u, v) => ({ x: ox + u * s, y: oy + side - v * s });

    const drawBox = (obj, fill, stroke, lw = 1) => {
      const uw = obj[axes.su] * s;
      const vh = obj[axes.sv] * s;
      const p = toScreen(obj[axes.u], obj[axes.v] + obj[axes.sv]);
      ctx.lineWidth = lw;
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fillRect(p.x, p.y, uw, vh);
      }
      ctx.strokeStyle = stroke;
      ctx.strokeRect(p.x, p.y, uw, vh);
    };

    for (const obj of activeMap(doc).objects) {
      if (obj.kind !== "room") continue;
      const isCur = cur && obj.id === cur.id;
      const isN = neigh.some((n) => n.id === obj.id);
      const faded = vis && !vis.has(obj.id);
      const bgHex = colorHex(obj.bgColor ?? ROOM_BG_DEFAULT);
      const lineHex = colorHex(obj.lineColor ?? ROOM_LINE_DEFAULT);
      const fill = isCur
        ? hexAlpha(bgHex, 0.28)
        : isN
          ? hexAlpha(bgHex, 0.18)
          : hexAlpha(bgHex, 0.08);
      drawBox(obj, fill, faded ? "#333" : lineHex, isCur ? 2 : 1);
    }

    for (const obj of activeMap(doc).objects) {
      if (obj.kind === "room") continue;
      const faded = vis && !vis.has(obj.id);
      const col = faded ? "#444" : KINDS[obj.kind].color;
      if (isGhostKind(obj.kind)) ctx.setLineDash([4, 3]);
      drawBox(obj, null, selected.has(obj.id) ? "#f2d36b" : col, selected.has(obj.id) ? 2 : 1);
      ctx.setLineDash([]);
    }

    const { forward } = lookVectors(cam.yaw, cam.pitch);
    const c = toScreen(cam[axes.u], cam[axes.v]);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#d4a017";
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + forward[axes.u] * 14, c.y - forward[axes.v] * 14);
    ctx.stroke();
  }
}

// ---- js/animView.js ----
const AXIS_LEN = 8;
const AXIS_HIT = 9;
const ANIM_BOX_CLICK = 4;
function clampAnimDist(d) {
  return Math.max(ANIM_ORBIT_DIST_MIN, Math.min(ANIM_ORBIT_DIST_MAX, d));
}
const AXIS_COLS = { x: "#e55", y: "#5e5", z: "#55e" };

class AnimView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.orbit = { yaw: 0.5, pitch: 0.15, dist: 48 };
    this.drag = null;
    this.hover = -1;
    this.hoverAxis = null;
    this.enabled = false;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  resize() {
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  #overlay() {
    return this.opts.getMeshOverlay?.() || null;
  }

  #binding() {
    const overlay = this.#overlay();
    return overlay && overlay.bindJoint >= 0;
  }

  #cam() {
    const { yaw, pitch, dist } = this.orbit;
    const { forward } = lookVectors(yaw, pitch);
    return {
      x: -forward.x * dist,
      y: 10 - forward.y * dist,
      z: -forward.z * dist,
      yaw,
      pitch,
    };
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #primaryVert() {
    return this.#selectionAnchor();
  }

  #selectedIndices() {
    return this.opts.getSelectedVerts?.() || [];
  }

  #selectionAnchor() {
    const selected = this.#selectedIndices();
    if (!selected.length) return null;
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const verts = enemy.frames[frame];
    if (selected.length === 1) {
      const i = selected[0];
      return { index: i, v: verts[i], indices: selected };
    }
    let x = 0;
    let y = 0;
    let z = 0;
    for (const i of selected) {
      x += verts[i].x;
      y += verts[i].y;
      z += verts[i].z;
    }
    const n = selected.length;
    return { index: selected[selected.length - 1], v: { x: x / n, y: y / n, z: z / n }, indices: selected };
  }

  #axisEnd(v, axis) {
    return {
      x: v.x + (axis === "x" ? AXIS_LEN : 0),
      y: v.y + (axis === "y" ? AXIS_LEN : 0),
      z: v.z + (axis === "z" ? AXIS_LEN : 0),
    };
  }

  #hitAmong(verts, mx, my, radius = 10) {
    const cam = this.#cam();
    let best = -1;
    let bestD = radius;
    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      const d = Math.hypot(mx - p.sx, my - p.sy);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  #hitVert(mx, my) {
    const overlay = this.#overlay();
    if (overlay && overlay.bindJoint >= 0) return this.#hitAmong(overlay.verts, mx, my, 8);
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    return this.#hitAmong(enemy.frames[frame], mx, my, 10);
  }

  #hitAxis(mx, my) {
    const prim = this.#primaryVert();
    if (!prim) return null;
    const cam = this.#cam();
    const w = this.cssW;
    const h = this.cssH;
    const pa = projectPoint(prim.v, cam, w, h);
    if (!pa.ok) return null;
    let best = null;
    let bestD = AXIS_HIT;
    for (const axis of ["x", "y", "z"]) {
      const pb = projectPoint(this.#axisEnd(prim.v, axis), cam, w, h);
      if (!pb.ok) continue;
      const d = distPointToSegment2d(mx, my, pa.sx, pa.sy, pb.sx, pb.sy);
      if (d < bestD) {
        bestD = d;
        best = axis;
      }
    }
    return best;
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.orbit.dist = clampAnimDist(this.orbit.dist * (e.deltaY > 0 ? 1.1 : 1 / 1.1));
    this.opts.onViewChanged?.();
    this.draw();
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    if (e.button === 2 && e.altKey) {
      this.drag = { kind: "zoom", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button === 2 || e.button === 1) {
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;

    const binding = this.#binding();
    const axis = binding ? null : this.#hitAxis(p.x, p.y);
    if (axis) {
      const prim = this.#selectionAnchor();
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const verts = enemy.frames[frame];
      this.opts.beginUndo?.();
      this.drag = {
        kind: "axis",
        axis,
        origs: prim.indices.map((i) => ({ i, x: verts[i].x, y: verts[i].y, z: verts[i].z })),
        orig: { x: prim.v.x, y: prim.v.y, z: prim.v.z },
        start: p,
      };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const vi = this.#hitVert(p.x, p.y);
    if (vi >= 0) {
      if (binding) {
        this.opts.onSelectMeshVert?.(vi, e.shiftKey);
        this.drag = { kind: "select" };
        this.canvas.setPointerCapture(e.pointerId);
        this.draw();
        return;
      }
      const selected = this.opts.getSelectedVerts?.() || [];
      const wasSelected = selected.includes(vi);
      this.opts.onSelectVert?.(vi, e.shiftKey);
      if (!wasSelected && !e.shiftKey) {
        const enemy = this.opts.getEnemy();
        const frame = this.opts.getFrame();
        const v = enemy.frames[frame][vi];
        this.drag = {
          kind: "plane",
          index: vi,
          lock: this.#lockAxis(),
          orig: { x: v.x, y: v.y, z: v.z },
          undoStarted: false,
        };
      } else {
        this.drag = { kind: "select" };
      }
      this.canvas.setPointerCapture(e.pointerId);
      this.draw();
      return;
    }
    this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    if (!this.drag) {
      this.hoverAxis = this.#binding() ? null : this.#hitAxis(p.x, p.y);
      this.hover = this.hoverAxis ? -1 : this.#hitVert(p.x, p.y);
      this.draw();
      return;
    }
    if (this.drag.kind === "orbit") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      this.orbit.yaw += dx * 0.01;
      this.orbit.pitch = Math.max(-1.2, Math.min(1.2, this.orbit.pitch - dy * 0.01));
      this.draw();
      return;
    }
    if (this.drag.kind === "zoom") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      const delta = dx + dy;
      if (delta) {
        this.orbit.dist = clampAnimDist(this.orbit.dist * Math.exp(-delta * ANIM_ZOOM_K));
      }
      this.draw();
      return;
    }
    if (this.drag.kind === "box") {
      this.drag.end = p;
      this.draw();
      return;
    }
    if (this.drag.kind === "axis") {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const verts = enemy.frames[frame];
      const cam = this.#cam();
      const orig = this.drag.orig;
      const pa = projectPoint(orig, cam, this.cssW, this.cssH);
      const pb = projectPoint(this.#axisEnd(orig, this.drag.axis), cam, this.cssW, this.cssH);
      if (!pa.ok || !pb.ok) return;
      const ax = pb.sx - pa.sx;
      const ay = pb.sy - pa.sy;
      const alen2 = ax * ax + ay * ay;
      if (alen2 < 16) return;
      const t = ((p.x - this.drag.start.x) * ax + (p.y - this.drag.start.y) * ay) / alen2;
      const delta = Math.round(t * AXIS_LEN);
      for (const o of this.drag.origs) {
        const v = verts[o.i];
        v.x = o.x;
        v.y = o.y;
        v.z = o.z;
        v[this.drag.axis] = clampVert(o[this.drag.axis] + delta);
      }
      this.opts.onChange?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "plane") {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const v = enemy.frames[frame][this.drag.index];
      const orig = this.drag.orig;
      const cam = this.#cam();
      const ray = screenRay(p.x, p.y, cam, this.cssW, this.cssH);
      const n = { x: 0, y: 0, z: 0 };
      n[this.drag.lock] = 1;
      const hit = intersectPlane(ray.origin, ray.dir, orig, n);
      if (!hit) return;
      const next = {
        x: this.drag.lock === "x" ? orig.x : clampVert(Math.round(hit.point.x)),
        y: this.drag.lock === "y" ? orig.y : clampVert(Math.round(hit.point.y)),
        z: this.drag.lock === "z" ? orig.z : clampVert(Math.round(hit.point.z)),
      };
      if (next.x === v.x && next.y === v.y && next.z === v.z) return;
      if (!this.drag.undoStarted) {
        this.opts.beginUndo?.();
        this.drag.undoStarted = true;
      }
      v.x = next.x;
      v.y = next.y;
      v.z = next.z;
      this.opts.onChange?.();
      this.draw();
    }
  }

  #lockAxis() {
    const { forward } = lookVectors(this.orbit.yaw, this.orbit.pitch);
    const ax = Math.abs(forward.x);
    const ay = Math.abs(forward.y);
    const az = Math.abs(forward.z);
    if (ax >= ay && ax >= az) return "x";
    if (ay >= az) return "y";
    return "z";
  }

  #boxRect() {
    const a = this.drag.start;
    const b = this.drag.end;
    const x0 = Math.min(a.x, b.x);
    const y0 = Math.min(a.y, b.y);
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  #vertsInBox(rect) {
    const overlay = this.#overlay();
    const verts =
      overlay && overlay.bindJoint >= 0
        ? overlay.verts
        : this.opts.getEnemy().frames[this.opts.getFrame()];
    const cam = this.#cam();
    const hits = [];
    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      if (p.sx >= rect.x0 && p.sx <= rect.x1 && p.sy >= rect.y0 && p.sy <= rect.y1) hits.push(i);
    });
    return hits;
  }

  #finishBox() {
    const rect = this.#boxRect();
    const additive = this.drag.additive;
    const binding = this.#binding();
    if (rect.w < ANIM_BOX_CLICK && rect.h < ANIM_BOX_CLICK) {
      if (!binding && !additive) this.opts.onSelectVerts?.([]);
      return;
    }
    const hits = this.#vertsInBox(rect);
    if (binding) this.opts.onSelectMeshVerts?.(hits, additive);
    else this.opts.onSelectVerts?.(hits, additive);
  }

  #onUp(e) {
    if (!this.enabled) return;
    const orbitEnded = this.drag?.kind === "orbit" || this.drag?.kind === "zoom";
    if (this.drag?.kind === "box") this.#finishBox();
    if (this.drag?.kind === "axis" || this.drag?.undoStarted) this.opts.endUndo?.();
    this.drag = null;
    if (orbitEnded) this.opts.onViewChanged?.();
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    this.draw();
  }

  #strokeSeg(ctx, cam, w, h, p0, p1, col, width = 1) {
    const seg = projectLine(p0, p1, cam, w, h);
    if (!seg) return;
    ctx.strokeStyle = col;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  #drawForwardArrow(ctx, cam, w, h) {
    const y = 0.2;
    const tip = { x: 0, y, z: 14 };
    const col = "#d4a017";
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y, z: 0 }, tip, col, 2.5);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 2.5, y, z: 10 }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: -2.5, y, z: 10 }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 0, y: 2.5, z: 10 }, col, 2);
    const label = projectPoint({ x: 0, y: 1.5, z: 16 }, cam, w, h);
    if (label.ok) {
      ctx.fillStyle = col;
      ctx.font = "11px Segoe UI, sans-serif";
      ctx.fillText("fwd", label.sx - 10, label.sy);
    }
  }

  #drawGizmo(ctx, cam, w, h, v) {
    for (const axis of ["x", "y", "z"]) {
      const hi = this.hoverAxis === axis || this.drag?.axis === axis;
      const col = hi ? "#fff" : AXIS_COLS[axis];
      this.#strokeSeg(ctx, cam, w, h, v, this.#axisEnd(v, axis), col, hi ? 3 : 2);
      const tip = projectPoint(this.#axisEnd(v, axis), cam, w, h);
      if (tip.ok) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(tip.sx, tip.sy, hi ? 5 : 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const cam = this.#cam();
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const selected = this.opts.getSelectedVerts?.() || [];
    const verts = enemy.frames[frame] || enemy.frames[0];
    const overlay = this.#overlay();
    const binding = overlay && overlay.bindJoint >= 0;
    let shown = selected;
    let meshShown = overlay ? [...(overlay.jointVerts[overlay.bindJoint] || [])] : [];
    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      if (r.w >= ANIM_BOX_CLICK || r.h >= ANIM_BOX_CLICK) {
        const hits = this.#vertsInBox(r);
        if (binding) {
          meshShown = this.drag.additive ? [...new Set([...meshShown, ...hits])] : hits;
        } else {
          shown = this.drag.additive ? [...new Set([...selected, ...hits])] : hits;
        }
      }
    }

    ctx.lineWidth = 1;
    for (let i = -24; i <= 24; i += 8) {
      this.#strokeSeg(ctx, cam, w, h, { x: i, y: 0, z: -24 }, { x: i, y: 0, z: 24 }, "#3d4658");
      this.#strokeSeg(ctx, cam, w, h, { x: -24, y: 0, z: i }, { x: 24, y: 0, z: i }, "#3d4658");
    }
    this.#strokeSeg(ctx, cam, w, h, { x: -20, y: 0, z: 0 }, { x: 20, y: 0, z: 0 }, "#a66");
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y: 0, z: 0 }, { x: 0, y: 24, z: 0 }, "#6a6");
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y: 0, z: -20 }, { x: 0, y: 0, z: 20 }, "#66a");
    this.#drawForwardArrow(ctx, cam, w, h);

    if (overlay) {
      ctx.lineWidth = 1;
      for (const [i, j] of overlay.edges) {
        const a = overlay.verts[i];
        const b = overlay.verts[j];
        if (a && b) this.#strokeSeg(ctx, cam, w, h, a, b, "#3a4458", 1);
      }
      if (overlay.ghost) {
        for (const [i, j] of overlay.lines || enemy.lines) {
          const a = overlay.ghost[i];
          const b = overlay.ghost[j];
          if (a && b) this.#strokeSeg(ctx, cam, w, h, a, b, "#5ec8c8", 1.5);
        }
        overlay.ghost.forEach((v) => {
          if (!v) return;
          const p = projectPoint(v, cam, w, h);
          if (!p.ok) return;
          ctx.fillStyle = "#5ec8c8";
          ctx.beginPath();
          ctx.arc(p.sx, p.sy, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    ctx.lineWidth = 1.5;
    for (const [i, j] of enemy.lines) {
      this.#strokeSeg(ctx, cam, w, h, verts[i], verts[j], "#c8ccd4", 1.5);
    }

    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, w, h);
      if (!p.ok) return;
      const sel = !binding && shown.includes(i);
      const hover = !binding && i === this.hover;
      ctx.fillStyle = sel ? "#d4a017" : hover ? "#fff" : "#8b91a0";
      const r = sel ? 5 : 4;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
      ctx.fill();
    });

    if (binding) {
      const assignedOther = new Set();
      overlay.jointVerts.forEach((list, ji) => {
        if (ji === overlay.bindJoint) return;
        for (const i of list) assignedOther.add(i);
      });
      overlay.verts.forEach((v, i) => {
        const p = projectPoint(v, cam, w, h);
        if (!p.ok) return;
        const sel = meshShown.includes(i);
        const hover = i === this.hover;
        const other = assignedOther.has(i);
        ctx.fillStyle = sel ? "#d4a017" : hover ? "#fff" : other ? "#5ec8c8" : "#5a6270";
        const r = sel || hover ? 3.5 : 2.5;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    const prim = this.#selectionAnchor();
    if (prim && !binding) this.#drawGizmo(ctx, cam, w, h, prim.v);

    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      ctx.fillStyle = "rgba(212, 160, 23, 0.12)";
      ctx.fillRect(r.x0, r.y0, r.w, r.h);
      ctx.strokeStyle = "#d4a017";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w, r.h);
      ctx.setLineDash([]);
    }

    ctx.fillStyle = "#8b91a0";
    ctx.font = "11px Segoe UI, sans-serif";
    const clip = clipForFrame(enemy.clips, frame);
    let label;
    if (enemy.clips?.length && clip) {
      label = `${clip.name} ${frame - clip.start}`;
    } else if (overlay?.frameName) {
      label = overlay.frameName;
    } else {
      label = "rest";
    }
    const frameTotal = enemy.clips?.length ? enemy.frames.length : overlay ? "MDL" : enemy.frames.length;
    ctx.fillText(`${enemy.name} · ${label} · 13 verts · ${frameTotal} frames`, 8, 16);
  }
}

// ---- js/weaponView.js ----
const ONION = "rgba(180, 170, 140, 0.28)";
const CURRENT = "#e8e4d8";
const OVERLAY = "rgba(212, 160, 23, 0.9)";
const GRID = "rgba(255, 255, 255, 0.06)";

class WeaponView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.enabled = false;
    this.drag = null;
    this.cssW = 0;
    this.cssH = 0;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  resize() {
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  #layout() {
    const w = this.cssW;
    const h = this.cssH;
    const cell = Math.min(w / (WEAPON_SPRITE_W * 2.15), h / (WEAPON_SPRITE_H * 2.15));
    const ow = WEAPON_SPRITE_W * cell;
    const oh = WEAPON_SPRITE_H * cell;
    return {
      cell,
      ox: (w - ow) / 2,
      oy: (h - oh) / 2,
      ow,
      oh,
    };
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #toCanvas(layout, x, y) {
    return { x: layout.ox + x * layout.cell, y: layout.oy + y * layout.cell };
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    const cur = this.opts.getScale();
    const next = Math.max(0.05, Math.min(8, cur * (e.deltaY > 0 ? 0.92 : 1.08)));
    if (Math.abs(next - cur) < 1e-6) return;
    this.opts.beginUndo?.();
    this.opts.setScale(next);
    this.opts.endUndo?.();
    this.opts.onChange?.();
    this.opts.onPanEnd?.();
    this.draw();
  }

  #projectedVerts() {
    const mdl = this.opts.getMdl?.();
    if (!mdl) return [];
    const verts = mdlQuakeVerts(mdl, this.opts.getPreviewFrame());
    const scale = this.opts.getScale();
    const pan = this.opts.getPan();
    const out = [];
    for (let i = 0; i < verts.length; i++) {
      const p = projectViewVert(verts[i]);
      if (!p.ok) continue;
      const s = toSpritePos(p.sx, p.sy, scale, pan);
      out.push({ i, x: s.x, y: s.y, v: verts[i] });
    }
    return out;
  }

  #hitVertCluster(mx, my) {
    const layout = this.#layout();
    const pts = this.#projectedVerts();
    let best = -1;
    let bestD = 10;
    for (const p of pts) {
      const c = this.#toCanvas(layout, p.x, p.y);
      const d = Math.hypot(mx - c.x, my - c.y);
      if (d < bestD) {
        bestD = d;
        best = p.i;
      }
    }
    if (best < 0) return [];
    const hit = pts.find((p) => p.i === best);
    const hc = this.#toCanvas(layout, hit.x, hit.y);
    const cluster = [];
    for (const p of pts) {
      const c = this.#toCanvas(layout, p.x, p.y);
      if (Math.hypot(c.x - hc.x, c.y - hc.y) <= 4) cluster.push(p.i);
    }
    return cluster.sort((a, b) => a - b);
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    if (e.button !== 0) return;
    const p = this.#eventPos(e);
    const cluster = this.#hitVertCluster(p.x, p.y);
    if (cluster.length) {
      this.opts.onSelectVerts?.(cluster, e.shiftKey);
      this.drag = { kind: "select" };
      return;
    }
    if (!e.shiftKey) this.opts.onSelectVerts?.([], false);
    const pan = this.opts.getPan();
    this.opts.beginUndo?.();
    this.drag = { kind: "pan", last: p, pan: { x: pan.x, y: pan.y } };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #onMove(e) {
    if (!this.enabled || !this.drag || this.drag.kind !== "pan") return;
    const p = this.#eventPos(e);
    const layout = this.#layout();
    const dx = (p.x - this.drag.last.x) / layout.cell;
    const dy = (p.y - this.drag.last.y) / layout.cell;
    this.drag.last = p;
    this.drag.pan = { x: this.drag.pan.x + dx, y: this.drag.pan.y + dy };
    this.opts.setPan(this.drag.pan.x, this.drag.pan.y);
    this.opts.onChange?.();
    this.draw();
  }

  #onUp() {
    if (!this.drag) return;
    const pan = this.drag.kind === "pan";
    this.drag = null;
    if (pan) {
      this.opts.endUndo?.();
      this.opts.onPanEnd?.();
    }
  }

  #strokeSegs(ctx, layout, segs, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    for (const s of segs) {
      const a = this.#toCanvas(layout, s.ax, s.ay);
      const b = this.#toCanvas(layout, s.bx, s.by);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
  }

  drawPreview() {
    const canvas = this.opts.previewCanvas;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const scale = 6;
    canvas.width = WEAPON_SPRITE_W * scale;
    canvas.height = WEAPON_SPRITE_H * scale;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const mdl = this.opts.getMdl?.();
    if (!mdl) return;
    const { pixels } = rasterWeaponFrame(
      mdl,
      this.opts.getPreviewFrame(),
      this.opts.getScale(),
      this.opts.getPan()
    );
    ctx.fillStyle = "#e8e4d8";
    for (let y = 0; y < WEAPON_SPRITE_H; y++) {
      for (let x = 0; x < WEAPON_SPRITE_W; x++) {
        if (!pixels[y * WEAPON_SPRITE_W + x]) continue;
        ctx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
    ctx.strokeStyle = "rgba(212, 160, 23, 0.5)";
    ctx.strokeRect(0.5, 0.5, canvas.width - 1, canvas.height - 1);
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.moveTo(24 * scale + 0.5, 0);
    ctx.lineTo(24 * scale + 0.5, canvas.height);
    ctx.moveTo(0, 21 * scale + 0.5);
    ctx.lineTo(canvas.width, 21 * scale + 0.5);
    ctx.stroke();
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const layout = this.#layout();
    ctx.fillStyle = "rgba(212, 160, 23, 0.06)";
    ctx.fillRect(layout.ox, layout.oy, layout.ow, layout.oh);
    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < WEAPON_SPRITE_W; x++) {
      const px = layout.ox + x * layout.cell;
      ctx.moveTo(px, layout.oy);
      ctx.lineTo(px, layout.oy + layout.oh);
    }
    for (let y = 1; y < WEAPON_SPRITE_H; y++) {
      const py = layout.oy + y * layout.cell;
      ctx.moveTo(layout.ox, py);
      ctx.lineTo(layout.ox + layout.ow, py);
    }
    ctx.stroke();
    ctx.strokeStyle = OVERLAY;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(layout.ox + 0.5, layout.oy + 0.5, layout.ow - 1, layout.oh - 1);
    ctx.strokeStyle = "rgba(212, 160, 23, 0.35)";
    ctx.beginPath();
    ctx.moveTo(layout.ox + 24 * layout.cell, layout.oy);
    ctx.lineTo(layout.ox + 24 * layout.cell, layout.oy + layout.oh);
    ctx.moveTo(layout.ox, layout.oy + 21 * layout.cell);
    ctx.lineTo(layout.ox + layout.ow, layout.oy + 21 * layout.cell);
    ctx.stroke();

    const mdl = this.opts.getMdl?.();
    if (!mdl) {
      ctx.fillStyle = "#8b91a0";
      ctx.font = "13px Segoe UI, sans-serif";
      ctx.fillText("Open shareware (pak0.pak) to load view-models", 16, 28);
      this.drawPreview();
      this.opts.onClipWarn?.(false);
      return;
    }

    const scale = this.opts.getScale();
    const pan = this.opts.getPan();
    const current = this.opts.getPreviewFrame();
    const onion = this.opts.getOnionFrames?.() || [];
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const fi of onion) {
      if (fi === current) continue;
      const { segs } = projectedWeaponEdges(mdl, fi, scale, pan);
      this.#strokeSegs(ctx, layout, segs, ONION, 1);
    }
    const { segs, clipped } = projectedWeaponEdges(mdl, current, scale, pan);
    this.#strokeSegs(ctx, layout, segs, CURRENT, 1.4);
    this.opts.onClipWarn?.(clipped);

    const selected = new Set(this.opts.getSelectedVerts?.() || []);
    const pts = this.#projectedVerts();
    ctx.font = "10px Segoe UI, sans-serif";
    for (const p of pts) {
      const c = this.#toCanvas(layout, p.x, p.y);
      const on = selected.has(p.i);
      ctx.fillStyle = on ? "#f0c040" : "rgba(180, 190, 210, 0.7)";
      ctx.beginPath();
      ctx.arc(c.x, c.y, on ? 4.5 : 2.4, 0, Math.PI * 2);
      ctx.fill();
      if (on) {
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = "#f0c040";
        ctx.fillText(String(p.i), c.x + 6, c.y - 4);
      }
    }

    ctx.fillStyle = OVERLAY;
    ctx.font = "11px Segoe UI, sans-serif";
    ctx.fillText("48×42", layout.ox + 4, layout.oy - 6);

    this.drawPreview();
  }
}

// ---- js/main.js ----
const statusEl = document.getElementById("status");
const titleEl = document.querySelector(".toolbar h1");
const btnUndo = document.getElementById("btn-undo");
const btnRedo = document.getElementById("btn-redo");
const UNDO_LIMIT = 40;
const AUTOSAVE_MS = 8000;
/** Match Quake monster default: one MDL frame per 0.1s think. */
const ANIM_PLAY_MS = 100;

let doc = createDefaultDocument();
let editorMode = "layout";
let localDraw = false;
let selectedIds = [];
let pendingPlace = null;
let enemyIndex = 0;
let frameIndex = 0;
let selectedVerts = [];
let dirty = false;
let saving = false;
let autosaveTimer = null;
let undoStack = [];
let redoStack = [];
let undoGesture = false;
let frameClipboard = null;
let animPlaying = false;
let animPlayTimer = null;
let animLoop = false;
let sharewareModels = {};
let sharewareMissing = [];
let sharewareWeapons = {};
let sharewareWeaponMissing = [];
let overlayOn = true;
let bindJoint = -1;
let clipIndex = 0;
let frameLocal = 0;
let mdlScale = DEFAULT_MDL_SCALE;
let weaponKey = "axe";
let weaponFrame = 0;
let weaponClipWarn = false;
let weaponSelectedVerts = [];
/** Collapsed room ids in the Objects tree. */
const collapsedRooms = new Set();

const layoutView = new LayoutView(document.getElementById("view-canvas"), {
  stage: document.getElementById("map-stage"),
  getDoc: () => doc,
  getSelectedIds: () => selectedIds,
  getLocalMode: () => localDraw && editorMode === "layout",
  onSelectIds: (ids, additive) => {
    if (additive) {
      for (const id of ids) {
        if (!selectedIds.includes(id)) selectedIds.push(id);
      }
    } else selectedIds = [...ids];
    markDirty();
    refreshPanels();
  },
  onToggleSelect: (id) => {
    const i = selectedIds.indexOf(id);
    if (i >= 0) selectedIds.splice(i, 1);
    else selectedIds.push(id);
    markDirty();
    refreshPanels();
  },
  onChange: () => {
    markDirty();
    refreshPanels();
  },
  onViewChanged: () => {
    syncEditorToDoc();
    markDirty();
  },
  onStatus: setStatus,
  beginUndo,
  endUndo,
});

const overheadView = new OverheadView(document.getElementById("overhead-canvas"), {
  getDoc: () => doc,
  getCamera: () => layoutView.camera,
  getSelectedId: () => (selectedIds.length ? selectedIds[selectedIds.length - 1] : null),
  getSelectedIds: () => selectedIds,
  getLocalMode: () => localDraw,
});

const animView = new AnimView(document.getElementById("view-canvas"), {
  stage: document.getElementById("map-stage"),
  getEnemy: () => doc.enemies[enemyIndex],
  getFrame: () => {
    const e = doc.enemies[enemyIndex];
    if (!e?.clips?.length) return 0;
    return frameIndex;
  },
  getSelectedVerts: () => selectedVerts,
  onSelectVert: (i, additive) => {
    if (i < 0) selectedVerts = [];
    else if (additive) {
      if (!selectedVerts.includes(i)) selectedVerts.push(i);
    } else selectedVerts = [i];
    markDirty();
    refreshPanels();
  },
  onSelectVerts: (indices, additive) => {
    if (additive) {
      for (const i of indices) {
        if (!selectedVerts.includes(i)) selectedVerts.push(i);
      }
    } else selectedVerts = [...indices];
    markDirty();
    refreshPanels();
  },
  onChange: () => {
    markDirty();
    refreshPanels();
  },
  onViewChanged: () => {
    syncEditorToDoc();
    markDirty();
  },
  beginUndo,
  endUndo,
  getMeshOverlay: () => {
    if (!overlayOn) return null;
    const e = doc.enemies[enemyIndex];
    if (!e) return null;
    const mdl = sharewareModels[e.name];
    if (!mdl) return null;
    const timeline = getTimeline(e);
    const clip = timeline[clipIndex] || timeline[0];
    if (!clip) return null;
    const local = Math.max(0, Math.min(frameLocal, clip.len - 1));
    const frameName = clip.frameNames?.[local] || `${clip.name}${local}`;
    const mdlFi = e.clips?.length
      ? mdlFrameIndexAt(mdl, e.clips[clipIndex].start + local)
      : clip.mdlFrames[local]?.index ?? 0;
    const verts = mdlEditorVerts(mdl, mdlFi, mdlScale);
    const rig = e.mdlRig || emptyMdlRig();
    return {
      verts,
      edges: mdl.edges,
      bindJoint,
      jointVerts: rig.jointVerts,
      ghost: averageJointPositions(verts, rig.jointVerts),
      lines: e.lines,
      frameName,
    };
  },
  onSelectMeshVert: (i, additive) => {
    assignMeshVerts([i], additive);
  },
  onSelectMeshVerts: (indices, additive) => {
    assignMeshVerts(indices, additive);
  },
});

const weaponView = new WeaponView(document.getElementById("view-canvas"), {
  stage: document.getElementById("map-stage"),
  previewCanvas: document.getElementById("weapon-preview-canvas"),
  getMdl: () => sharewareWeapons[weaponKey] || null,
  getScale: () => doc.weapons.scale,
  getPan: () => {
    const item = doc.weapons.items[weaponKey];
    return item?.pan || { x: 0, y: 0 };
  },
  getPreviewFrame: () => weaponFrame,
  getOnionFrames: () => selectedWeaponFrames(),
  getSelectedVerts: () => weaponSelectedVerts,
  onSelectVerts: (indices, additive) => {
    if (!indices.length) {
      if (!additive) weaponSelectedVerts = [];
    } else if (additive) {
      const set = new Set(weaponSelectedVerts);
      for (const i of indices) set.add(i);
      weaponSelectedVerts = [...set].sort((a, b) => a - b);
    } else weaponSelectedVerts = [...indices].sort((a, b) => a - b);
    refreshPanels();
    if (editorMode === "weapons") weaponView.draw();
  },
  setScale: (v) => {
    doc.weapons.scale = clampWeaponScale(v);
    syncWeaponScaleInputs();
  },
  setPan: (x, y) => {
    const item = ensureWeaponItem(weaponKey);
    item.pan = { x, y };
  },
  beginUndo,
  endUndo,
  onChange: () => {
    markDirty();
  },
  onPanEnd: () => {
    refreshWeaponClipStatus();
  },
  onClipWarn: (clipped) => {
    weaponClipWarn = !!clipped;
    if (editorMode === "weapons") refreshWeaponClipStatus();
  },
});

function setStatus(msg, isError = false) {
  statusEl.textContent = msg || "";
  statusEl.classList.toggle("error", isError);
}

function updateDirtyIndicator() {
  const star = dirty ? "*" : "";
  if (titleEl) titleEl.textContent = `Quake64${star}`;
  document.title = dirty ? "Quake64 *" : "Quake64 Editor";
}

function markDirty() {
  if (!dirty) {
    dirty = true;
    updateDirtyIndicator();
  }
  scheduleAutosave();
}

function markClean() {
  dirty = false;
