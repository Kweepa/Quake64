const HANDLE = 7;

class LayoutView {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {object} opts
   */
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.camera = {
      x: 28,
      y: 10,
      z: -6,
      yaw: 0.35,
      pitch: -0.2,
      speed: 28,
    };
    this.keys = new Set();
    this.look = false;
    this.lastT = 0;
    this.hoverId = null;
    this.drag = null;
    this.enabled = true;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    window.addEventListener("keydown", (e) => this.#onKey(e, true));
    window.addEventListener("keyup", (e) => this.#onKey(e, false));

    this._raf = (t) => {
      if (this.enabled) this.#tick(t);
      else this.lastT = t;
      requestAnimationFrame(this._raf);
    };
    requestAnimationFrame(this._raf);
  }

  resize() {
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  #focused() {
    return document.activeElement === this.canvas;
  }

  #onKey(e, down) {
    if (!this.enabled) return;
    if (!this.#focused() && down) return;
    const k = e.key.toLowerCase();
    if ("wasdqe".includes(k) || k === "shift") {
      if (down) this.keys.add(k);
      else this.keys.delete(k);
      if (down) e.preventDefault();
    }
  }

  #tick(t) {
    const dt = this.lastT ? Math.min(0.05, (t - this.lastT) / 1000) : 0;
    this.lastT = t;
    if (this.#focused()) {
      const { forward, right, up } = lookVectors(this.camera.yaw, this.camera.pitch);
      const boost = this.keys.has("shift") ? 3 : 1;
      const sp = this.camera.speed * boost * dt;
      if (this.keys.has("w")) {
        this.camera.x += forward.x * sp;
        this.camera.y += forward.y * sp;
        this.camera.z += forward.z * sp;
      }
      if (this.keys.has("s")) {
        this.camera.x -= forward.x * sp;
        this.camera.y -= forward.y * sp;
        this.camera.z -= forward.z * sp;
      }
      if (this.keys.has("d")) {
        this.camera.x += right.x * sp;
        this.camera.y += right.y * sp;
        this.camera.z += right.z * sp;
      }
      if (this.keys.has("a")) {
        this.camera.x -= right.x * sp;
        this.camera.y -= right.y * sp;
        this.camera.z -= right.z * sp;
      }
      if (this.keys.has("e")) {
        this.camera.x += up.x * sp;
        this.camera.y += up.y * sp;
        this.camera.z += up.z * sp;
      }
      if (this.keys.has("q")) {
        this.camera.x -= up.x * sp;
        this.camera.y -= up.y * sp;
        this.camera.z -= up.z * sp;
      }
    }
    this.draw();
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #onWheel(e) {
    if (!this.enabled || !this.#focused()) return;
    e.preventDefault();
    this.camera.speed = Math.max(6, Math.min(80, this.camera.speed + (e.deltaY > 0 ? -4 : 4)));
    this.opts.onStatus?.(`Fly speed ${this.camera.speed | 0}`);
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    if (e.button === 2 || e.button === 1) {
      this.look = true;
      this.lookLast = p;
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;

    const doc = this.opts.getDoc();
    const selected = this.opts.getSelectedId?.();
    const hitHandle = selected ? this.#hitHandle(doc, selected, p.x, p.y) : null;
    if (hitHandle) {
      this.opts.beginUndo?.();
      const obj = activeMap(doc).objects.find((o) => o.id === selected);
      this.drag = {
        kind: hitHandle.kind,
        axis: hitHandle.axis,
        corner: hitHandle.corner,
        start: p,
        orig: { ...obj },
        grab: hitHandle.world,
      };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const hit = this.#pick(doc, p.x, p.y);
    this.opts.onSelect?.(hit?.id || null);
    if (hit) {
      this.opts.beginUndo?.();
      const obj = activeMap(doc).objects.find((o) => o.id === hit.id);
      this.drag = {
        kind: "move",
        start: p,
        orig: { ...obj },
        grab: hit.point,
        planeN: lookVectors(this.camera.yaw, this.camera.pitch).forward,
      };
      this.canvas.setPointerCapture(e.pointerId);
    }
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    if (this.look) {
      const dx = p.x - this.lookLast.x;
      const dy = p.y - this.lookLast.y;
      this.lookLast = p;
      this.camera.yaw += dx * 0.008;
      this.camera.pitch = Math.max(-1.4, Math.min(1.4, this.camera.pitch - dy * 0.008));
      return;
    }
    if (this.drag) {
      this.#applyDrag(p);
      this.opts.onChange?.();
      return;
    }
    const doc = this.opts.getDoc();
    this.hoverId = this.#pick(doc, p.x, p.y)?.id || null;
  }

  #onUp(e) {
    if (!this.enabled) return;
    if (this.look) this.look = false;
    if (this.drag) {
      this.drag = null;
      this.opts.endUndo?.();
    }
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
  }

  #applyDrag(p) {
    const doc = this.opts.getDoc();
    const obj = activeMap(doc).objects.find((o) => o.id === this.drag.orig.id);
    if (!obj) return;
    const ray = screenRay(p.x, p.y, this.camera, this.cssW, this.cssH);
    const orig = this.drag.orig;

    if (this.drag.kind === "move") {
      const hit = intersectPlane(ray.origin, ray.dir, this.drag.grab, this.drag.planeN);
      if (!hit) return;
      const dx = Math.round(hit.point.x - this.drag.grab.x);
      const dy = Math.round(hit.point.y - this.drag.grab.y);
      const dz = Math.round(hit.point.z - this.drag.grab.z);
      obj.x = orig.x + dx;
      obj.y = orig.y + dy;
      obj.z = orig.z + dz;
      clampObject(obj);
      return;
    }

    if (this.drag.kind === "axis") {
      const axis = this.drag.axis;
      const n = { x: 0, y: 0, z: 0 };
      if (axis === "x") n.y = 1;
      else if (axis === "y") n.x = 1;
      else n.y = 1;
      const hit = intersectPlane(ray.origin, ray.dir, this.drag.grab, n);
      if (!hit) return;
      const delta = Math.round(hit.point[axis] - this.drag.grab[axis]);
      obj[axis] = orig[axis] + delta;
      clampObject(obj);
      return;
    }

    if (this.drag.kind === "scale") {
      const def = KINDS[obj.kind];
      if (def.fixed) return;
      const c = this.drag.corner;
      const opp = { x: c[0] ? orig.x : orig.x + orig.sx, y: c[1] ? orig.y : orig.y + orig.sy, z: c[2] ? orig.z : orig.z + orig.sz };
      const hit = intersectPlane(
        ray.origin,
        ray.dir,
        this.drag.grab,
        lookVectors(this.camera.yaw, this.camera.pitch).forward
      );
      if (!hit) return;
      const px = Math.round(hit.point.x);
      const py = Math.round(hit.point.y);
      const pz = Math.round(hit.point.z);
      const x0 = Math.min(opp.x, px);
      const y0 = Math.min(opp.y, py);
      const z0 = Math.min(opp.z, pz);
      const x1 = Math.max(opp.x, px);
      const y1 = Math.max(opp.y, py);
      const z1 = Math.max(opp.z, pz);
      obj.x = x0;
      obj.y = y0;
      obj.z = z0;
      obj.sx = Math.max(1, x1 - x0);
      obj.sy = Math.max(1, y1 - y0);
      obj.sz = Math.max(1, z1 - z0);
      clampObject(obj);
    }
  }

  #visibleObjects(doc) {
    const local = this.opts.getLocalMode?.() || false;
    const cam = this.camera;
    return activeMap(doc).objects.filter((o) => objectVisible(doc, o, cam, local));
  }

  #pick(doc, mx, my) {
    const ray = screenRay(mx, my, this.camera, this.cssW, this.cssH);
    let best = null;
    for (const obj of this.#visibleObjects(doc)) {
      const hit = rayAabb(ray.origin, ray.dir, obj);
      if (!hit) continue;
      if (!best || hit.t < best.t) best = { id: obj.id, t: hit.t, point: hit.point };
    }
    return best;
  }

  #hitHandle(doc, id, mx, my) {
    const obj = activeMap(doc).objects.find((o) => o.id === id);
    if (!obj) return null;
    const cam = this.camera;
    const w = this.cssW;
    const h = this.cssH;
    const c = aabbCenter(obj);
    const axes = [
      { axis: "x", p: { x: c.x + 8, y: c.y, z: c.z } },
      { axis: "y", p: { x: c.x, y: c.y + 8, z: c.z } },
      { axis: "z", p: { x: c.x, y: c.y, z: c.z + 8 } },
    ];
    const pc = projectPoint(c, cam, w, h);
    for (const a of axes) {
      const pa = projectPoint(a.p, cam, w, h);
      if (!pc.ok || !pa.ok) continue;
      if (distPointToSegment2d(mx, my, pc.sx, pc.sy, pa.sx, pa.sy) < 8) {
        return { kind: "axis", axis: a.axis, world: c };
      }
    }
    if (!KINDS[obj.kind].fixed) {
      for (let i = 0; i < 8; i++) {
        const cw = cornerWorld(obj, i);
        const pr = projectPoint(cw, cam, w, h);
        if (!pr.ok) continue;
        if (Math.hypot(mx - pr.sx, my - pr.sy) < HANDLE) {
          return { kind: "scale", corner: BOX_CORNERS[i], world: cw };
        }
      }
    }
    return null;
  }

  placeInFront(kind) {
    const { forward } = lookVectors(this.camera.yaw, this.camera.pitch);
    const dist = 12;
    return {
      x: Math.round(this.camera.x + forward.x * dist),
      y: Math.max(0, Math.round(this.camera.y + forward.y * dist - 3)),
      z: Math.round(this.camera.z + forward.z * dist),
    };
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const doc = this.opts.getDoc();
    const cam = this.camera;
    const selected = this.opts.getSelectedId?.();
    const local = this.opts.getLocalMode?.() || false;

    this.#drawGrid(ctx, cam, w, h);

    const objs = [...this.#visibleObjects(doc)].sort((a, b) => {
      const ca = aabbCenter(a);
      const cb = aabbCenter(b);
      const da = (ca.x - cam.x) ** 2 + (ca.y - cam.y) ** 2 + (ca.z - cam.z) ** 2;
      const db = (cb.x - cam.x) ** 2 + (cb.y - cam.y) ** 2 + (cb.z - cam.z) ** 2;
      return db - da;
    });

    for (const obj of objs) {
      const hi = obj.id === selected || obj.id === this.hoverId;
      this.#drawObject(ctx, obj, cam, w, h, hi, obj.id === selected);
    }

    ctx.fillStyle = "#8b91a0";
    ctx.font = "11px Segoe UI, sans-serif";
    ctx.fillText(
      `xyz ${cam.x | 0},${cam.y | 0},${cam.z | 0}  ${local ? "LOCAL" : "ALL"}  spd ${cam.speed | 0}`,
      8,
      16
    );
  }

  #drawGrid(ctx, cam, w, h) {
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#3d4658";
    for (let i = 0; i <= WORLD_SIZE; i += 8) {
      this.#line3(ctx, { x: i, y: 0, z: 0 }, { x: i, y: 0, z: WORLD_SIZE }, cam, w, h);
      this.#line3(ctx, { x: 0, y: 0, z: i }, { x: WORLD_SIZE, y: 0, z: i }, cam, w, h);
    }
    ctx.strokeStyle = "#6a7388";
    for (let i = 0; i <= WORLD_SIZE; i += 32) {
      this.#line3(ctx, { x: i, y: 0, z: 0 }, { x: i, y: 0, z: WORLD_SIZE }, cam, w, h);
      this.#line3(ctx, { x: 0, y: 0, z: i }, { x: WORLD_SIZE, y: 0, z: i }, cam, w, h);
    }
    ctx.strokeStyle = "#9aa3b5";
    this.#line3(ctx, { x: 0, y: 0, z: 0 }, { x: WORLD_SIZE, y: 0, z: 0 }, cam, w, h);
    this.#line3(ctx, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: WORLD_SIZE }, cam, w, h);
    this.#line3(ctx, { x: 0, y: 0, z: 0 }, { x: 0, y: WORLD_SIZE, z: 0 }, cam, w, h);
  }

  #line3(ctx, a, b, cam, w, h, color) {
    const seg = projectLine(a, b, cam, w, h);
    if (!seg) return;
    if (color) ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  #drawObject(ctx, obj, cam, w, h, highlight, selected) {
    const color = highlight ? "#f2d36b" : KINDS[obj.kind].color;
    ctx.lineWidth = selected ? 2 : 1;
    ctx.strokeStyle = color;
    for (const [i, j] of BOX_EDGES) {
      this.#line3(ctx, cornerWorld(obj, i), cornerWorld(obj, j), cam, w, h);
    }
    this.#drawGlyphs(ctx, obj, cam, w, h, color);
    if (selected) this.#drawGizmo(ctx, obj, cam, w, h);
  }

  #drawGlyphs(ctx, obj, cam, w, h, color) {
    ctx.strokeStyle = color;
    if (obj.kind === "crate") {
      const f = faceCorners(obj.face || "+z");
      this.#line3(ctx, cornerWorld(obj, f[0]), cornerWorld(obj, f[2]), cam, w, h);
      this.#line3(ctx, cornerWorld(obj, f[1]), cornerWorld(obj, f[3]), cam, w, h);
    }
    if (obj.kind === "doorway") {
      const f = faceCorners(obj.face);
      this.#line3(ctx, cornerWorld(obj, f[0]), cornerWorld(obj, f[2]), cam, w, h);
    }
    if (obj.kind === "switch") {
      const f = faceCorners(obj.face);
      const a = cornerWorld(obj, f[0]);
      const b = cornerWorld(obj, f[1]);
      const c = cornerWorld(obj, f[2]);
      const d = cornerWorld(obj, f[3]);
      const apex = {
        x: (a.x + b.x + c.x + d.x) / 4,
        y: Math.max(a.y, b.y, c.y, d.y),
        z: (a.z + b.z + c.z + d.z) / 4,
      };
      const left = {
        x: (a.x + d.x) / 2,
        y: (a.y + d.y) / 2,
        z: (a.z + d.z) / 2,
      };
      const right = {
        x: (b.x + c.x) / 2,
        y: (b.y + c.y) / 2,
        z: (b.z + c.z) / 2,
      };
      this.#line3(ctx, apex, left, cam, w, h);
      this.#line3(ctx, left, right, cam, w, h);
      this.#line3(ctx, right, apex, cam, w, h);
    }
    if (obj.kind === "slope") {
      const lowY = obj.y;
      const highY = obj.y + obj.sy;
      let p0, p1, p2, p3;
      if (obj.axis === "x") {
        const x0 = obj.dir === 1 ? obj.x : obj.x + obj.sx;
        const x1 = obj.dir === 1 ? obj.x + obj.sx : obj.x;
        p0 = { x: x0, y: lowY, z: obj.z };
        p1 = { x: x0, y: lowY, z: obj.z + obj.sz };
        p2 = { x: x1, y: highY, z: obj.z + obj.sz };
        p3 = { x: x1, y: highY, z: obj.z };
      } else {
        const z0 = obj.dir === 1 ? obj.z : obj.z + obj.sz;
        const z1 = obj.dir === 1 ? obj.z + obj.sz : obj.z;
        p0 = { x: obj.x, y: lowY, z: z0 };
        p1 = { x: obj.x + obj.sx, y: lowY, z: z0 };
        p2 = { x: obj.x + obj.sx, y: highY, z: z1 };
        p3 = { x: obj.x, y: highY, z: z1 };
      }
      this.#line3(ctx, p0, p1, cam, w, h);
      this.#line3(ctx, p1, p2, cam, w, h);
      this.#line3(ctx, p2, p3, cam, w, h);
      this.#line3(ctx, p3, p0, cam, w, h);
      this.#line3(ctx, p0, p2, cam, w, h);
    }
  }

  #drawGizmo(ctx, obj, cam, w, h) {
    const c = aabbCenter(obj);
    this.#line3(ctx, c, { x: c.x + 8, y: c.y, z: c.z }, cam, w, h, "#e55");
    this.#line3(ctx, c, { x: c.x, y: c.y + 8, z: c.z }, cam, w, h, "#5e5");
    this.#line3(ctx, c, { x: c.x, y: c.y, z: c.z + 8 }, cam, w, h, "#55e");
    if (KINDS[obj.kind].fixed) return;
    ctx.fillStyle = "#f2d36b";
    for (let i = 0; i < 8; i++) {
      const pr = projectPoint(cornerWorld(obj, i), cam, w, h);
      if (!pr.ok) continue;
      ctx.fillRect(pr.sx - 3, pr.sy - 3, 6, 6);
    }
  }
}

// ---- js/overheadView.js ----
class OverheadView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(canvas.parentElement);
    this.resize();
  }

  resize() {
    const parent = this.canvas.parentElement;
    const rect = parent.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  draw() {
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const pad = 8;
    const side = Math.min(w, h) - pad * 2;
    const ox = (w - side) / 2;
    const oy = (h - side) / 2;
    const s = side / WORLD_SIZE;

    ctx.strokeStyle = "#8b91a0";
    ctx.strokeRect(ox, oy, side, side);
    ctx.strokeStyle = "#3d4658";
    for (let i = 0; i <= WORLD_SIZE; i += 8) {
      ctx.beginPath();
      ctx.moveTo(ox + i * s, oy);
      ctx.lineTo(ox + i * s, oy + side);
      ctx.moveTo(ox, oy + i * s);
      ctx.lineTo(ox + side, oy + i * s);
      ctx.stroke();
    }
    ctx.strokeStyle = "#6a7388";
    for (let i = 0; i <= WORLD_SIZE; i += 32) {
      ctx.beginPath();
      ctx.moveTo(ox + i * s, oy);
      ctx.lineTo(ox + i * s, oy + side);
      ctx.moveTo(ox, oy + i * s);
      ctx.lineTo(ox + side, oy + i * s);
      ctx.stroke();
    }

    const doc = this.opts.getDoc();
    const cam = this.opts.getCamera();
    const local = this.opts.getLocalMode?.() || false;
    const cur = currentRoom(doc, cam);
    const neigh = cur ? neighbourRooms(doc, cur) : [];
    const vis = local ? localVisibleIds(doc, cam) : null;
    const selected = this.opts.getSelectedId?.();

    const toScreen = (x, z) => ({ x: ox + x * s, y: oy + z * s });

    const drawBox = (obj, fill, stroke, lw = 1) => {
      const p = toScreen(obj.x, obj.z);
      ctx.lineWidth = lw;
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fillRect(p.x, p.y, obj.sx * s, obj.sz * s);
      }
      ctx.strokeStyle = stroke;
      ctx.strokeRect(p.x, p.y, obj.sx * s, obj.sz * s);
    };

    for (const obj of activeMap(doc).objects) {
      if (obj.kind !== "room") continue;
      const isCur = cur && obj.id === cur.id;
      const isN = neigh.some((n) => n.id === obj.id);
      const faded = vis && !vis.has(obj.id);
      drawBox(
        obj,
        isCur ? "rgba(212,160,23,0.28)" : isN ? "rgba(90,180,90,0.22)" : "rgba(200,204,212,0.08)",
        faded ? "#333" : KINDS.room.color,
        isCur ? 2 : 1
      );
    }

    for (const obj of activeMap(doc).objects) {
      if (obj.kind === "room") continue;
      const faded = vis && !vis.has(obj.id);
      const col = faded ? "#444" : KINDS[obj.kind].color;
      drawBox(obj, null, obj.id === selected ? "#f2d36b" : col, obj.id === selected ? 2 : 1);
    }

    const { forward } = lookVectors(cam.yaw, cam.pitch);
    const c = toScreen(cam.x, cam.z);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#d4a017";
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x + forward.x * 14, c.y + forward.z * 14);
    ctx.stroke();
  }
}

// ---- js/animView.js ----
const AXIS_LEN = 8;
const AXIS_HIT = 9;
const BOX_CLICK = 4;
const AXIS_COLS = { x: "#e55", y: "#5e5", z: "#55e" };

class AnimView {
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.opts = opts;
    this.orbit = { yaw: 0.5, pitch: 0.15, dist: 48 };
    this.drag = null;
    this.hover = -1;
    this.hoverAxis = null;
    this.enabled = false;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(opts.stage || canvas.parentElement);
    this.resize();

    canvas.addEventListener("pointerdown", (e) => this.#onDown(e));
    canvas.addEventListener("pointermove", (e) => this.#onMove(e));
    canvas.addEventListener("pointerup", (e) => this.#onUp(e));
    canvas.addEventListener("pointerleave", (e) => this.#onUp(e));
    canvas.addEventListener("wheel", (e) => this.#onWheel(e), { passive: false });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  resize() {
    const stage = this.opts.stage || this.canvas.parentElement;
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(64, Math.floor(rect.width));
    const h = Math.max(64, Math.floor(rect.height));
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = w;
    this.cssH = h;
    this.draw();
  }

  #cam() {
    const { yaw, pitch, dist } = this.orbit;
    const { forward } = lookVectors(yaw, pitch);
    return {
      x: -forward.x * dist,
      y: 10 - forward.y * dist,
      z: -forward.z * dist,
      yaw,
      pitch,
    };
  }

  #eventPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * this.cssW,
      y: ((e.clientY - rect.top) / rect.height) * this.cssH,
    };
  }

  #primaryVert() {
    return this.#selectionAnchor();
  }

  #selectedIndices() {
    return this.opts.getSelectedVerts?.() || [];
  }

  #selectionAnchor() {
    const selected = this.#selectedIndices();
    if (!selected.length) return null;
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const verts = enemy.frames[frame];
    if (selected.length === 1) {
      const i = selected[0];
      return { index: i, v: verts[i], indices: selected };
    }
    let x = 0;
    let y = 0;
    let z = 0;
    for (const i of selected) {
      x += verts[i].x;
      y += verts[i].y;
      z += verts[i].z;
    }
    const n = selected.length;
    return { index: selected[selected.length - 1], v: { x: x / n, y: y / n, z: z / n }, indices: selected };
  }

  #axisEnd(v, axis) {
    return {
      x: v.x + (axis === "x" ? AXIS_LEN : 0),
      y: v.y + (axis === "y" ? AXIS_LEN : 0),
      z: v.z + (axis === "z" ? AXIS_LEN : 0),
    };
  }

  #hitVert(mx, my) {
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const cam = this.#cam();
    const verts = enemy.frames[frame];
    let best = -1;
    let bestD = 10;
    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      const d = Math.hypot(mx - p.sx, my - p.sy);
      if (d < bestD) {
        bestD = d;
        best = i;
      }
    });
    return best;
  }

  #hitAxis(mx, my) {
    const prim = this.#primaryVert();
    if (!prim) return null;
    const cam = this.#cam();
    const w = this.cssW;
    const h = this.cssH;
    const pa = projectPoint(prim.v, cam, w, h);
    if (!pa.ok) return null;
    let best = null;
    let bestD = AXIS_HIT;
    for (const axis of ["x", "y", "z"]) {
      const pb = projectPoint(this.#axisEnd(prim.v, axis), cam, w, h);
      if (!pb.ok) continue;
      const d = distPointToSegment2d(mx, my, pa.sx, pa.sy, pb.sx, pb.sy);
      if (d < bestD) {
        bestD = d;
        best = axis;
      }
    }
    return best;
  }

  #onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this.orbit.dist = Math.max(16, Math.min(120, this.orbit.dist + (e.deltaY > 0 ? 4 : -4)));
    this.draw();
  }

  #onDown(e) {
    if (!this.enabled) return;
    this.canvas.focus();
    const p = this.#eventPos(e);
    if (e.button === 2 || e.button === 1) {
      this.drag = { kind: "orbit", last: p };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;

    const axis = this.#hitAxis(p.x, p.y);
    if (axis) {
      const prim = this.#selectionAnchor();
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const verts = enemy.frames[frame];
      this.opts.beginUndo?.();
      this.drag = {
        kind: "axis",
        axis,
        origs: prim.indices.map((i) => ({ i, x: verts[i].x, y: verts[i].y, z: verts[i].z })),
        orig: { x: prim.v.x, y: prim.v.y, z: prim.v.z },
        start: p,
      };
      this.canvas.setPointerCapture(e.pointerId);
      return;
    }

    const vi = this.#hitVert(p.x, p.y);
    if (vi >= 0) {
      const selected = this.opts.getSelectedVerts?.() || [];
      const wasSelected = selected.includes(vi);
      this.opts.onSelectVert?.(vi, e.shiftKey);
      if (!wasSelected && !e.shiftKey) {
        const enemy = this.opts.getEnemy();
        const frame = this.opts.getFrame();
        const v = enemy.frames[frame][vi];
        this.drag = {
          kind: "plane",
          index: vi,
          lock: this.#lockAxis(),
          orig: { x: v.x, y: v.y, z: v.z },
          undoStarted: false,
        };
      } else {
        this.drag = { kind: "select" };
      }
      this.canvas.setPointerCapture(e.pointerId);
      this.draw();
      return;
    }
    this.drag = { kind: "box", start: p, end: p, additive: e.shiftKey };
    this.canvas.setPointerCapture(e.pointerId);
  }

  #onMove(e) {
    if (!this.enabled) return;
    const p = this.#eventPos(e);
    if (!this.drag) {
      this.hoverAxis = this.#hitAxis(p.x, p.y);
      this.hover = this.hoverAxis ? -1 : this.#hitVert(p.x, p.y);
      this.draw();
      return;
    }
    if (this.drag.kind === "orbit") {
      const dx = p.x - this.drag.last.x;
      const dy = p.y - this.drag.last.y;
      this.drag.last = p;
      this.orbit.yaw += dx * 0.01;
      this.orbit.pitch = Math.max(-1.2, Math.min(1.2, this.orbit.pitch - dy * 0.01));
      this.draw();
      return;
    }
    if (this.drag.kind === "box") {
      this.drag.end = p;
      this.draw();
      return;
    }
    if (this.drag.kind === "axis") {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const verts = enemy.frames[frame];
      const cam = this.#cam();
      const orig = this.drag.orig;
      const pa = projectPoint(orig, cam, this.cssW, this.cssH);
      const pb = projectPoint(this.#axisEnd(orig, this.drag.axis), cam, this.cssW, this.cssH);
      if (!pa.ok || !pb.ok) return;
      const ax = pb.sx - pa.sx;
      const ay = pb.sy - pa.sy;
      const alen2 = ax * ax + ay * ay;
      if (alen2 < 16) return;
      const t = ((p.x - this.drag.start.x) * ax + (p.y - this.drag.start.y) * ay) / alen2;
      const delta = Math.round(t * AXIS_LEN);
      for (const o of this.drag.origs) {
        const v = verts[o.i];
        v.x = o.x;
        v.y = o.y;
        v.z = o.z;
        v[this.drag.axis] = clampVert(o[this.drag.axis] + delta);
      }
      this.opts.onChange?.();
      this.draw();
      return;
    }
    if (this.drag.kind === "plane") {
      const enemy = this.opts.getEnemy();
      const frame = this.opts.getFrame();
      const v = enemy.frames[frame][this.drag.index];
      const orig = this.drag.orig;
      const cam = this.#cam();
      const ray = screenRay(p.x, p.y, cam, this.cssW, this.cssH);
      const n = { x: 0, y: 0, z: 0 };
      n[this.drag.lock] = 1;
      const hit = intersectPlane(ray.origin, ray.dir, orig, n);
      if (!hit) return;
      const next = {
        x: this.drag.lock === "x" ? orig.x : clampVert(Math.round(hit.point.x)),
        y: this.drag.lock === "y" ? orig.y : clampVert(Math.round(hit.point.y)),
        z: this.drag.lock === "z" ? orig.z : clampVert(Math.round(hit.point.z)),
      };
      if (next.x === v.x && next.y === v.y && next.z === v.z) return;
      if (!this.drag.undoStarted) {
        this.opts.beginUndo?.();
        this.drag.undoStarted = true;
      }
      v.x = next.x;
      v.y = next.y;
      v.z = next.z;
      this.opts.onChange?.();
      this.draw();
    }
  }

  #lockAxis() {
    const { forward } = lookVectors(this.orbit.yaw, this.orbit.pitch);
    const ax = Math.abs(forward.x);
    const ay = Math.abs(forward.y);
    const az = Math.abs(forward.z);
    if (ax >= ay && ax >= az) return "x";
    if (ay >= az) return "y";
    return "z";
  }

  #boxRect() {
    const a = this.drag.start;
    const b = this.drag.end;
    const x0 = Math.min(a.x, b.x);
    const y0 = Math.min(a.y, b.y);
    const x1 = Math.max(a.x, b.x);
    const y1 = Math.max(a.y, b.y);
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  #vertsInBox(rect) {
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const cam = this.#cam();
    const hits = [];
    enemy.frames[frame].forEach((v, i) => {
      const p = projectPoint(v, cam, this.cssW, this.cssH);
      if (!p.ok) return;
      if (p.sx >= rect.x0 && p.sx <= rect.x1 && p.sy >= rect.y0 && p.sy <= rect.y1) hits.push(i);
    });
    return hits;
  }

  #finishBox() {
    const rect = this.#boxRect();
    const additive = this.drag.additive;
    if (rect.w < BOX_CLICK && rect.h < BOX_CLICK) {
      if (!additive) this.opts.onSelectVerts?.([]);
      return;
    }
    this.opts.onSelectVerts?.(this.#vertsInBox(rect), additive);
  }

  #onUp(e) {
    if (!this.enabled) return;
    if (this.drag?.kind === "box") this.#finishBox();
    if (this.drag?.kind === "axis" || this.drag?.undoStarted) this.opts.endUndo?.();
    this.drag = null;
    try {
      this.canvas.releasePointerCapture(e.pointerId);
    } catch {
      /* ignore */
    }
    this.draw();
  }

  #strokeSeg(ctx, cam, w, h, p0, p1, col, width = 1) {
    const seg = projectLine(p0, p1, cam, w, h);
    if (!seg) return;
    ctx.strokeStyle = col;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(seg.ax, seg.ay);
    ctx.lineTo(seg.bx, seg.by);
    ctx.stroke();
  }

  #drawForwardArrow(ctx, cam, w, h) {
    const y = 0.2;
    const tip = { x: 0, y, z: 14 };
    const col = "#d4a017";
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y, z: 0 }, tip, col, 2.5);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 2.5, y, z: 10 }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: -2.5, y, z: 10 }, col, 2);
    this.#strokeSeg(ctx, cam, w, h, tip, { x: 0, y: 2.5, z: 10 }, col, 2);
    const label = projectPoint({ x: 0, y: 1.5, z: 16 }, cam, w, h);
    if (label.ok) {
      ctx.fillStyle = col;
      ctx.font = "11px Segoe UI, sans-serif";
      ctx.fillText("fwd", label.sx - 10, label.sy);
    }
  }

  #drawGizmo(ctx, cam, w, h, v) {
    for (const axis of ["x", "y", "z"]) {
      const hi = this.hoverAxis === axis || this.drag?.axis === axis;
      const col = hi ? "#fff" : AXIS_COLS[axis];
      this.#strokeSeg(ctx, cam, w, h, v, this.#axisEnd(v, axis), col, hi ? 3 : 2);
      const tip = projectPoint(this.#axisEnd(v, axis), cam, w, h);
      if (tip.ok) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(tip.sx, tip.sy, hi ? 5 : 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  draw() {
    if (!this.enabled) return;
    const ctx = this.ctx;
    const w = this.cssW;
    const h = this.cssH;
    if (!w || !h) return;
    ctx.fillStyle = "#0a0a0c";
    ctx.fillRect(0, 0, w, h);

    const cam = this.#cam();
    const enemy = this.opts.getEnemy();
    const frame = this.opts.getFrame();
    const selected = this.opts.getSelectedVerts?.() || [];
    const verts = enemy.frames[frame];
    let shown = selected;
    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      if (r.w >= BOX_CLICK || r.h >= BOX_CLICK) {
        const hits = this.#vertsInBox(r);
        shown = this.drag.additive ? [...new Set([...selected, ...hits])] : hits;
      }
    }

    ctx.lineWidth = 1;
    for (let i = -24; i <= 24; i += 8) {
      this.#strokeSeg(ctx, cam, w, h, { x: i, y: 0, z: -24 }, { x: i, y: 0, z: 24 }, "#3d4658");
      this.#strokeSeg(ctx, cam, w, h, { x: -24, y: 0, z: i }, { x: 24, y: 0, z: i }, "#3d4658");
    }
    this.#strokeSeg(ctx, cam, w, h, { x: -20, y: 0, z: 0 }, { x: 20, y: 0, z: 0 }, "#a66");
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y: 0, z: 0 }, { x: 0, y: 24, z: 0 }, "#6a6");
    this.#strokeSeg(ctx, cam, w, h, { x: 0, y: 0, z: -20 }, { x: 0, y: 0, z: 20 }, "#66a");
    this.#drawForwardArrow(ctx, cam, w, h);

    ctx.lineWidth = 1.5;
    for (const [i, j] of enemy.lines) {
      this.#strokeSeg(ctx, cam, w, h, verts[i], verts[j], "#c8ccd4", 1.5);
    }

    verts.forEach((v, i) => {
      const p = projectPoint(v, cam, w, h);
      if (!p.ok) return;
      const sel = shown.includes(i);
      const hover = i === this.hover;
      ctx.fillStyle = sel ? "#d4a017" : hover ? "#fff" : "#8b91a0";
      const r = sel ? 5 : 4;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
      ctx.fill();
    });

    const prim = this.#selectionAnchor();
    if (prim) this.#drawGizmo(ctx, cam, w, h, prim.v);

    if (this.drag?.kind === "box") {
      const r = this.#boxRect();
      ctx.fillStyle = "rgba(212, 160, 23, 0.12)";
      ctx.fillRect(r.x0, r.y0, r.w, r.h);
      ctx.strokeStyle = "#d4a017";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.w, r.h);
      ctx.setLineDash([]);
    }

    ctx.fillStyle = "#8b91a0";
    ctx.font = "11px Segoe UI, sans-serif";
    ctx.fillText(
      `${enemy.name} · ${FRAME_NAMES[frame]} · 13 verts · 24 frames`,
      8,
      16
    );
  }
}

// ---- js/main.js ----
const statusEl = document.getElementById("status");
const titleEl = document.querySelector(".toolbar h1");
const btnUndo = document.getElementById("btn-undo");
const btnRedo = document.getElementById("btn-redo");
const UNDO_LIMIT = 40;
const AUTOSAVE_MS = 8000;

let doc = createDefaultDocument();
let editorMode = "layout";
let localDraw = false;
let selectedId = null;
let enemyIndex = 0;
let frameIndex = 0;
let selectedVerts = [];
let dirty = false;
let saving = false;
let autosaveTimer = null;
let undoStack = [];
let redoStack = [];
let undoGesture = false;
let frameClipboard = null;
let animPlaying = false;
let animPlayTimer = null;

const layoutView = new LayoutView(document.getElementById("view-canvas"), {
  stage: document.getElementById("map-stage"),
  getDoc: () => doc,
  getSelectedId: () => selectedId,
  getLocalMode: () => localDraw && editorMode === "layout",
  onSelect: (id) => {
    selectedId = id;
    refreshPanels();
  },
  onChange: () => {
    markDirty();
    refreshPanels();
  },
  onStatus: setStatus,
  beginUndo,
  endUndo,
});

const overheadView = new OverheadView(document.getElementById("overhead-canvas"), {
  getDoc: () => doc,
  getCamera: () => layoutView.camera,
  getSelectedId: () => selectedId,
  getLocalMode: () => localDraw,
});

const animView = new AnimView(document.getElementById("view-canvas"), {
  stage: document.getElementById("map-stage"),
  getEnemy: () => doc.enemies[enemyIndex],
  getFrame: () => frameIndex,
  getSelectedVerts: () => selectedVerts,
  onSelectVert: (i, additive) => {
    if (i < 0) selectedVerts = [];
    else if (additive) {
      if (!selectedVerts.includes(i)) selectedVerts.push(i);
    } else selectedVerts = [i];
    refreshPanels();
  },
  onSelectVerts: (indices, additive) => {
    if (additive) {
      for (const i of indices) {
        if (!selectedVerts.includes(i)) selectedVerts.push(i);
      }
    } else selectedVerts = [...indices];
    refreshPanels();
  },
  onChange: () => {
    markDirty();
    refreshPanels();
  },
  beginUndo,
  endUndo,
});

function setStatus(msg, isError = false) {
  statusEl.textContent = msg || "";
  statusEl.classList.toggle("error", isError);
}

function updateDirtyIndicator() {
  const star = dirty ? "*" : "";
  if (titleEl) titleEl.textContent = `Quake64${star}`;
  document.title = dirty ? "Quake64 *" : "Quake64 Editor";
}

function markDirty() {
  if (!dirty) {
    dirty = true;
    updateDirtyIndicator();
  }
  scheduleAutosave();
}

function markClean() {
  dirty = false;
  updateDirtyIndicator();
  clearAutosaveTimer();
}

function clearAutosaveTimer() {
  if (autosaveTimer) {
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
  }
}

function isEditingField(el = document.activeElement) {
  return (
    el instanceof HTMLInputElement ||
    el instanceof HTMLTextAreaElement ||
    el instanceof HTMLSelectElement ||
    !!el?.isContentEditable
  );
}

function scheduleAutosave() {
  clearAutosaveTimer();
  if (!dirty || isEditingField()) return;
  autosaveTimer = setTimeout(() => {
    autosaveTimer = null;
    void runAutosave();
  }, AUTOSAVE_MS);
}

async function runAutosave() {
  if (!dirty || saving || !hasDocFileHandle()) return;
  if (isEditingField()) {
    scheduleAutosave();
    return;
  }
  await saveNow("Autosaved");
}

document.addEventListener("focusin", (e) => {
  if (isEditingField(e.target)) clearAutosaveTimer();
});
document.addEventListener("focusout", () => {
  requestAnimationFrame(() => {
    if (dirty && !isEditingField()) scheduleAutosave();
  });
});

async function saveNow(okMsg = "Saved") {
  if (saving) return;
  saving = true;
  try {
    const how = hasDocFileHandle()
      ? await autosaveDocJSON(doc)
      : await saveDocJSON(doc, DEFAULT_DOC_PATH);
    if (!how) {
      setStatus("Save cancelled", true);
      return;
    }
    markClean();
    setStatus(`${okMsg} ${docFileName()}`);
  } catch (err) {
    setStatus(String(err.message || err), true);
    scheduleAutosave();
  } finally {
    saving = false;
  }
}

function snapshot() {
  return JSON.stringify(doc);
}

function beginUndo() {
  if (undoGesture) return;
  undoStack.push(snapshot());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  undoGesture = true;
  updateUndoButtons();
}

function endUndo() {
  undoGesture = false;
}

function pushUndo() {
  beginUndo();
  endUndo();
}

function restore(json) {
  doc = normalizeDocument(JSON.parse(json));
  selectedId = null;
  selectedVerts = [];
  if (enemyIndex >= doc.enemies.length) enemyIndex = 0;
  markDirty();
  refreshAll();
}

function clearUndoHistory() {
  undoStack.length = 0;
  redoStack.length = 0;
  undoGesture = false;
  updateUndoButtons();
}

function undo() {
  if (!undoStack.length) return;
  endUndo();
  redoStack.push(snapshot());
  restore(undoStack.pop());
  updateUndoButtons();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
  updateUndoButtons();
}

function updateUndoButtons() {
  btnUndo.disabled = undoStack.length === 0;
  btnRedo.disabled = redoStack.length === 0;
}

function activeEnemy() {
  return doc.enemies[enemyIndex];
}

function setMode(mode) {
  editorMode = mode;
  document.getElementById("btn-mode-layout").classList.toggle("active", mode === "layout");
  document.getElementById("btn-mode-anim").classList.toggle("active", mode === "anim");
  document.getElementById("layout-left").hidden = mode !== "layout";
  document.getElementById("anim-left").hidden = mode !== "anim";
  document.getElementById("draw-mode-group").hidden = mode !== "layout";
  document.getElementById("overhead-panel").hidden = mode !== "layout";
  document.getElementById("center-title").textContent =
    mode === "layout" ? `Map ${doc.activeLevel}` : "Enemy";
  document.getElementById("hint").textContent =
    mode === "layout"
      ? "Click canvas · WASD fly along look · Q/E camera up · RMB look · LMB move · R face · Del delete"
      : "LMB box-select verts · click-drag unselected on camera plane · gizmo moves selection · X/Y/Z nudge · [ ] frames · RMB orbit";
  layoutView.enabled = mode === "layout";
  animView.enabled = mode === "anim";
  if (mode !== "anim") stopAnimPlay();
  refreshAll();
}

function setDrawMode(local) {
  localDraw = local;
  document.getElementById("btn-draw-all").classList.toggle("active", !local);
  document.getElementById("btn-draw-local").classList.toggle("active", local);
  const cam = layoutView.camera;
  const room = currentRoom(doc, cam);
  if (local && !room) setStatus("Local: camera is not inside a room", true);
  else setStatus(local ? "Local draw" : "All rooms");
  refreshAll();
}

function buildPalette() {
  const root = document.getElementById("item-palette");
  root.innerHTML = "";
  for (const kind of PALETTE_ORDER) {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "palette-item";
    el.textContent = KINDS[kind].label;
    el.style.borderColor = KINDS[kind].color;
    el.addEventListener("click", () => placeKind(kind));
    root.appendChild(el);
  }
}

function placeKind(kind) {
  pushUndo();
  const p = layoutView.placeInFront(kind);
  const obj = createObject(kind, p.x, p.y, p.z);
  obj.y = Math.max(0, obj.y);
  clampObject(obj);
  activeMap(doc).objects.push(obj);
  selectedId = obj.id;
  markDirty();
  refreshAll();
}

function selectedObject() {
  return activeMap(doc).objects.find((o) => o.id === selectedId) || null;
}

function deleteSelected() {
  if (editorMode === "layout") {
    if (!selectedId) return;
    pushUndo();
    activeMap(doc).objects = activeMap(doc).objects.filter((o) => o.id !== selectedId);
    selectedId = null;
    markDirty();
    refreshAll();
    return;
  }
  const e = activeEnemy();
  if (selectedVerts.length === 1) {
    /* keep verts; topology stays */
  }
}

function duplicateSelected() {
  const obj = selectedObject();
  if (!obj) return;
  pushUndo();
  const copy = clampObject({ ...obj, id: uid(), x: obj.x + 2, z: obj.z + 2 });
  activeMap(doc).objects.push(copy);
  selectedId = copy.id;
  markDirty();
  refreshAll();
}

function switchLevel(name) {
  if (!LEVEL_NAMES.includes(name) || name === doc.activeLevel) return;
  doc.activeLevel = name;
  selectedId = null;
  markDirty();
  if (editorMode === "layout") {
    document.getElementById("center-title").textContent = `Map ${doc.activeLevel}`;
  }
  refreshAll();
  setStatus(name);
}

function renderLevelList() {
  const root = document.getElementById("level-list");
  if (!root) return;
  root.classList.add("level-list");
  root.innerHTML = "";
  const title = document.createElement("h2");
  title.textContent = "Levels";
  root.appendChild(title);
  const ul = document.createElement("ul");
  for (const name of LEVEL_NAMES) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = name;
    if (name === doc.activeLevel) btn.className = "active";
    btn.addEventListener("click", () => switchLevel(name));
    li.appendChild(btn);
    ul.appendChild(li);
  }
  root.appendChild(ul);
}

function renderObjectList() {
  const ul = document.getElementById("object-list");
  ul.innerHTML = "";
  for (const obj of activeMap(doc).objects) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = `${KINDS[obj.kind].label}  ${obj.x},${obj.y},${obj.z}`;
    if (obj.id === selectedId) btn.className = "active";
    btn.addEventListener("click", () => {
      selectedId = obj.id;
      refreshPanels();
    });
    li.appendChild(btn);
    ul.appendChild(li);
  }
}

function renderEnemyList() {
  const ul = document.getElementById("enemy-list");
  ul.innerHTML = "";
  doc.enemies.forEach((e, i) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = e.name;
    if (i === enemyIndex) btn.className = "active";
    btn.addEventListener("click", () => {
      enemyIndex = i;
      selectedVerts = [];
      refreshAll();
    });
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

function field(label, input) {
  const row = document.createElement("label");
  row.className = "field";
  const span = document.createElement("span");
  span.textContent = label;
  row.append(span, input);
  return row;
}

function vec3Field(label, specs) {
  const row = document.createElement("label");
  row.className = "field vec3";
  const span = document.createElement("span");
  span.textContent = label;
  const wrap = document.createElement("div");
  wrap.className = "vec3-inputs";
  for (const s of specs) {
    wrap.appendChild(numInput(s.value, s.onChange, s.min, s.max));
  }
  row.append(span, wrap);
  return row;
}

function numInput(value, onChange, min, max) {
  const inp = document.createElement("input");
  inp.type = "number";
  inp.value = String(value);
  if (min != null) inp.min = String(min);
  if (max != null) inp.max = String(max);
  inp.addEventListener("change", () => onChange(Number(inp.value)));
  return inp;
}

function renderInspector() {
  const root = document.getElementById("right-editors");
  root.innerHTML = "";
  if (editorMode === "layout") {
    const obj = selectedObject();
    const h = document.createElement("h2");
    h.textContent = obj ? KINDS[obj.kind].label : "Inspector";
    root.appendChild(h);
    if (!obj) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "Select an object or place one from the palette.";
      root.appendChild(p);
      return;
    }
    const apply = (fn) => {
      pushUndo();
      fn();
      clampObject(obj);
      markDirty();
      refreshAll();
    };
    root.appendChild(
      vec3Field("XYZ", [
        { value: obj.x, onChange: (v) => apply(() => (obj.x = v)), min: 0, max: 255 },
        { value: obj.y, onChange: (v) => apply(() => (obj.y = v)), min: 0, max: 255 },
        { value: obj.z, onChange: (v) => apply(() => (obj.z = v)), min: 0, max: 255 },
      ])
    );
    if (!KINDS[obj.kind].fixed) {
      root.appendChild(
        vec3Field("Size", [
          { value: obj.sx, onChange: (v) => apply(() => (obj.sx = v)), min: 1, max: 256 },
          { value: obj.sy, onChange: (v) => apply(() => (obj.sy = v)), min: 1, max: 256 },
          { value: obj.sz, onChange: (v) => apply(() => (obj.sz = v)), min: 1, max: 256 },
        ])
      );
    } else {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = `Fixed size ${obj.sx}×${obj.sy}×${obj.sz}`;
      root.appendChild(p);
    }
    if (obj.kind === "doorway" || obj.kind === "switch" || obj.kind === "crate") {
      const sel = document.createElement("select");
      for (const f of ["+z", "-z", "+x", "-x"]) {
        const opt = document.createElement("option");
        opt.value = f;
        opt.textContent = f;
        if (obj.face === f) opt.selected = true;
        sel.appendChild(opt);
      }
      sel.addEventListener("change", () => apply(() => (obj.face = sel.value)));
      root.appendChild(field("Face", sel));
    }
    if (obj.kind === "slope") {
      const axis = document.createElement("select");
      for (const a of ["x", "z"]) {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a.toUpperCase();
        if (obj.axis === a) opt.selected = true;
        axis.appendChild(opt);
      }
      axis.addEventListener("change", () => apply(() => (obj.axis = axis.value)));
      root.appendChild(field("Axis", axis));
      const dir = document.createElement("select");
      for (const d of [1, -1]) {
        const opt = document.createElement("option");
        opt.value = String(d);
        opt.textContent = d === 1 ? "+ run" : "− run";
        if (obj.dir === d) opt.selected = true;
        dir.appendChild(opt);
      }
      dir.addEventListener("change", () => apply(() => (obj.dir = Number(dir.value))));
      root.appendChild(field("Dir", dir));
    }
    const row = document.createElement("div");
    row.className = "btn-row";
    const dup = document.createElement("button");
    dup.type = "button";
    dup.textContent = "Duplicate";
    dup.addEventListener("click", duplicateSelected);
    const del = document.createElement("button");
    del.type = "button";
    del.className = "danger";
    del.textContent = "Delete";
    del.addEventListener("click", deleteSelected);
    row.append(dup, del);
    root.appendChild(row);
    return;
  }

  const e = activeEnemy();
  const h = document.createElement("h2");
  h.textContent = e.name;
  root.appendChild(h);
  const name = document.createElement("input");
  name.type = "text";
  name.value = e.name;
  name.addEventListener("change", () => {
    pushUndo();
    e.name = name.value.slice(0, 24) || "Enemy";
    markDirty();
    refreshAll();
  });
  root.appendChild(field("Name", name));

  const strip = document.createElement("div");
  strip.className = "frame-strip";
  FRAME_NAMES.forEach((n, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = n;
    if (i === frameIndex) b.className = "active";
    b.addEventListener("click", () => {
      frameIndex = i;
      refreshAll();
    });
    strip.appendChild(b);
  });
  root.appendChild(strip);

  const counts = document.createElement("p");
  counts.className = "muted";
  const clip = clipForFrame(frameIndex);
  const height = frameHeight(e.frames[frameIndex]);
  counts.textContent = `13 verts · 13 lines · ${clip.name} · height ${height} · 24 frames`;
  root.appendChild(counts);

  const scaleRow = document.createElement("label");
  scaleRow.className = "field";
  const scaleLbl = document.createElement("span");
  scaleLbl.textContent = "Scale";
  const scaleInp = document.createElement("input");
  scaleInp.type = "number";
  scaleInp.step = "0.1";
  scaleInp.placeholder = "1.0";
  scaleInp.title = "Scale this frame, then clears";
  scaleInp.addEventListener("change", () => {
    scaleCurrentFrame(Number(scaleInp.value));
    scaleInp.value = "";
  });
  scaleRow.append(scaleLbl, scaleInp);
  root.appendChild(scaleRow);

  const editRow = document.createElement("div");
  editRow.className = "btn-row";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.textContent = "Copy frame";
  copyBtn.addEventListener("click", copyFrame);
  const pasteBtn = document.createElement("button");
  pasteBtn.type = "button";
  pasteBtn.textContent = "Paste frame";
  pasteBtn.disabled = !frameClipboard;
  pasteBtn.addEventListener("click", pasteFrame);
  const flipBtn = document.createElement("button");
  flipBtn.type = "button";
  flipBtn.textContent = "Flip";
  flipBtn.title = "Mirror this frame on X; weapon stays on the right wrist";
  flipBtn.addEventListener("click", flipCurrentFrame);
  editRow.append(copyBtn, pasteBtn, flipBtn);
  root.appendChild(editRow);

  if (selectedVerts.length === 1) {
    const vi = selectedVerts[0];
    const v = e.frames[frameIndex][vi];
    const setC = (k, val) => {
      pushUndo();
      v[k] = clampVert(val);
      markDirty();
      refreshAll();
    };
    root.appendChild(
      vec3Field("XYZ", [
        { value: v.x, onChange: (n) => setC("x", n), min: -64, max: 63 },
        { value: v.y, onChange: (n) => setC("y", n), min: -64, max: 63 },
        { value: v.z, onChange: (n) => setC("z", n), min: -64, max: 63 },
      ])
    );
  }

  const row = document.createElement("div");
  row.className = "btn-row";
  const playBtn = document.createElement("button");
  playBtn.type = "button";
  playBtn.textContent = animPlaying ? "Pause" : "Play";
  if (animPlaying) playBtn.className = "active";
  playBtn.addEventListener("click", toggleAnimPlay);
  const prev = document.createElement("button");
  prev.type = "button";
  prev.textContent = "Prev frame";
  prev.addEventListener("click", () => stepFrame(-1));
  const next = document.createElement("button");
  next.type = "button";
  next.textContent = "Next frame";
  next.addEventListener("click", () => stepFrame(1));
  row.append(playBtn, prev, next);
  root.appendChild(row);
}

function frameHeight(verts) {
  let maxY = -Infinity;
  for (const v of verts) {
    if (v.y > maxY) maxY = v.y;
  }
  return Number.isFinite(maxY) ? maxY : 0;
}

function stepFrame(d) {
  frameIndex = (frameIndex + d + FRAME_NAMES.length) % FRAME_NAMES.length;
  refreshAll();
}

function scaleCurrentFrame(factor) {
  if (!Number.isFinite(factor) || factor === 0) {
    setStatus("Enter a non-zero scale", true);
    return;
  }
  const e = activeEnemy();
  const fr = e.frames[frameIndex];
  pushUndo();
  for (const v of fr) {
    v.x = clampVert(Math.round(v.x * factor));
    v.y = clampVert(Math.round(v.y * factor));
    v.z = clampVert(Math.round(v.z * factor));
  }
  markDirty();
  refreshAll();
  setStatus(`Scaled ${FRAME_NAMES[frameIndex]} × ${factor}`);
}

function copyFrame() {
  const fr = activeEnemy().frames[frameIndex];
  frameClipboard = fr.map((v) => ({ x: v.x, y: v.y, z: v.z }));
  setStatus(`Copied ${FRAME_NAMES[frameIndex]}`);
  refreshPanels();
}

function pasteFrame() {
  if (!frameClipboard) {
    setStatus("Copy a frame first", true);
    return;
  }
  const fr = activeEnemy().frames[frameIndex];
  pushUndo();
  for (let i = 0; i < fr.length; i++) {
    const src = frameClipboard[i] || fr[i];
    fr[i].x = clampVert(src.x);
    fr[i].y = clampVert(src.y);
    fr[i].z = clampVert(src.z);
  }
  markDirty();
  refreshAll();
  setStatus(`Pasted onto ${FRAME_NAMES[frameIndex]}`);
}

function flipCurrentFrame() {
  const e = activeEnemy();
  pushUndo();
  flipFrameX(e.frames[frameIndex]);
  markDirty();
  refreshAll();
  setStatus(`Flipped ${FRAME_NAMES[frameIndex]} on X`);
}

function stopAnimPlay() {
  animPlaying = false;
  if (animPlayTimer) {
    clearInterval(animPlayTimer);
    animPlayTimer = null;
  }
}

function toggleAnimPlay() {
  if (animPlaying) {
    stopAnimPlay();
    refreshPanels();
    setStatus("Paused");
    return;
  }
  animPlaying = true;
  animPlayTimer = setInterval(tickAnimPlay, 500);
  refreshPanels();
  setStatus(`Playing ${clipForFrame(frameIndex).name}`);
}

function tickAnimPlay() {
  if (editorMode !== "anim") {
    stopAnimPlay();
    return;
  }
  const clip = clipForFrame(frameIndex);
  const local = frameIndex - clip.start;
  frameIndex = clip.start + ((local + 1) % clip.len);
  refreshAll();
}

function nudgeVert(axis, delta) {
  const e = activeEnemy();
  const idxs = selectedVerts.length ? selectedVerts : [];
  if (!idxs.length) {
    setStatus("Select a vertex first", true);
    return;
  }
  pushUndo();
  for (const i of idxs) {
    const v = e.frames[frameIndex][i];
    v[axis] = clampVert(v[axis] + delta);
  }
  markDirty();
  refreshAll();
}

function refreshPanels() {
  renderLevelList();
  renderObjectList();
  renderEnemyList();
  renderInspector();
  overheadView.draw();
  if (editorMode === "anim") animView.draw();
}

function refreshAll() {
  refreshPanels();
  if (editorMode === "layout") layoutView.draw();
  else animView.draw();
}

document.getElementById("btn-mode-layout").addEventListener("click", () => setMode("layout"));
document.getElementById("btn-mode-anim").addEventListener("click", () => setMode("anim"));
document.getElementById("btn-draw-all").addEventListener("click", () => setDrawMode(false));
document.getElementById("btn-draw-local").addEventListener("click", () => setDrawMode(true));
document.getElementById("btn-undo").addEventListener("click", undo);
document.getElementById("btn-redo").addEventListener("click", redo);
document.getElementById("btn-save").addEventListener("click", async () => {
  await saveNow("Saved");
});

function applyLoadedDoc(loaded) {
  doc = normalizeDocument(loaded);
  selectedId = null;
  selectedVerts = [];
  enemyIndex = 0;
  frameIndex = 0;
  clearUndoHistory();
  markClean();
  refreshAll();
  setStatus(`Loaded ${docFileName()}`);
}

function showFileAccessGate(storedHandle) {
  const overlay = document.createElement("div");
  overlay.className = "file-gate";
  overlay.innerHTML = `
    <div class="file-gate-card" role="dialog" aria-modal="true" aria-labelledby="file-gate-title">
      <h2 id="file-gate-title">Open map file</h2>
      <p class="muted">
        ${
          storedHandle
            ? `Browser needs permission to read/write <strong>${storedHandle.name}</strong>.`
            : `Choose project file <strong>${DEFAULT_DOC_PATH}</strong> (usually in the editor folder).`
        }
      </p>
      <div class="btn-row">
        <button type="button" class="file-gate-primary" id="file-gate-ok">
          ${storedHandle ? `Allow ${storedHandle.name}` : `Open ${DEFAULT_DOC_PATH}…`}
        </button>
        ${storedHandle ? `<button type="button" id="file-gate-other">Choose different file…</button>` : ""}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const ok = overlay.querySelector("#file-gate-ok");
  const other = overlay.querySelector("#file-gate-other");
  ok.focus();

  const finish = async (loader) => {
    ok.disabled = true;
    if (other) other.disabled = true;
    try {
      const loaded = await loader();
      if (!loaded) {
        ok.disabled = false;
        if (other) other.disabled = false;
        setStatus("Open cancelled", true);
        return;
      }
      overlay.remove();
      applyLoadedDoc(loaded);
    } catch (err) {
      ok.disabled = false;
      if (other) other.disabled = false;
      setStatus(String(err.message || err), true);
    }
  };

  ok.addEventListener("click", () => {
    void finish(() =>
      storedHandle ? allowStoredDocFile(storedHandle) : loadDocJSON()
    );
  });
  other?.addEventListener("click", () => {
    void finish(() => loadDocJSON());
  });
}

document.getElementById("btn-load").addEventListener("click", async () => {
  try {
    const loaded = await loadDocJSON();
    if (!loaded) return;
    applyLoadedDoc(loaded);
  } catch (err) {
    setStatus(String(err.message || err), true);
  }
});

window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    void saveNow("Saved");
    return;
  }
  if (e.target.matches("input, select, textarea")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    if (e.shiftKey) redo();
    else undo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
    e.preventDefault();
    redo();
    return;
  }
  if (e.key === "Delete" || e.key === "Backspace") {
    if (editorMode === "layout") {
      e.preventDefault();
      deleteSelected();
    }
  }
  if (e.key.toLowerCase() === "r" && editorMode === "layout") {
    const obj = selectedObject();
    if (obj && (obj.kind === "doorway" || obj.kind === "switch" || obj.kind === "crate")) {
      e.preventDefault();
      pushUndo();
      obj.face = cycleFace(obj.face, 1);
      clampObject(obj);
      markDirty();
      refreshAll();
    }
    if (obj && obj.kind === "slope") {
      e.preventDefault();
      pushUndo();
      if (obj.axis === "z" && obj.dir === 1) obj.dir = -1;
      else if (obj.axis === "z") {
        obj.axis = "x";
        obj.dir = 1;
      } else if (obj.dir === 1) obj.dir = -1;
      else {
        obj.axis = "z";
        obj.dir = 1;
      }
      clampObject(obj);
      markDirty();
      refreshAll();
    }
  }
  if (editorMode === "anim") {
    if (e.key === "[" || e.key === "," || e.key === "ArrowLeft") {
      e.preventDefault();
      stepFrame(-1);
      return;
    }
    if (e.key === "]" || e.key === "." || e.key === "ArrowRight") {
      e.preventDefault();
      stepFrame(1);
      return;
    }
    const k = e.key.toLowerCase();
    if (k === "x" || k === "y" || k === "z") {
      e.preventDefault();
      nudgeVert(k, e.shiftKey ? -1 : 1);
      return;
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d" && editorMode === "layout") {
    e.preventDefault();
    duplicateSelected();
  }
});

buildPalette();
setMode("layout");
updateUndoButtons();

async function boot() {
  updateDirtyIndicator();
  refreshAll();
  try {
    const loaded = await tryRestoreDocFile();
    if (loaded) {
      applyLoadedDoc(loaded);
      return;
    }
    const stored = await getStoredDocHandle();
    showFileAccessGate(stored);
    setStatus(
      stored
        ? `Click Allow to open ${stored.name}`
        : `Open ${DEFAULT_DOC_PATH} to edit the project map`,
      false
    );
  } catch (err) {
    setStatus(String(err.message || err), true);
  }
}

void boot();

setInterval(() => {
  if (editorMode === "layout") overheadView.draw();
}, 80);
  </script>
